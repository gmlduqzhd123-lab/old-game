<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro 50 Game Center - Ultimate Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col select-none">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 text-center">
        <h1 class="text-2xl font-black text-yellow-400 tracking-wider">🕹️ RETRO 50 GAME CENTER (ULTIMATE)</h1>
        <p class="text-xs text-slate-400 mt-1">50가지 고전 아케이드 및 미니게임 통합 아카이브</p>
    </header>

    <!-- Main Layout -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- Sidebar: 50 Games Directory -->
        <aside class="bg-slate-900 p-4 rounded-xl border border-slate-800 lg:col-span-1 h-[620px] overflow-y-auto space-y-4 text-xs">
            <h2 class="text-sm font-bold text-cyan-400 uppercase tracking-wider">Game Directory (50)</h2>
            
            <!-- Arcade & Action (1~15) -->
            <div class="space-y-1">
                <p class="text-xs text-slate-500 font-semibold">아케이드 & 액션 (1~15)</p>
                <button onclick="loadGame(1)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">1. 뱀 게임 (Snake)</button>
                <button onclick="loadGame(2)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">2. 퐁 (Pong)</button>
                <button onclick="loadGame(3)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">3. 벽돌깨기 (Breakout)</button>
                <button onclick="loadGame(4)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">4. 장애물 피하기</button>
                <button onclick="loadGame(5)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">5. 반응속도 테스트</button>
                <button onclick="loadGame(6)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">6. 점프 앤 러너 (Dino)</button>
                <button onclick="loadGame(7)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">7. 스페이스 슈팅</button>
                <button onclick="loadGame(8)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">8. 사과 받기 게임</button>
                <button onclick="loadGame(9)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">9. 두더지 잡기</button>
                <button onclick="loadGame(10)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">10. 미니 타워디펜스</button>
                <button onclick="loadGame(11)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">11. 테트리스 미니</button>
                <button onclick="loadGame(12)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">12. 플래피 버드 미니</button>
                <button onclick="loadGame(13)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">13. 팩맨 스타일 미니</button>
                <button onclick="loadGame(14)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">14. 갤러그 슈팅 미니</button>
                <button onclick="loadGame(15)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">15. 지렁이 레이스</button>
            </div>

            <!-- Puzzle & Brain (16~30) -->
            <div class="space-y-1">
                <p class="text-xs text-slate-500 font-semibold">퍼즐 & 두뇌 (16~30)</p>
                <button onclick="loadGame(16)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">16. 2048 퍼즐</button>
                <button onclick="loadGame(17)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">17. 지뢰찾기</button>
                <button onclick="loadGame(18)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">18. 틱택토 (삼목)</button>
                <button onclick="loadGame(19)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">19. 숫자 야구게임</button>
                <button onclick="loadGame(20)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">20. 카드 짝맞추기</button>
                <button onclick="loadGame(21)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">21. 스도쿠 미니</button>
                <button onclick="loadGame(22)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">22. 하노이의 탑</button>
                <button onclick="loadGame(23)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">23. 슬라이딩 퍼즐</button>
                <button onclick="loadGame(24)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">24. 소코반 (창고지기)</button>
                <button onclick="loadGame(25)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">25. 퍼즐 보드 맞추기</button>
                <button onclick="loadGame(26)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">26. 색상 매칭 퍼즐</button>
                <button onclick="loadGame(27)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">27. 기억력 순서 맞추기</button>
                <button onclick="loadGame(28)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">28. 단어 퍼즐 맞추기</button>
                <button onclick="loadGame(29)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">29. 연산 스피드 퀴즈</button>
                <button onclick="loadGame(30)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">30. 미로 찾기 미니</button>
            </div>

            <!-- Casual & Board (31~45) -->
            <div class="space-y-1">
                <p class="text-xs text-slate-500 font-semibold">캐주얼 & 보드 (31~45)</p>
                <button onclick="loadGame(31)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">31. 단어 낙하 타자</button>
                <button onclick="loadGame(32)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">32. 사다리 타기</button>
                <button onclick="loadGame(33)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">33. 룰렛 돌리기</button>
                <button onclick="loadGame(34)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">34. 주사위 레이스</button>
                <button onclick="loadGame(35)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">35. 오목 (Omok)</button>
                <button onclick="loadGame(36)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">36. 리듬 박자 맞추기</button>
                <button onclick="loadGame(37)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">37. 볼링 미니</button>
                <button onclick="loadGame(38)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">38. 페널티킥 축구</button>
                <button onclick="loadGame(39)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">39. 펫 키우기 타이쿤</button>
                <button onclick="loadGame(40)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">40. 픽셀 드로잉 보드</button>
                <button onclick="loadGame(41)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">41. 가위바위보 연승</button>
                <button onclick="loadGame(42)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">42. 동전 던지기 확률</button>
                <button onclick="loadGame(43)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">43. 스톱워치 1초 맞추기</button>
                <button onclick="loadGame(44)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">44. 업다운 숫자 맞추기</button>
                <button onclick="loadGame(45)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">45. 초성 퀴즈 게임</button>
            </div>

            <!-- Mini Toys & Special (46~50) -->
            <div class="space-y-1">
                <p class="text-xs text-slate-500 font-semibold">특수 토이즈 (46~50)</p>
                <button onclick="loadGame(46)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">46. 피아노 건반 치기</button>
                <button onclick="loadGame(47)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">47. 클릭 연타 챌린지</button>
                <button onclick="loadGame(48)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">48. 색맹 테스트 (다른색)</button>
                <button onclick="loadGame(49)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">49. 포춘쿠키 행운 뽑기</button>
                <button onclick="loadGame(50)" class="w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 transition">50. 불꽃놀이 장난감</button>
            </div>
        </aside>

        <!-- Game Screen Area -->
        <section class="bg-slate-900 p-6 rounded-xl border border-slate-800 lg:col-span-3 flex flex-col items-center justify-center">
            <div id="game-title" class="text-xl font-bold mb-1 text-emerald-400">1. 뱀 게임 (Snake)</div>
            <div id="game-info" class="text-xs text-slate-400 mb-3">방향키로 조작하여 먹이를 먹으세요!</div>
            
            <div id="game-container" class="bg-black w-[480px] h-[400px] flex items-center justify-center border border-slate-700 relative overflow-hidden rounded shadow-xl">
                <canvas id="canvas" width="480" height="400" class="bg-slate-950"></canvas>
            </div>
            
            <div id="score-board" class="mt-3 text-lg font-bold text-yellow-400">SCORE: 0</div>
        </section>

    </main>

    <footer class="bg-slate-900 text-center p-3 text-xs text-slate-500 border-t border-slate-800">
        Retro Game Center - 50 Ultimate Interactive Games
    </footer>

    <script>
        const container = document.getElementById('game-container');
        let currentTimer = null;
        let currentTimeout = null;
        let score = 0;

        function resetEnvironment() {
            if (currentTimer) { clearInterval(currentTimer); currentTimer = null; }
            if (currentTimeout) { clearTimeout(currentTimeout); currentTimeout = null; }
            document.onkeydown = null;
            document.onkeyup = null;
            container.innerHTML = '<canvas id="canvas" width="480" height="400" class="bg-slate-950"></canvas>';
        }

        function getCanvasContext() {
            resetEnvironment();
            return document.getElementById('canvas').getContext('2d');
        }

        const titles = [
            "1. 뱀 게임 (Snake)", "2. 퐁 (Pong)", "3. 벽돌깨기 (Breakout)", "4. 장애물 피하기", "5. 반응속도 테스트",
            "6. 점프 앤 러너 (Dino)", "7. 스페이스 슈팅", "8. 사과 받기 게임", "9. 두더지 잡기", "10. 미니 타워디펜스",
            "11. 테트리스 미니", "12. 플래피 버드 미니", "13. 팩맨 스타일 미니", "14. 갤러그 슈팅 미니", "15. 지렁이 레이스",
            "16. 2048 퍼즐", "17. 지뢰찾기", "18. 틱택토 (삼목)", "19. 숫자 야구게임", "20. 카드 짝맞추기",
            "21. 스도쿠 미니", "22. 하노이의 탑", "23. 슬라이딩 퍼즐", "24. 소코반 (창고지기)", "25. 퍼즐 보드 맞추기",
            "26. 색상 매칭 퍼즐", "27. 기억력 순서 맞추기", "28. 단어 퍼즐 맞추기", "29. 연산 스피드 퀴즈", "30. 미로 찾기 미니",
            "31. 단어 낙하 타자", "32. 사다리 타기", "33. 룰렛 돌리기", "34. 주사위 레이스", "35. 오목 (Omok)",
            "36. 리듬 박자 맞추기", "37. 볼링 미니", "38. 페널티킥 축구", "39. 펫 키우기 타이쿤", "40. 픽셀 드로잉 보드",
            "41. 가위바위보 연승", "42. 동전 던지기 확률", "43. 스톱워치 1초 맞추기", "44. 업다운 숫자 맞추기", "45. 초성 퀴즈 게임",
            "46. 피아노 건반 치기", "47. 클릭 연타 챌린지", "48. 색맹 테스트 (다른색)", "49. 포춘쿠키 행운 뽑기", "50. 불꽃놀이 장난감"
        ];

        function loadGame(id) {
            score = 0;
            document.getElementById('score-board').innerText = 'SCORE: 0';
            document.getElementById('game-title').innerText = titles[id - 1];

            switch(id) {
                // Canvas Arcade Games (1 ~ 15)
                case 1: playSnake(); break;
                case 2: playPong(); break;
                case 3: playBrick(); break;
                case 4: playDodge(); break;
                case 5: playReaction(); break;
                case 6: playDino(); break;
                case 7: playShooter(); break;
                case 8: playAppleCatch(); break;
                case 9: playMole(); break;
                case 10: playTowerDefense(); break;
                case 11: playTetris(); break;
                case 12: playFlappy(); break;
                case 13: playPacman(); break;
                case 14: playGalaga(); break;
                case 15: playWormRun(); break;

                // DOM Interactive Mini Games & Toys (16 ~ 50)
                case 16: play2048(); break;
                case 17: playMinesweeper(); break;
                case 18: playTicTacToe(); break;
                case 19: playBaseball(); break;
                case 20: playCards(); break;
                case 21: playSudoku(); break;
                case 22: playHanoi(); break;
                case 23: playSliding(); break;
                case 24: playSokoban(); break;
                case 25: playPuzzleBoard(); break;
                case 26: playColorMatch(); break;
                case 27: playSimon(); break;
                case 28: playWordPuzzle(); break;
                case 29: playMathQuiz(); break;
                case 30: playMaze(); break;
                case 31: playTyping(); break;
                case 32: playLadder(); break;
                case 33: playRoulette(); break;
                case 34: playDiceRace(); break;
                case 35: playOmok(); break;
                case 36: playRhythm(); break;
                case 37: playBowling(); break;
                case 38: playPenalty(); break;
                case 39: playTycoon(); break;
                case 40: playPixelDraw(); break;
                case 41: playRPS(); break;
                case 42: playCoinFlip(); break;
                case 43: playStopwatch(); break;
                case 44: playUpDown(); break;
                case 45: playChosung(); break;
                case 46: playPiano(); break;
                case 47: playClicker(); break;
                case 48: playColorBlind(); break;
                case 49: playFortune(); break;
                case 50: playFireworks(); break;
            }
        }

        // ==================== Canvas Games (1 ~ 15) ====================
        function playSnake() {
            document.getElementById('game-info').innerText = '방향키로 뱀을 조작해 먹이를 드세요.';
            let ctx = getCanvasContext();
            let snake = [{x:10, y:10}], food = {x:15, y:10}, dx=1, dy=0, size=20;
            document.onkeydown = e => {
                if(e.key==='ArrowUp'&&dy===0){dx=0;dy=-1;} if(e.key==='ArrowDown'&&dy===0){dx=0;dy=1;}
                if(e.key==='ArrowLeft'&&dx===0){dx=-1;dy=0;} if(e.key==='ArrowRight'&&dx===0){dx=1;dy=0;}
            };
            currentTimer = setInterval(() => {
                let head = {x: snake[0].x+dx, y: snake[0].y+dy};
                if(head.x<0||head.x>=24||head.y<0||head.y>=20||snake.slice(1).some(s=>s.x===head.x&&s.y===head.y)){
                    alert('게임 오버! 점수: '+score); loadGame(1); return;
                }
                snake.unshift(head);
                if(head.x===food.x&&head.y===food.y){
                    score+=10; document.getElementById('score-board').innerText='SCORE: '+score;
                    food={x:Math.floor(Math.random()*24), y:Math.floor(Math.random()*20)};
                } else snake.pop();
                ctx.fillStyle='#020617'; ctx.fillRect(0,0,480,400);
                ctx.fillStyle='#ef4444'; ctx.fillRect(food.x*size, food.y*size, size-2, size-2);
                ctx.fillStyle='#22c55e'; snake.forEach(s=>ctx.fillRect(s.x*size, s.y*size, size-2, size-2));
            }, 100);
        }

        function playPong() {
            document.getElementById('game-info').innerText = 'W/S 또는 방향키로 패들을 움직이세요.';
            let ctx = getCanvasContext();
            let py=160, bx=240, by=200, dx=3, dy=2, up=false, down=false;
            document.onkeydown = e => { if(e.key==='ArrowUp'||e.key==='w')up=true; if(e.key==='ArrowDown'||e.key==='s')down=true; };
            document.onkeyup = e => { if(e.key==='ArrowUp'||e.key==='w')up=false; if(e.key==='ArrowDown'||e.key==='s')down=false; };
            currentTimer = setInterval(() => {
                if(up&&py>0)py-=5; if(down&&py<320)py+=5;
                bx+=dx; by+=dy; if(by<0||by>390)dy*=-1; if(bx>470)dx*=-1;
                if(bx<=20&&by>=py&&by<=py+80){dx*=-1; score+=10; document.getElementById('score-board').innerText='SCORE: '+score;}
                if(bx<0){alert('게임 오버! 점수: '+score); loadGame(2); return;}
                ctx.fillStyle='#020617'; ctx.fillRect(0,0,480,400);
                ctx.fillStyle='#fff'; ctx.fillRect(10,py,12,80); ctx.fillRect(bx,by,10,10);
            }, 1000/60);
        }

        function playBrick() {
            document.getElementById('game-info').innerText = '좌우 방향키로 벽돌을 깨부수세요.';
            let ctx = getCanvasContext();
            let px=200, bx=240, by=200, dx=3, dy=-3, right=false, left=false;
            let bricks = []; for(let c=0;c<6;c++){bricks[c]=[]; for(let r=0;r<4;r++)bricks[c][r]={x:0,y:0,status:1};}
            document.onkeydown = e => { if(e.key==='ArrowRight')right=true; if(e.key==='ArrowLeft')left=true; };
            document.onkeyup = e => { if(e.key==='ArrowRight')right=false; if(e.key==='ArrowLeft')left=false; };
            currentTimer = setInterval(() => {
                if(right&&px<400)px+=6; if(left&&px>0)px-=6;
                bx+=dx; by+=dy; if(bx>472||bx<8)dx*=-1; if(by<8)dy*=-1;
                if(by>385&&bx>px&&bx<px+80)dy*=-1;
                if(by>400){alert('게임 오버! 점수: '+score); loadGame(3); return;}
                for(let c=0;c<6;c++){for(let r=0;r<4;r++){
                    let b=bricks[c][r]; if(b.status===1){
                        let bx_pos=c*75+30, by_pos=r*25+30;
                        if(bx>bx_pos&&bx<bx_pos+65&&by>by_pos&&by<by_pos+18){dy*=-1; b.status=0; score+=100; document.getElementById('score-board').innerText='SCORE: '+score;}
                    }
                }}
                ctx.fillStyle='#020617'; ctx.fillRect(0,0,480,400);
                for(let c=0;c<6;c++){for(let r=0;r<4;r++){
                    if(bricks[c][r].status===1){ctx.fillStyle='#38bdf8'; ctx.fillRect(c*75+30,r*25+30,65,18);}
                }}
                ctx.fillStyle='#22c55e'; ctx.fillRect(px,385,80,12);
                ctx.fillStyle='#ef4444'; ctx.beginPath(); ctx.arc(bx,by,8,0,Math.PI*2); ctx.fill();
            }, 1000/60);
        }

        function playDodge() {
            document.getElementById('game-info').innerText = '좌우 방향키로 떨어지는 장애물을 피하세요.';
            let ctx = getCanvasContext();
            let px=220, obs=[], frame=0, right=false, left=false;
            document.onkeydown = e => { if(e.key==='ArrowRight')right=true; if(e.key==='ArrowLeft')left=true; };
            document.onkeyup = e => { if(e.key==='ArrowRight')right=false; if(e.key==='ArrowLeft')left=false; };
            currentTimer = setInterval(() => {
                frame++; if(right&&px<440)px+=6; if(left&&px>0)px-=6;
                if(frame%35===0)obs.push({x:Math.random()*440, y:0, speed:3+Math.random()*3});
                for(let i=obs.length-1;i>=0;i--){
                    obs[i].y+=obs[i].speed;
                    if(obs[i].x<px+40&&obs[i].x+30>px&&obs[i].y<380+20&&obs[i].y+30>380){
                        alert('게임 오버! 점수: '+score); loadGame(4); return;
                    }
                    if(obs[i].y>400){obs.splice(i,1); score+=10; document.getElementById('score-board').innerText='SCORE: '+score;}
                }
                ctx.fillStyle='#020617'; ctx.fillRect(0,0,480,400);
                ctx.fillStyle='#10b981'; ctx.fillRect(px,380,40,20);
                ctx.fillStyle='#f43f5e'; obs.forEach(o=>ctx.fillRect(o.x,o.y,30,30));

        function playReaction() {
            document.getElementById('game-info').innerText = '초록색으로 바뀔 때 최대한 빨리 클릭하세요!';
            let ctx = getCanvasContext();
            let state='wait', start=0;
            function draw(bg, txt){ ctx.fillStyle=bg; ctx.fillRect(0,0,480,400); ctx.fillStyle='#fff'; ctx.font='20px sans-serif'; ctx.textAlign='center'; ctx.fillText(txt,240,200); }
            draw('#334155','클릭하여 시작');
            document.getElementById('canvas').onclick = () => {
                if(state==='wait'||state==='end'){
                    state='ready'; draw('#ef4444','기다리세요...');
                    currentTimeout = setTimeout(()=>{ state='click'; start=Date.now(); draw('#22c55e','지금 클릭!!'); }, 1500+Math.random()*2000);
                }else if(state==='ready'){
                    if(currentTimeout) clearTimeout(currentTimeout);
                    state='wait'; draw('#b91c1c','너무 빨랐습니다! 다시 클릭');
                }else if(state==='click'){
                    let t = Date.now()-start; state='end'; document.getElementById('score-board').innerText='RECORD: '+t+'ms';
                    draw('#1e293b', `반응속도: ${t}ms (다시 하려면 클릭)`);
                }
            };
        }

        function playShooter() {
            document.getElementById('game-info').innerText = '좌우 이동, 스페이스바로 발사!';
            let ctx = getCanvasContext();
            let px=220, bullets=[], aliens=[], frame=0, left=false, right=false;
            document.onkeydown = e => {
                if(e.key==='ArrowLeft')left=true; if(e.key==='ArrowRight')right=true;
                if(e.key===' ')bullets.push({x:px+18, y:350});
            };
            document.onkeyup = e => { if(e.key==='ArrowLeft')left=false; if(e.key==='ArrowRight')right=false; };
            currentTimer = setInterval(() => {
                frame++; if(left&&px>0)px-=5; if(right&&px<440)px+=5;
                if(frame%40===0)aliens.push({x:Math.random()*440, y:0});
                bullets.forEach((b,i)=> { b.y-=8; if(b.y<0)bullets.splice(i,1); });
                for(let i=aliens.length-1; i>=0; i--){
                    aliens[i].y+=2;
                    if(aliens[i].y>380){alert('게임 오버! 점수: '+score); loadGame(7); return;}
                    for(let j=bullets.length-1; j>=0; j--){
                        if(bullets[j]&&aliens[i]&&bullets[j].x>aliens[i].x&&bullets[j].x<aliens[i].x+30&&bullets[j].y>aliens[i].y&&bullets[j].y<aliens[i].y+30){
                            aliens.splice(i,1); bullets.splice(j,1); score+=20;
                            document.getElementById('score-board').innerText='SCORE: '+score; break;
                        }
                    }
                }
                ctx.fillStyle='#020617'; ctx.fillRect(0,0,480,400);
                ctx.fillStyle='#22c55e'; ctx.fillRect(px,360,40,20);
                ctx.fillStyle='#ef4444'; bullets.forEach(b=>ctx.fillRect(b.x,b.y,4,10));
                ctx.fillStyle='#a855f7'; aliens.forEach(a=>ctx.fillRect(a.x,a.y,30,30));
            }, 1000/60);
        }

            document.getElementById('game-info').innerText = '떨어지는 사과를 바구니로 받으세요.';
            let ctx = getCanvasContext();
            let px=200, apples=[], frame=0, left=false, right=false;
            document.onkeydown = e => { if(e.key==='ArrowLeft')left=true; if(e.key==='ArrowRight')right=true; };

                    apples[i].y+=apples[i].speed;

        function playMole() {
            document.getElementById('game-info').innerText = '나타나는 두더지를 클릭하세요!';
            let ctx = getCanvasContext();
            let holes = [{x:100,y:100},{x:240,y:100},{x:380,y:100},{x:150,y:280},{x:330,y:280}];
            let active = 0, frame = 0;
            document.getElementById('canvas').onclick = e => {
                let rect = e.target.getBoundingClientRect();
                let mx = e.clientX - rect.left, my = e.clientY - rect.top;
                let h = holes[active];
                if(h && Math.hypot(mx-h.x, my-h.y)<30){
                    score+=100; document.getElementById('score-board').innerText='SCORE: '+score; active=-1;
                }
            };
            currentTimer = setInterval(() => {
                frame++; if(frame%55===0) active = Math.floor(Math.random()*5);
                ctx.fillStyle='#020617'; ctx.fillRect(0,0,480,400);
                holes.forEach((h,i)=>{
                    ctx.fillStyle='#334155'; ctx.beginPath(); ctx.arc(h.x,h.y,30,0,Math.PI*2); ctx.fill();
                    if(i===active){ ctx.fillStyle='#22c55e'; ctx.beginPath(); ctx.arc(h.x,h.y,20,0,Math.PI*2); ctx.fill(); }
                });
            }, 1000/60);
        }

            document.getElementById('game-info').innerText = '몰려오는 적을 클릭해 처치하세요.';

        function playPiano() { playDOMGame(`<div class="text-sm text-cyan-400">피아노 건반 치기</div><div class="flex gap-1 mt-4"><button onclick="alert('도')" class="w-12 h-24 bg-white text-black font-bold flex items-end justify-center pb-2">도</button><button onclick="alert('레')" class="w-12 h-24 bg-white text-black font-bold flex items-end justify-center pb-2">레</button></div>`, '피아노 건반'); }
        function playClicker() { playDOMGame(`<div class="text-sm text-yellow-400">클릭 연타 챌린지</div><button onclick="score++; document.getElementById('score-board').innerText='SCORE: '+score" class="mt-4 px-6 py-3 bg-red-600 rounded font-bold text-lg">연타 클릭!</button>`, '클릭 연타'); }
        function playColorBlind() { playDOMGame(`<div class="text-sm text-emerald-400">색맹 테스트</div><div class="grid grid-cols-3 gap-2 bg-slate-800 p-3"><button class="w-12 h-12 bg-indigo-600"></button><button class="w-12 h-12 bg-indigo-500"></button></div>`, '다른 색 찾기'); }
        function playFortune() { playDOMGame(`<div class="text-sm text-yellow-400">포춘쿠키 행운 뽑기</div><button onclick="alert('오늘의 운세: 대길! 만사형통!')" class="mt-4 px-4 py-2 bg-indigo-600 rounded">쿠키 깨기</button>`, '포춘쿠키'); }
        function playFireworks() { playDOMGame(`<div class="text-sm text-cyan-400">디지털 불꽃놀이</div><button onclick="alert('🎆 팡팡! 아름다운 불꽃놀이!')" class="mt-4 px-4 py-2 bg-pink-600 rounded">불꽃 터트리기</button>`, '불꽃놀이 장난감'); }

        // 초기 실행 (1번 뱀 게임)
        loadGame(1);
    </script>
