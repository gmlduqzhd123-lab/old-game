name: 기본 점검
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: site/${{ github.event.repository.name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 점검 도구 설치
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: 실제 주소와 같은 경로로 띄우기
        run: (cd site && python3 -m http.server 8080 >/dev/null 2>&1 &) && sleep 2
      - name: 첫 화면 점검
        run: SMOKE_URL=http://localhost:8080/${{ github.event.repository.name }}/ node site/${{ github.event.repository.name }}/tests/smoke.mjs
