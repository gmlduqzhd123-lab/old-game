                const b = data.boards[data.cur], cnt = b.s.filter(Boolean).length;
                wrap.innerHTML = `<div class="flex gap-2 items-center mb-2 w-full max-w-[400px]"><select id="sk-sel" class="flex-1 bg-slate-800 border border-slate-600 rounded-lg px-2 py-2">${Object.keys(data.boards).map(n => `<option ${n === data.cur ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select><button id="sk-add" class="px-3 py-2 bg-indigo-600 rounded-lg text-sm">➕ 이름</button><button id="sk-del" class="px-3 py-2 bg-slate-700 rounded-lg text-sm">🗑️</button></div><p class="text-lg mb-1"><b class="text-yellow-300">${esc(data.cur)}</b> · ${cnt}/${SIZE}개 ${b.done ? `· 완성 ${b.done}판 🏅` : ''}</p><div class="flex gap-1 mb-2">${KINDS.map(k => `<button data-k="${k}" class="text-2xl w-9 h-9 rounded-lg ${k === kind ? 'bg-yellow-500' : 'bg-slate-800'}">${k}</button>`).join('')}</div><div id="sk-grid" class="grid grid-cols-6 gap-1.5 w-full max-w-[360px] bg-amber-100 p-2 rounded-2xl">${b.s.map((v, i) => `<button data-i="${i}" class="aspect-square rounded-full ${v ? 'bg-white' : 'bg-amber-200/60 border-2 border-dashed border-amber-400'} text-2xl md:text-3xl flex items-center justify-center text-amber-400 text-xs">${v ? `<span class="pop text-2xl md:text-3xl">${v}</span>` : i + 1}</button>`).join('')}</div><p class="text-xs text-slate-500 mt-2">빈칸을 누르면 스티커 붙이기 · 붙인 스티커를 누르면 떼기</p>`;
                $('sk-sel').addEventListener('change', e => { data.cur = e.target.value; save(); render(); });
                $('sk-add').addEventListener('click', () => { const n = (prompt('학생(또는 모둠) 이름을 입력하세요') || '').trim().slice(0, 12); if(!n) return; if(!data.boards[n]) data.boards[n] = { s: Array(SIZE).fill(''), done: 0 }; data.cur = n; save(); render(); });
                $('sk-del').addEventListener('click', () => { if(Object.keys(data.boards).length <= 1) return alert('판이 하나뿐이에요.'); if(!confirm(`'${data.cur}' 스티커판을 삭제할까요?`)) return; delete data.boards[data.cur]; data.cur = Object.keys(data.boards)[0]; save(); render(); });
                wrap.querySelectorAll('[data-k]').forEach(x => x.addEventListener('click', () => { kind = x.dataset.k; render(); }));
                $('sk-grid').addEventListener('click', e => {
                    const c = e.target.closest('[data-i]'); if(!c) return; const i = +c.dataset.i;
                    b.s[i] = b.s[i] ? '' : kind; (b.s[i] ? sfx.coin : sfx.tick)(); save();
                    if(b.s.every(Boolean)){ b.done++; save(); render(); celebrate(); } else render();
                });
            };
            const celebrate = () => {
                sfx.win(); const ov = document.createElement('div');
                ov.className = 'absolute inset-0 bg-black/80 flex flex-col items-center justify-center z-40 rounded-xl';
                ov.innerHTML = `<div class="text-8xl mb-4 animate-bounce">🏆</div><p class="text-3xl font-black text-yellow-300 mb-2">스티커판 완성!</p><p class="text-lg text-white mb-6">${esc(data.cur)} 최고예요! 👏</p><button id="sk-new" class="px-6 py-3 ${btnCls('bg-emerald-600', 'rgb(4,120,87)')}">새 판 시작하기</button>`;
                wrap.appendChild(ov);
                $('sk-new').addEventListener('click', () => { data.boards[data.cur].s = Array(SIZE).fill(''); save(); render(); });
            };
            render();
        }};

        // ==========================================
        // 12. 엽쌤 스페셜 엔진
        // ==========================================

        // --- 숨은 그림 찾기: 30초, 단계마다 칸 증가, 오답 -3초 ---
        E.find_target = { ctl: 'none', run(g){
            const wrap = makeWrap(); let lv = 1, tg = 0;
            wrap.innerHTML = timeBar('fd-bar') + statBar([['fd-lv', 'LV 1'], ['fd-goal', `찾을 것: ${g.cfg.ico}`]]) + `<div id="fd-grid" class="grid gap-1 w-full max-w-[340px] aspect-square"></div>`;
            const timer = countdown(30, 'fd-bar', () => finish(`LV ${lv}까지 찾았어요! 점수 ${score}`));
            const next = () => {
                const n = Math.min(9, 3 + Math.floor(lv / 2)); tg = rnd(0, n * n - 1);
                const el = $('fd-grid'); el.style.gridTemplateColumns = `repeat(${n},1fr)`;
                el.innerHTML = Array.from({length: n * n}, (_, i) => `<button data-i="${i}" class="bg-slate-800 rounded-md flex items-center justify-center active:scale-90 transition" style="font-size:${Math.floor(240 / n)}px;line-height:1">${i === tg ? g.cfg.ico : g.cfg.bg}</button>`).join('');
            };
            $('fd-grid').addEventListener('click', e => {
                const b = e.target.closest('[data-i]'); if(!b || G.over) return;
                if(+b.dataset.i === tg){ addScore(10 + lv * 2); lv++; timer.add(800); sfx.coin(); setTxt('fd-lv', 'LV ' + lv); next(); }
                else { timer.sub(3000); sfx.bad(); shakeEl($('fd-grid')); }
            });
            next();
        }};

        // --- 순서대로 누르기: 기록 측정, 오답 +2초 패널티, 매번 새 배치 ---
        E.order_click = { ctl: 'none', run(g){
            const wrap = makeWrap(); const arr = g.cfg.type === 'alpha' ? 'ABCDEFGHIJKLMNOP'.split('') : Array.from({length: 16}, (_, i) => String(i + 1));
            let cur = 0, t0 = 0, pen = 0, started = false;
            wrap.innerHTML = statBar([['oc-next', `다음: ${arr[0]}`], ['oc-time', '⏱️ 0.00초']]) + `<div id="oc-grid" class="grid grid-cols-4 gap-2 w-full max-w-[320px] aspect-square">${shuffle(arr).map(v => `<button data-v="${v}" class="text-3xl font-black bg-slate-800 rounded-xl hover:bg-slate-700 shadow-lg transition active:scale-95" style="color:hsl(${rnd(0, 360)},80%,70%)">${v}</button>`).join('')}</div><p class="text-xs text-slate-500 mt-3">첫 버튼을 누르면 시간이 시작돼요 · 틀리면 +2초</p>`;
            const tick = () => { if(!G.alive) return; setTxt('oc-time', `⏱️ ${((performance.now() - t0) / 1000 + pen).toFixed(2)}초`); G.raf = requestAnimationFrame(tick); };
            $('oc-grid').addEventListener('click', e => {
                const b = e.target.closest('[data-v]'); if(!b || G.over || b.disabled) return;
                if(b.dataset.v === arr[cur]){
                    if(!started){ started = true; t0 = performance.now(); G.raf = requestAnimationFrame(tick); }
                    b.disabled = true; b.classList.replace('bg-slate-800', 'bg-emerald-600'); b.style.color = '#fff'; cur++; tone(400 + cur * 30, .05, 'square', .04);
                    setTxt('oc-next', cur < arr.length ? `다음: ${arr[cur]}` : '완료!');
                    if(cur === arr.length){ const tt = (performance.now() - t0) / 1000 + pen; setScore(Math.max(10, Math.round(1500 - tt * 60))); win(`기록 ${tt.toFixed(2)}초! ${tt < 8 ? '⚡ 번개 손!' : tt < 14 ? '👍 훌륭해요!' : '💪 다음엔 더 빨리!'}`); }
                } else if(started){ pen += 2; sfx.bad(); shakeEl(b); }
            });
        }};

        // --- 색깔 함정(스트룹): 30초, 글자색 vs 뜻, 콤보 ---
        E.stroop = { ctl: 'none', run(g){
            const wrap = makeWrap(); const C = [['빨강', '#ef4444'], ['파랑', '#3b82f6'], ['초록', '#22c55e'], ['노랑', '#eab308'], ['보라', '#a855f7']];
            let ci = 0, combo = 0, cnt = 0;
            wrap.innerHTML = timeBar('sp-bar') + statBar([['sp-combo', '콤보 0'], ['sp-cnt', '정답 0']]) + `<p class="text-slate-400 mb-2">글자의 <b class="text-white">색깔</b>을 고르세요! (뜻 말고 색!)</p><div id="sp-word" class="text-7xl md:text-8xl font-black mb-6 h-28 flex items-center"></div><div id="sp-btns" class="grid grid-cols-3 gap-2 w-full max-w-[360px]">${C.map((c, i) => `<button data-i="${i}" class="py-4 rounded-xl font-bold text-xl bg-slate-700 border-2 border-slate-500 active:scale-95">${c[0]}</button>`).join('')}</div>`;
            const timer = countdown(30, 'sp-bar', () => finish(`30초 동안 ${cnt}개 정답! 점수 ${score}`));
            const next = () => { ci = rnd(0, C.length - 1); let wi; do { wi = rnd(0, C.length - 1); } while(wi === ci && Math.random() < .8); const el = $('sp-word'); el.textContent = C[wi][0]; el.style.color = C[ci][1]; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); };
            $('sp-btns').addEventListener('click', e => {
                const b = e.target.closest('[data-i]'); if(!b || G.over) return;
                if(+b.dataset.i === ci){ combo++; cnt++; addScore(10 + Math.min(combo, 10) * 2); sfx.coin(); }
                else { combo = 0; timer.sub(3000); sfx.bad(); shakeEl($('sp-word')); }
                setTxt('sp-combo', '콤보 ' + combo); setTxt('sp-cnt', '정답 ' + cnt); next();
            });
            next();
        }};

        // --- 잡기 게임 (알람/풍선/모기/지구 지키기): 모드별 움직임, 30초 또는 생명제 ---
        E.catch_dom = { ctl: 'none', run(g){
            const mode = g.cfg.mode, wrap = makeWrap();
            wrap.innerHTML = (mode === 'fall' ? '' : timeBar('cd-bar')) + statBar([['cd-a', ''], ['cd-b', '']]) + `<div id="cd-area" class="relative w-full flex-1 min-h-[260px] rounded-2xl overflow-hidden border-2 border-slate-700 no-touch" style="background:${mode === 'rise' ? 'linear-gradient(#38bdf8,#bae6fd)' : mode === 'fall' ? 'radial-gradient(circle at 50% 120%,#1e3a8a,#020617 70%)' : mode === 'fly' ? '#fef3c7' : '#1e293b'}"></div>`;
            const area = $('cd-area'); let objs = [], hits = 0, miss = 0, t = 0, lives = 5, AW = area.clientWidth, AH = area.clientHeight;
            const mk = (e, x, y, size, extra = {}) => { const el = document.createElement('div'); el.className = 'absolute select-none cursor-pointer'; el.style.fontSize = size + 'px'; el.style.lineHeight = '1'; el.textContent = e; area.appendChild(el); const o = { el, x, y, size, e, ...extra }; objs.push(o); return o; };
            const place = o => { o.el.style.transform = `translate(${o.x - o.size / 2}px,${o.y - o.size / 2}px)`; };
            const remove = o => { o.el.remove(); objs = objs.filter(x => x !== o); };
            if(mode === 'fall'){ const earth = document.createElement('div'); earth.className = 'absolute left-1/2 -translate-x-1/2 text-7xl'; earth.style.bottom = '-26px'; earth.textContent = '🌍'; area.appendChild(earth); }
            const labelA = () => mode === 'fall' ? `지구 체력 ${'💚'.repeat(lives)}` : `잡은 수 ${hits}`;
            const upd = () => { setTxt('cd-a', labelA()); setTxt('cd-b', mode === 'fall' ? `막은 쓰레기 ${hits}` : `놓침 ${miss}`); };
            if(mode !== 'fall') countdown(30, 'cd-bar', () => finish(`30초 동안 ${hits}번 성공! 점수 ${score}`));
            // 모드별 대상 생성
            const spawn = () => {
                AW = area.clientWidth; AH = area.clientHeight;
                if(mode === 'jump'){ if(!objs.length){ const o = mk('⏰', AW / 2, AH / 2, 64, { next: 0 }); place(o); } }
                if(mode === 'fly'){ while(objs.length < 1 + Math.floor(hits / 6)){ const o = mk('🦟', rnd(30, AW - 30), rnd(30, AH - 30), 40, { vx: 0, vy: 0, ph: Math.random() * 9 }); place(o); } }
                if(mode === 'rise' && t % Math.max(12, 32 - Math.floor(hits / 3)) === 0){ const bomb = Math.random() < .15; const o = mk(bomb ? '💣' : pick(['🎈', '🎈', '🎈', '🎀', '🎈']), rnd(30, AW - 30), AH + 40, bomb ? 44 : 52, { vy: -(1.4 + Math.random() * 1.2 + hits * .03), bomb, sway: Math.random() * 6 }); if(!bomb && Math.random() < .3){ o.el.style.filter = `hue-rotate(${rnd(0, 360)}deg)`; } place(o); }
                if(mode === 'fall' && t % Math.max(18, 60 - hits) === 0){ const o = mk(pick(['🥤', '🛍️', '🍾', '🥫', '🧃', '🚬', '📦']), rnd(30, AW - 30), -30, 40, { vy: .8 + Math.random() * .8 + hits * .02, vx: 0 }); o.vx = (AW / 2 - o.x) / ((AH - 40) / o.vy) * .7; place(o); }
            };
            const hitObj = (o, cx, cy) => {
                if(G.over) return;
                if(o.bomb){ remove(o); sfx.boom(); addScore(-50); floatText(area, '💥 -50', cx, cy, '#f87171'); shakeEl(area); return; }
                remove(o); hits++;
                const pts = mode === 'fly' ? 30 : mode === 'jump' ? 25 : 15; addScore(pts); (mode === 'rise' ? sfx.pop : sfx.coin)();
                floatText(area, mode === 'fly' ? '👏 찰싹!' : mode === 'rise' ? '💥 펑!' : mode === 'fall' ? '♻️ 수거!' : '🔕 꺼짐!', cx, cy, '#facc15');
                upd();
            };
            listen(area, 'pointerdown', e => {
                e.preventDefault(); const r = area.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
                let best = null, bd = 1e9; for(const o of objs){ const d = Math.hypot(o.x - x, o.y - y); if(d < o.size * .75 && d < bd){ bd = d; best = o; } }
                if(best) hitObj(best, x, y); else if(mode !== 'fall'){ miss++; upd(); if(mode === 'fly') tone(180, .05, 'square', .03); }
            });
            loop(() => {
                t++; spawn();
                for(const o of [...objs]){
                    if(mode === 'jump'){ if(--o.next <= 0){ o.next = Math.max(28, 70 - hits * 2); o.x = rnd(40, AW - 40); o.y = rnd(40, AH - 40); if(t > 30) tone(1400, .04, 'square', .02); } }
                    if(mode === 'fly'){ o.ph += .05; o.vx += (Math.random() - .5) * (1.2 + hits * .05) + Math.cos(o.ph) * .2; o.vy += (Math.random() - .5) * (1.2 + hits * .05); const sp = Math.hypot(o.vx, o.vy), mx = 3 + hits * .15; if(sp > mx){ o.vx *= mx / sp; o.vy *= mx / sp; } o.x += o.vx; o.y += o.vy; if(o.x < 20 || o.x > AW - 20) o.vx *= -1; if(o.y < 20 || o.y > AH - 20) o.vy *= -1; o.x = clamp(o.x, 20, AW - 20); o.y = clamp(o.y, 20, AH - 20); o.el.style.opacity = .7 + Math.sin(t / 3) * .3; }
                    if(mode === 'rise'){ o.y += o.vy; o.x += Math.sin(t / 20 + o.sway) * .6; if(o.y < -60){ if(!o.bomb){ miss++; upd(); } remove(o); continue; } }
                    if(mode === 'fall'){ o.y += o.vy; o.x += o.vx; if(o.y > AH - 30){ remove(o); lives--; sfx.bad(); shakeEl(area); upd(); if(lives <= 0) return gameOver(`지구가 쓰레기로 뒤덮였어요 🌍💦\n막은 쓰레기 ${hits}개`); continue; } }
                    place(o);
                }
            }, () => {});
            upd();
        }};

        // --- 비밀번호 풀기: 자릿수별 업/다운 힌트, 자물쇠 3개(3→4→5자리) ---
        E.lock = { ctl: 'none', run(g){
            const wrap = makeWrap(); let stage = 0, digits, secret, tries, input;
            const TRIES = [6, 6, 7];
            const start = () => {
                digits = 3 + stage; secret = Array.from({length: digits}, () => rnd(0, 9)); tries = 0; input = Array(digits).fill(0);
                const sum = secret.reduce((a, b) => a + b, 0);
                wrap.innerHTML = statBar([['lk-st', `자물쇠 ${stage + 1}/3`], ['lk-tr', `남은 기회 ${TRIES[stage]}`]]) + `<div class="text-6xl mb-2">🔒</div><p class="text-sm text-slate-300 mb-3">💡 힌트: 모든 숫자의 합은 <b class="text-yellow-300">${sum}</b> · 틀리면 자리별로 ⬆️(더 큼) ⬇️(더 작음) ✅ 를 알려줘요</p><div id="lk-dials" class="flex gap-2 mb-4">${input.map((_, i) => `<div class="flex flex-col items-center gap-1"><button data-up="${i}" class="w-12 h-9 bg-slate-700 rounded-lg active:scale-90">▲</button><div id="lk-d${i}" class="w-12 h-14 bg-slate-800 border-2 border-slate-500 rounded-xl flex items-center justify-center text-3xl font-black">0</div><button data-dn="${i}" class="w-12 h-9 bg-slate-700 rounded-lg active:scale-90">▼</button></div>`).join('')}</div><button id="lk-go" class="px-10 py-3 ${btnCls('bg-emerald-600', 'rgb(4,120,87)')} text-xl mb-3">🔓 열기</button><div id="lk-log" class="space-y-1 text-lg font-mono"></div>`;
                const show = () => input.forEach((v, i) => setTxt('lk-d' + i, v));
                wrap.querySelectorAll('[data-up]').forEach(b => b.addEventListener('click', () => { const i = +b.dataset.up; input[i] = (input[i] + 1) % 10; sfx.tick(); show(); }));
                wrap.querySelectorAll('[data-dn]').forEach(b => b.addEventListener('click', () => { const i = +b.dataset.dn; input[i] = (input[i] + 9) % 10; sfx.tick(); show(); }));
                $('lk-go').addEventListener('click', tryOpen);
            };
            const tryOpen = () => {
                if(G.over) return; tries++;
                const hint = input.map((v, i) => v === secret[i] ? '✅' : v < secret[i] ? '⬆️' : '⬇️');
                $('lk-log').insertAdjacentHTML('afterbegin', `<p class="pop">${input.join(' ')} → ${hint.join(' ')}</p>`);
                setTxt('lk-tr', `남은 기회 ${TRIES[stage] - tries}`);
                if(hint.every(h => h === '✅')){
                    addScore((TRIES[stage] - tries + 1) * 50 * (stage + 1)); sfx.win();
                    if(stage === 2) return win(`자물쇠 3개를 모두 열었어요! 🔓`);
                    stage++; after(start, 900); return;
                }
                sfx.bad(); shakeEl($('lk-dials'));
                if(tries >= TRIES[stage]) gameOver(`비밀번호는 ${secret.join('')} 였어요!`);
            };
            start();
        }};

        // --- 분리수거: 5가지 통, 25종 쓰레기, 45초, 오답 시 설명 ---
        E.recycle = { ctl: 'none', run(g){
            const BINS = [['paper', '📄 종이', 'bg-blue-600'], ['plastic', '🧴 플라스틱', 'bg-orange-500'], ['can', '🥫 캔·고철', 'bg-yellow-500 text-slate-900'], ['glass', '🍾 유리', 'bg-emerald-600'], ['general', '🗑️ 일반', 'bg-slate-500']];
            const ITEMS = [['📰', '신문지', 'paper', ''], ['📦', '택배 상자', 'paper', '테이프와 송장은 떼고 버려요.'], ['📚', '헌 공책', 'paper', '스프링은 빼고 버려요.'], ['📄', 'A4 용지', 'paper', ''], ['🧻', '사용한 휴지', 'general', '휴지는 재활용이 안 돼서 일반쓰레기예요.'], ['🧴', '샴푸 통', 'plastic', '내용물을 비우고 헹궈서 버려요.'], ['🥤', '페트병', 'plastic', '라벨을 떼고 찌그러뜨려 버려요.'], ['🥡', '플라스틱 용기', 'plastic', '음식물을 깨끗이 씻어서 버려요.'], ['🪥', '칫솔', 'general', '칫솔은 여러 재질이 섞여 일반쓰레기예요.'], ['🥫', '참치 캔', 'can', '기름을 닦아내고 버려요.'], ['🍺', '음료 캔', 'can', ''], ['🍳', '프라이팬', 'can', '프라이팬은 고철로 분리해요.'], ['🔩', '못과 나사', 'can', ''], ['🍾', '유리병', 'glass', '뚜껑은 따로 분리해요.'], ['🫙', '잼 병', 'glass', '깨끗이 헹궈서 버려요.'], ['🍶', '소스 병', 'glass', ''], ['🍗', '치킨 뼈', 'general', '뼈는 음식물쓰레기가 아니라 일반쓰레기예요!'], ['🍑', '복숭아 씨', 'general', '딱딱한 씨는 일반쓰레기예요.'], ['🩹', '반창고', 'general', ''], ['🖍️', '크레파스', 'general', ''], ['🥢', '나무젓가락', 'general', '나무젓가락은 일반쓰레기예요.'], ['🍜', '더러운 컵라면 용기', 'general', '오염된 용기는 재활용이 어려워요.'], ['🧃', '주스 페트병', 'plastic', ''], ['🥛', '우유 팩', 'paper', '종이팩은 헹궈서 말린 뒤 종이팩으로 따로 모으면 더 좋아요.'], ['🧸', '망가진 인형', 'general', '']];
            const wrap = makeWrap(); let cur, lives = 3, combo = 0, cnt = 0, busy = false;
            wrap.innerHTML = timeBar('rc-bar') + statBar([['rc-life', hearts(3)], ['rc-cnt', '0개 정리']]) + `<div id="rc-item" class="bg-slate-800 border-2 border-slate-600 rounded-2xl px-6 py-4 mb-3 shadow-lg min-w-[200px]"><div id="rc-emo" class="text-6xl md:text-7xl"></div><div id="rc-name" class="text-xl font-bold mt-1"></div></div><p id="rc-tip" class="text-sm h-10 mb-2 text-slate-300 max-w-[360px]"></p><div class="grid grid-cols-3 md:grid-cols-5 gap-2 w-full max-w-[460px]">${BINS.map(b => `<button data-b="${b[0]}" class="py-4 rounded-xl font-bold text-base ${b[2]} shadow-lg active:scale-95 transition">${b[1]}</button>`).join('')}</div>`;
            countdown(45, 'rc-bar', () => finish(`45초 동안 ${cnt}개를 올바르게 분리했어요! ♻️`));
            let bag = [];
            const next = () => { if(!bag.length) bag = shuffle(ITEMS); cur = bag.pop(); setTxt('rc-emo', cur[0]); setTxt('rc-name', cur[1]); const it = $('rc-item'); it.classList.remove('pop'); void it.offsetWidth; it.classList.add('pop'); busy = false; };
            wrap.querySelectorAll('[data-b]').forEach(b => b.addEventListener('click', () => {
                if(busy || G.over) return;
                if(b.dataset.b === cur[2]){ combo++; cnt++; addScore(10 + combo * 2); sfx.good(); setTxt('rc-tip', cur[3] ? `⭕ ${cur[3]}` : '⭕ 정답!'); setTxt('rc-cnt', `${cnt}개 정리`); next(); }
                else {
                    combo = 0; lives--; sfx.bad(); shakeEl($('rc-item')); setTxt('rc-life', hearts(lives));
                    setHTML('rc-tip', `<span class="text-red-300">❌ ${esc(cur[1])}은(는) <b>${BINS.find(x => x[0] === cur[2])[1]}</b>! ${esc(cur[3])}</span>`);
                    if(lives <= 0) return after(() => gameOver(`${cnt}개 정리 · 분리수거를 조금 더 연습해요!`), 1200);
                    busy = true; after(next, 1400);
                }
            }));
            next();
        }};

        // --- 시력 테스트: 비슷한 글자 중 다른 하나, 점점 작아지고 많아짐 ---
        E.vision = { ctl: 'none', run(g){
            const PAIRS = [['O', 'Q'], ['E', 'F'], ['8', 'B'], ['빵', '빰'], ['봄', '봅'], ['6', '9'], ['m', 'n'], ['곰', '공'], ['W', 'V'], ['ㅏ', 'ㅑ'], ['C', 'G'], ['눈', '늘'], ['1', 'l'], ['귤', '굴']];
            const wrap = makeWrap(); let lv = 1, odd = 0, lives = 3;
            wrap.innerHTML = timeBar('vs-bar') + statBar([['vs-lv', 'LV 1'], ['vs-life', hearts(3)]]) + `<p class="text-slate-400 mb-2">다른 글자 하나를 찾으세요!</p><div id="vs-grid" class="grid gap-0.5 w-full max-w-[340px] aspect-square bg-white rounded-xl p-2"></div>`;
            const timer = countdown(40, 'vs-bar', () => finish(`시력 LV ${lv} 도달! 👓 점수 ${score}`));
            const next = () => {
                const n = Math.min(10, 3 + Math.floor(lv / 2)), [a, b] = shuffle(pick(PAIRS)); odd = rnd(0, n * n - 1);
                const fs = Math.max(10, Math.floor(300 / n) - lv * 1.2);
                const el = $('vs-grid'); el.style.gridTemplateColumns = `repeat(${n},1fr)`;
                el.innerHTML = Array.from({length: n * n}, (_, i) => `<button data-i="${i}" class="flex items-center justify-center text-slate-900 font-bold hover:bg-slate-200 rounded" style="font-size:${fs}px;line-height:1;font-family:sans-serif">${i === odd ? b : a}</button>`).join('');
            };
            $('vs-grid').addEventListener('click', e => {
                const b = e.target.closest('[data-i]'); if(!b || G.over) return;
                if(+b.dataset.i === odd){ addScore(10 + lv * 3); lv++; timer.add(1000); sfx.coin(); setTxt('vs-lv', 'LV ' + lv); next(); }
                else { lives--; sfx.bad(); setTxt('vs-life', hearts(lives)); b.classList.add('bg-red-300'); if(lives <= 0) return gameOver(`시력 LV ${lv}에서 멈췄어요 👓`); }
            });
            next();
        }};

        // --- 짝수 홀수: 문제마다 제한시간 감소, 생명 3, ←/→ 키 ---
        E.even_odd = { ctl: 'none', run(g){
            const wrap = makeWrap(); let num = 0, lives = 3, combo = 0, cnt = 0, limit = 3000, qt = 0;
            wrap.innerHTML = timeBar('eo-bar') + statBar([['eo-life', hearts(3)], ['eo-cnt', '정답 0'], ['eo-combo', '콤보 0']]) + `<div id="eo-num" class="text-7xl md:text-9xl mb-8 bg-slate-800 py-6 px-12 rounded-3xl shadow-lg font-black text-white tabular-nums">0</div><div class="flex gap-4"><button id="eo-e" class="px-8 py-5 ${btnCls('bg-indigo-600', 'rgb(55,48,163)')} text-2xl">◀ 짝수</button><button id="eo-o" class="px-8 py-5 ${btnCls('bg-pink-600', 'rgb(157,23,77)')} text-2xl">홀수 ▶</button></div><p class="text-xs text-slate-500 mt-3">키보드 ← 짝수 · → 홀수</p>`;
            const next = () => { num = cnt > 15 ? rnd(100, 9999) : cnt > 6 ? rnd(10, 999) : rnd(1, 99); setTxt('eo-num', num); limit = Math.max(1100, 3000 - cnt * 70); qt = performance.now(); const el = $('eo-num'); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); };
            const judge = isEven => {
                if(G.over) return;
                if(isEven !== null && (num % 2 === 0) === isEven){ combo++; cnt++; addScore(10 + Math.min(combo, 20)); sfx.coin(); }
                else { combo = 0; lives--; sfx.bad(); shakeEl($('eo-num')); setTxt('eo-life', hearts(lives)); if(lives <= 0) return gameOver(`${cnt}개 정답! ${isEven === null ? '(시간 초과)' : `(${num}은 ${num % 2 ? '홀수' : '짝수'})`}`); }
                setTxt('eo-cnt', '정답 ' + cnt); setTxt('eo-combo', '콤보 ' + combo); next();
            };
            every(() => { const left = limit - (performance.now() - qt), bar = $('eo-bar'); if(bar){ bar.style.width = Math.max(0, left / limit * 100) + '%'; bar.classList.toggle('bg-red-500', left < 800); } if(left <= 0) judge(null); }, 50);
            $('eo-e').addEventListener('click', () => judge(true)); $('eo-o').addEventListener('click', () => judge(false));
            G.onPress = k => { if(k === 'left') judge(true); if(k === 'right') judge(false); };
            next();
        }};

        // ==========================================
        // 13. 시작
        // ==========================================
        // 등록되지 않은 엔진이 있으면 콘솔에 경고 (개발용 안전장치)
        gameDefs.forEach(g => { if(!E[g.e]) console.warn('엔진 없음:', g.e, g.t); });
        window.addEventListener('resize', () => { if(!currentId && window.innerWidth >= 1024){ gameView.classList.remove('hidden'); gameView.classList.add('flex'); } });
        window.onload = () => { loadMainScreen(); };
    </script>
</body>
