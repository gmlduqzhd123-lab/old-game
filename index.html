                items.forEach(i => emo(ctx, i.type, i.x, i.y, 28));
                if(inv % 10 < 6){ ctx.fillStyle = `rgba(251,146,60,${.5 + Math.random() * .5})`; ctx.beginPath(); ctx.moveTo(px - 6, py + 16); ctx.lineTo(px + 6, py + 16); ctx.lineTo(px, py + 30 + Math.random() * 10); ctx.fill(); emo(ctx, '🚀', px, py, 36, -Math.PI / 4); }
                if(shield > 0){ ctx.strokeStyle = `rgba(56,189,248,${shield < 90 && shield % 20 < 10 ? .3 : .9})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(px, py, 28, 0, 7); ctx.stroke(); }
                txt(ctx, hearts(lives), 10, 10, '#fff', 16);
                ctx.fillStyle = '#1e293b'; ctx.fillRect(w - 140, 12, 120, 12); ctx.fillStyle = fuel > 30 ? '#f59e0b' : '#ef4444'; ctx.fillRect(w - 140, 12, 120 * Math.max(0, fuel) / 100, 12); txt(ctx, '⛽', w - 150, 18, '#fff', 14, 'right', 'middle');
                txt(ctx, `${Math.floor(dist / 6)}km`, w / 2, 10, '#94a3b8', 16, 'center');
                if(t < 150) banner(ctx, w, h, '우주 탐험 출발!', '⛽ 연료 보충 · 💎 +100 · 🛡️ 보호막 · 드래그 이동 가능');
            });
        }};

        // --- 구구단 운석: 정답 운석을 쏘아 맞히기, 20문제 ---
        E.mathmeteor = { canvas: true, ctl: 'both', label: '🔫 발사', run(g){
            const { ctx, w, h, cv } = makeCanvas(); const LX = [100, 240, 380], GOAL = 20;
            let lane = 1, cx = 240, q = null, rocks = [], shots = [], lives = 3, solved = 0, speed = .9, fx = [], waitT = 60;
            const newQ = () => {
                const a = rnd(2, 9), b = rnd(1, 9), ans = a * b, set = new Set([ans]);
                while(set.size < 3){ const c = pick([ans + a, ans - a, ans + b, ans - b, (a + 1) * b, a * (b + 1), ans + rnd(1, 5), ans - rnd(1, 5)]); if(c > 0) set.add(c); }
                q = { a, b, ans }; const vals = shuffle([...set]);
                rocks = vals.map((v, i) => ({ x: LX[i], y: -30 - rnd(0, 40), v, hit: false }));
            };
            newQ();
            const fire = () => { if(shots.length < 2){ shots.push({ x: LX[lane], y: h - 70 }); sfx.tick(); } };
            G.onPress = k => { if(k === 'left') lane = Math.max(0, lane - 1); if(k === 'right') lane = Math.min(2, lane + 1); if(k === 'action' || k === 'up') fire(); };
            listen(cv, 'pointerdown', e => { const p = canvasPos(cv, e); lane = p.x < 170 ? 0 : p.x < 310 ? 1 : 2; fire(); });
            const lose = (s) => { lives--; sfx.bad(); fx.push({ x: w / 2, y: h / 2, s, t: 60, c: '#f87171' }); if(lives <= 0) gameOver(`${solved}문제 해결 · 정답은 ${q.a} × ${q.b} = ${q.ans}`); else { waitT = 50; newQ(); } };
            loop(() => {
                cx += (LX[lane] - cx) * .3;
                fx.forEach(f => { f.t--; f.y -= .5; }); fx = fx.filter(f => f.t > 0);
                if(waitT > 0){ waitT--; return; }
                rocks.forEach(r => r.y += speed);
                shots.forEach(s => s.y -= 12); shots = shots.filter(s => s.y > -20);
                for(const s of shots) for(const r of rocks){
                    if(!r.hit && Math.abs(s.x - r.x) < 40 && Math.abs(s.y - r.y) < 34){
                        s.y = -99; r.hit = true;
                        if(r.v === q.ans){ solved++; addScore(100 + Math.max(0, Math.floor((h - r.y) / 5))); sfx.good(); fx.push({ x: r.x, y: r.y, s: '정답! 💥', t: 45, c: '#4ade80' }); speed = Math.min(2.6, speed + .08); if(solved >= GOAL) return win(`${GOAL}문제 모두 성공! 점수 ${score}`); waitT = 30; shots = []; newQ(); return; }
                        else return lose(`땡! ${q.a}×${q.b}=${q.ans}`);
                    }
                }
                const correct = rocks.find(r => r.v === q.ans);
                if(correct && correct.y > h - 90) lose(`놓쳤어요! ${q.a}×${q.b}=${q.ans}`);
            }, () => {
                ctx.fillStyle = '#0b1020'; ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = '#1e293b'; ctx.fillRect(0, h - 40, w, 40);
                LX.forEach(x => { ctx.strokeStyle = '#1e293b'; ctx.setLineDash([4, 10]); ctx.beginPath(); ctx.moveTo(x, 80); ctx.lineTo(x, h - 40); ctx.stroke(); ctx.setLineDash([]); });
                ctx.fillStyle = '#312e81'; rrect(ctx, w / 2 - 110, 12, 220, 52, 14); ctx.fill();
                txt(ctx, `${q.a} × ${q.b} = ?`, w / 2, 20, '#fff', 34, 'center');
                if(waitT <= 0) rocks.forEach(r => { if(r.hit) return; emo(ctx, '☄️', r.x, r.y, 70); ctx.fillStyle = 'rgba(15,23,42,.75)'; ctx.beginPath(); ctx.arc(r.x + 6, r.y + 6, 22, 0, 7); ctx.fill(); txt(ctx, r.v, r.x + 6, r.y + 7, '#facc15', 24, 'center', 'middle'); });
                ctx.fillStyle = '#fde047'; shots.forEach(s => ctx.fillRect(s.x - 3, s.y - 10, 6, 18));
                emo(ctx, '🛸', cx, h - 60, 48);
                fx.forEach(f => { ctx.globalAlpha = Math.min(1, f.t / 20); txt(ctx, f.s, f.x, f.y, f.c, 24, 'center'); }); ctx.globalAlpha = 1;
                txt(ctx, hearts(lives), 10, 76, '#fff', 16); txt(ctx, `${solved}/${GOAL}`, w - 10, 76, '#94a3b8', 16, 'right');
            });
        }};

        // ==========================================
        // 9. 두뇌 / 퍼즐 엔진
        // ==========================================

        // 스와이프 감지 (2048, 슬라이딩 등)
        function onSwipe(el, fn){
            let sx = 0, sy = 0, on = false;
            listen(el, 'pointerdown', e => { sx = e.clientX; sy = e.clientY; on = true; });
            listen(el, 'pointerup', e => { if(!on) return; on = false; const dx = e.clientX - sx, dy = e.clientY - sy; if(Math.max(Math.abs(dx), Math.abs(dy)) < 25) return; fn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up')); });
        }

        // --- 2048: 실제 4×4 합치기 규칙, 스와이프/방향키, 승리·패배 판정 ---
        E['2048'] = { ctl: 'dpad', run(g){
            const wrap = makeWrap(); const N = 4;
            let board = Array.from({length: N}, () => Array(N).fill(0)), fresh = null, merged = [], moves = 0;
            const COL = { 0:'#f1ecfd', 2:'#eee4da', 4:'#ede0c8', 8:'#f2b179', 16:'#f59563', 32:'#f67c5f', 64:'#f65e3b', 128:'#edcf72', 256:'#edcc61', 512:'#edc850', 1024:'#edc53f', 2048:'#edc22e' };
            const addTile = () => { const empty = []; board.forEach((r, y) => r.forEach((v, x) => { if(!v) empty.push([x, y]); })); if(!empty.length) return; const [x, y] = pick(empty); board[y][x] = Math.random() < .9 ? 2 : 4; fresh = x + ',' + y; };
            wrap.innerHTML = statBar([['t-moves', '이동 0'], ['t-max', '최대 타일 2']]) + `<div id="b2048" class="grid grid-cols-4 gap-2 bg-slate-700 p-2 rounded-xl w-full max-w-[340px] aspect-square no-touch"></div><p class="text-xs text-slate-500 mt-3">방향키 · 화면 방향 버튼 · 스와이프로 이동</p>`;
            const el = $('b2048');
            const render = () => {
                el.innerHTML = board.map((r, y) => r.map((v, x) => {
                    const c = COL[v] || '#3c3a32', fs = v >= 1024 ? 'text-xl md:text-2xl' : v >= 128 ? 'text-2xl md:text-3xl' : 'text-3xl md:text-4xl';
                    const anim = fresh === x + ',' + y || merged.includes(x + ',' + y) ? 'pop' : '';
                    return `<div class="rounded-lg flex items-center justify-center font-black ${fs} ${anim}" style="background:${c};color:${v > 4 ? '#fff' : '#776e65'}">${v || ''}</div>`;
                }).join('')).join('');
                setTxt('t-moves', '이동 ' + moves); setTxt('t-max', '최대 타일 ' + Math.max(...board.flat()));
            };
            const slide = row => { const a = row.filter(v => v), out = [], m = []; for(let i = 0; i < a.length; i++){ if(a[i] === a[i + 1]){ out.push(a[i] * 2); addScore(a[i] * 2); m.push(out.length - 1); i++; } else out.push(a[i]); } while(out.length < N) out.push(0); return { out, m }; };
            const canMove = () => { for(let y = 0; y < N; y++) for(let x = 0; x < N; x++){ const v = board[y][x]; if(!v || (x < N - 1 && board[y][x + 1] === v) || (y < N - 1 && board[y + 1][x] === v)) return true; } return false; };
            let won = false;
            const move = dir => {
                if(G.over) return;
                const before = JSON.stringify(board); merged = [];
                for(let i = 0; i < N; i++){
                    let line = [];
                    for(let j = 0; j < N; j++){ const [x, y] = dir === 'left' ? [j, i] : dir === 'right' ? [N - 1 - j, i] : dir === 'up' ? [i, j] : [i, N - 1 - j]; line.push(board[y][x]); }
                    const { out, m } = slide(line);
                    for(let j = 0; j < N; j++){ const [x, y] = dir === 'left' ? [j, i] : dir === 'right' ? [N - 1 - j, i] : dir === 'up' ? [i, j] : [i, N - 1 - j]; board[y][x] = out[j]; if(m.includes(j)) merged.push(x + ',' + y); }
                }
                if(JSON.stringify(board) === before){ shakeEl(el); return; }
                moves++; addTile(); render(); merged.length ? sfx.pop() : sfx.tick();
                if(!won && board.flat().includes(2048)){ won = true; return win(`2048 달성! ${moves}번 이동 · 점수 ${score}`); }
                if(!canMove()) after(() => gameOver(`최대 타일 ${Math.max(...board.flat())} · 점수 ${score}`), 400);
            };
            G.onPress = k => { if(k !== 'action') move(k); };
            onSwipe(el, move);
            addTile(); addTile(); render();
        }};

        // --- 지뢰찾기: 첫 클릭 안전, 숫자 힌트, 자동 열기, 깃발(우클릭/길게 누르기/깃발 모드), 타이머 ---
        E.mine = { ctl: 'none', run(g){
            const wrap = makeWrap();
            const LEVELS = { easy: { n: 9, m: 10, name: '초급' }, mid: { n: 12, m: 22, name: '중급' } };
            const setup = () => {
                wrap.innerHTML = `<div class="text-5xl mb-4">💣</div><h2 class="text-2xl font-bold text-cyan-400 mb-6">난이도 선택</h2><div class="flex gap-3">${Object.entries(LEVELS).map(([k, v]) => `<button data-lv="${k}" class="px-6 py-4 ${btnCls()} text-xl">${v.name}<br><span class="text-xs text-indigo-200">${v.n}×${v.n} · 지뢰 ${v.m}</span></button>`).join('')}</div>`;
                wrap.querySelectorAll('[data-lv]').forEach(b => b.addEventListener('click', () => play(LEVELS[b.dataset.lv])));
            };
            const play = (L) => {
                const N = L.n, M = L.m; let mines = null, open = Array(N * N).fill(false), flag = Array(N * N).fill(false), flagMode = false, sec = 0, started = false, opened = 0;
                const nb = i => { const x = i % N, y = Math.floor(i / N), r = []; for(let dy = -1; dy <= 1; dy++) for(let dx = -1; dx <= 1; dx++){ if(!dx && !dy) continue; const nx = x + dx, ny = y + dy; if(nx >= 0 && ny >= 0 && nx < N && ny < N) r.push(ny * N + nx); } return r; };
                const cnt = i => nb(i).filter(j => mines[j]).length;
                const NUMC = ['', '#2563eb', '#16a34a', '#dc2626', '#7c3aed', '#c2410c', '#0e7490', '#2e2a42', '#6b7280'];
                const cell = Math.floor(Math.min(340, wrap.clientWidth - 16) / N);
                wrap.innerHTML = statBar([['mn-left', `🚩 ${M}`], ['mn-time', '⏱️ 0초']]) + `<div id="mn-grid" class="grid gap-[2px] bg-slate-700 p-1 rounded-lg" style="grid-template-columns:repeat(${N},${cell}px)"></div><button id="mn-mode" class="mt-3 px-5 py-2 ${btnCls('bg-slate-700', 'rgb(30,41,59)')}">⛏️ 열기 모드</button><p class="text-xs text-slate-500 mt-2">PC: 우클릭 = 깃발 · 모바일: 길게 누르기 또는 모드 전환 · 숫자 칸 클릭 = 주변 한번에 열기</p>`;
                const grid = $('mn-grid');
                const render = () => {
                    grid.innerHTML = open.map((o, i) => {
                        let c = '', bg = 'bg-slate-500 hover:bg-slate-400', col = '';
                        if(o){ bg = 'bg-slate-900'; if(mines[i]) { c = '💣'; bg = 'bg-red-600'; } else { const n = cnt(i); c = n || ''; col = NUMC[n]; } }
                        else if(flag[i]) c = '🚩';
                        return `<button data-i="${i}" class="${bg} rounded-sm font-black flex items-center justify-center" style="width:${cell}px;height:${cell}px;font-size:${cell * .55}px;color:${col}">${c}</button>`;
                    }).join('');
                    setTxt('mn-left', `🚩 ${M - flag.filter(Boolean).length}`);
                };
                const place = first => { mines = Array(N * N).fill(false); const safe = new Set([first, ...nb(first)]); let k = 0; while(k < M){ const i = rnd(0, N * N - 1); if(!mines[i] && !safe.has(i)){ mines[i] = true; k++; } } };
                const reveal = i => {
                    const stack = [i];
                    while(stack.length){ const j = stack.pop(); if(open[j] || flag[j]) continue; open[j] = true; opened++; if(!mines[j] && cnt(j) === 0) nb(j).forEach(k => { if(!open[k]) stack.push(k); }); }
                };
                const lose = i => { mines.forEach((m, j) => { if(m) open[j] = true; }); render(); sfx.boom(); shakeEl(grid); after(() => gameOver(`지뢰를 밟았어요! (${sec}초)`), 700); };
                const clickCell = (i, asFlag) => {
                    if(G.over) return;
                    if(!started){ started = true; place(i); every(() => { sec++; setTxt('mn-time', `⏱️ ${sec}초`); }, 1000); }
                    if(asFlag){ if(!open[i]){ flag[i] = !flag[i]; sfx.tick(); } render(); return; }
                    if(flag[i]) return;
                    if(open[i]){   // 코드 열기: 주변 깃발 수 = 숫자이면 나머지를 연다
                        const n = cnt(i), ns = nb(i); if(!n || ns.filter(j => flag[j]).length !== n) return;
                        for(const j of ns) if(!flag[j] && !open[j]){ if(mines[j]) return lose(j); reveal(j); }
                    } else { if(mines[i]) return lose(i); reveal(i); }
                    sfx.pop(); render();
                    if(opened === N * N - M){ setScore(Math.max(100, (L.n === 9 ? 1000 : 2000) - sec * 5)); win(`${L.name} 클리어! ${sec}초`); }
                };
                let lp = null, lpFired = false;
                listen(grid, 'contextmenu', e => { e.preventDefault(); const b = e.target.closest('[data-i]'); if(b && e.pointerType !== 'touch') clickCell(+b.dataset.i, true); });
                listen(grid, 'pointerdown', e => { const b = e.target.closest('[data-i]'); if(!b || e.button === 2) return; lpFired = false; lp = setTimeout(() => { lpFired = true; clickCell(+b.dataset.i, true); if(navigator.vibrate) navigator.vibrate(30); }, 450); });
                listen(grid, 'pointerup', e => { clearTimeout(lp); const b = e.target.closest('[data-i]'); if(!b || e.button === 2 || lpFired) return; clickCell(+b.dataset.i, flagMode); });
                listen(grid, 'pointerleave', () => clearTimeout(lp));
                G.cleanup.push(() => clearTimeout(lp));
                $('mn-mode').addEventListener('click', () => { flagMode = !flagMode; $('mn-mode').textContent = flagMode ? '🚩 깃발 모드' : '⛏️ 열기 모드'; $('mn-mode').classList.toggle('bg-red-700', flagMode); });
                render();
            };
            setup();
        }};

        // --- 틱택토: 승리 판정, 미니맥스 AI(난이도), 5판 승부 ---
        E.tictactoe = { ctl: 'none', run(g){
            const wrap = makeWrap(); const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]], ROUNDS = 5;
            let bd, round = 0, W = 0, D = 0, L = 0, busy = false, hard = false;
            const winner = b => { for(const l of LINES) if(b[l[0]] && b[l[0]] === b[l[1]] && b[l[1]] === b[l[2]]) return { p: b[l[0]], l }; return b.every(v => v) ? { p: 'D' } : null; };
            const minimax = (b, me) => { const w = winner(b); if(w) return { s: w.p === 'O' ? 10 : w.p === 'X' ? -10 : 0 }; let best = { s: me === 'O' ? -99 : 99 }; b.forEach((v, i) => { if(v) return; b[i] = me; const r = minimax(b, me === 'O' ? 'X' : 'O'); b[i] = ''; if(me === 'O' ? r.s > best.s : r.s < best.s) best = { s: r.s, i }; }); return best; };
            const aiMove = () => { const empty = bd.map((v, i) => v ? -1 : i).filter(i => i >= 0); if(!hard && Math.random() < .35) return pick(empty); return minimax([...bd], 'O').i; };
            wrap.innerHTML = statBar([['tt-round', ''], ['tt-rec', '']]) + `<div class="flex gap-2 mb-3"><button id="tt-easy" class="px-3 py-1 rounded-lg text-sm bg-emerald-700">😊 보통</button><button id="tt-hard" class="px-3 py-1 rounded-lg text-sm bg-slate-700">😈 어려움</button></div><p id="tt-msg" class="text-lg text-yellow-300 mb-3 h-7"></p><div id="tt-grid" class="grid grid-cols-3 gap-2 w-[260px] md:w-[300px]"></div><button id="tt-next" class="hidden mt-4 px-6 py-3 ${btnCls()}">다음 판 ▶</button>`;
            const setDiff = h => { hard = h; $('tt-easy').className = `px-3 py-1 rounded-lg text-sm ${h ? 'bg-slate-700' : 'bg-emerald-700'}`; $('tt-hard').className = `px-3 py-1 rounded-lg text-sm ${h ? 'bg-red-700' : 'bg-slate-700'}`; };
            $('tt-easy').addEventListener('click', () => setDiff(false)); $('tt-hard').addEventListener('click', () => setDiff(true));
            const render = (hl = []) => { $('tt-grid').innerHTML = bd.map((v, i) => `<button data-i="${i}" class="aspect-square ${hl.includes(i) ? 'bg-emerald-700' : 'bg-slate-800 hover:bg-slate-700'} text-5xl md:text-6xl font-black rounded-xl ${v === 'X' ? 'text-yellow-400' : 'text-cyan-400'} ${v ? 'pop' : ''}">${v === 'X' ? '✕' : v === 'O' ? '○' : ''}</button>`).join(''); setTxt('tt-round', `${round}/${ROUNDS}판`); setTxt('tt-rec', `승 ${W} · 무 ${D} · 패 ${L}`); };
            const check = () => {
                const w = winner(bd); if(!w) return false;
                if(w.p === 'X'){ W++; addScore(100); setTxt('tt-msg', '🎉 승리!'); sfx.win(); }
                else if(w.p === 'O'){ L++; setTxt('tt-msg', '😢 패배...'); sfx.bad(); }
                else { D++; addScore(30); setTxt('tt-msg', '🤝 무승부'); sfx.tick(); }
                render(w.l || []); busy = true;
                if(round >= ROUNDS) after(() => (W > L ? win : gameOver)(`${ROUNDS}판 결과: ${W}승 ${D}무 ${L}패`), 900);
                else $('tt-next').classList.remove('hidden');
                return true;
            };
            const newRound = () => { round++; bd = Array(9).fill(''); busy = false; $('tt-next').classList.add('hidden'); render(); if(round % 2 === 0){ setTxt('tt-msg', '컴퓨터가 먼저 둡니다'); busy = true; after(() => { bd[aiMove()] = 'O'; busy = false; render(); setTxt('tt-msg', '당신 차례 (✕)'); }, 500); } else setTxt('tt-msg', '당신이 먼저! (✕)'); };
            $('tt-grid').addEventListener('click', e => {
                const b = e.target.closest('[data-i]'); if(!b || busy || G.over) return; const i = +b.dataset.i; if(bd[i]) return;
                bd[i] = 'X'; sfx.tick(); render(); if(check()) return;
                busy = true; setTxt('tt-msg', '컴퓨터 생각 중...');
                after(() => { bd[aiMove()] = 'O'; sfx.hit(); render(); if(!check()){ busy = false; setTxt('tt-msg', '당신 차례 (✕)'); } }, 450);
            });
            $('tt-next').addEventListener('click', newRound);
            newRound();
        }};

        // --- 숫자 야구: 10번 제한, 중복 검사, 숫자 키패드 ---
        E.baseball = { ctl: 'none', run(g){
            const wrap = makeWrap(); const MAX = 10;
            let secret = shuffle([1,2,3,4,5,6,7,8,9]).slice(0, 3).join(''), tries = 0, cur = '';
            wrap.innerHTML = statBar([['bb-tries', `남은 기회 ${MAX}`]]) + `<p class="text-sm text-slate-400 mb-3">서로 다른 숫자 3개 (1~9) · S=숫자·자리 일치, B=숫자만 일치</p><div id="bb-slots" class="flex gap-2 mb-3"></div><div id="bb-pad" class="grid grid-cols-5 gap-1.5 w-[300px] mb-3">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-n="${n}" class="py-3 bg-slate-700 rounded-lg text-xl font-bold active:scale-95">${n}</button>`).join('')}<button data-n="del" class="py-3 bg-slate-600 rounded-lg text-xl active:scale-95">⌫</button></div><button id="bb-go" class="px-10 py-3 ${btnCls()} text-xl mb-3">⚾ 던지기</button><div id="bb-log" class="text-base space-y-1 max-h-40 overflow-y-auto w-[300px] bg-slate-900 p-2 rounded-xl border border-slate-700"></div>`;
            const slots = () => { $('bb-slots').innerHTML = [0,1,2].map(i => `<div class="w-14 h-16 bg-slate-800 border-2 ${cur[i] ? 'border-cyan-400' : 'border-slate-600'} rounded-xl flex items-center justify-center text-3xl font-black">${cur[i] || ''}</div>`).join(''); wrap.querySelectorAll('[data-n]').forEach(b => { if(b.dataset.n !== 'del') b.classList.toggle('opacity-30', cur.includes(b.dataset.n)); }); };
            const input = n => { if(G.over) return; if(n === 'del') cur = cur.slice(0, -1); else if(cur.length < 3 && !cur.includes(n)) cur += n; sfx.tick(); slots(); };
            const go = () => {
                if(G.over) return;
                if(cur.length !== 3){ shakeEl($('bb-slots')); return; }
                tries++; let s = 0, b = 0; for(let i = 0; i < 3; i++){ if(cur[i] === secret[i]) s++; else if(secret.includes(cur[i])) b++; }
                const res = s === 3 ? '🎉 홈런!' : (s || b) ? `<span class="text-yellow-400 font-bold">${s}S</span> <span class="text-cyan-400 font-bold">${b}B</span>` : '<span class="text-red-400 font-bold">OUT</span>';
                $('bb-log').insertAdjacentHTML('afterbegin', `<p class="pop">${tries}회 <b>${cur}</b> → ${res}</p>`);
                setTxt('bb-tries', `남은 기회 ${MAX - tries}`);
                if(s === 3){ setScore((MAX + 1 - tries) * 100); return win(`${tries}번 만에 홈런! 정답 ${secret}`); }
                (s || b ? sfx.hit : sfx.bad)(); cur = ''; slots();
                if(tries >= MAX) gameOver(`기회를 모두 썼어요. 정답은 ${secret}`);
            };
            wrap.querySelectorAll('[data-n]').forEach(b => b.addEventListener('click', () => input(b.dataset.n)));
            $('bb-go').addEventListener('click', go);
            listen(window, 'keydown', e => { if(/^[1-9]$/.test(e.key)) input(e.key); else if(e.key === 'Backspace') input('del'); else if(e.key === 'Enter') go(); });
            slots();
        }};

        // --- 짝맞추기: 3스테이지(6→8→10쌍), 시작 미리보기, 이동 횟수, 3D 카드 ---
        E.memory = { ctl: 'none', run(g){
            const wrap = makeWrap();
            const SETS = { animal: ['🐶','🐱','🐭','🐰','🦊','🐻','🐼','🐸','🐯','🦁','🐷','🐵'], fruit: ['🍎','🍌','🍇','🍉','🍓','🍒','🍑','🍍','🥝','🍋','🥭','🍐'] };
            const STAGES = [{ pairs: 6, cols: 4 }, { pairs: 8, cols: 4 }, { pairs: 10, cols: 5 }];
            let stage = 0, totalMoves = 0;
            const play = () => {
                const S = STAGES[stage], cards = shuffle(shuffle(SETS[g.cfg.skin]).slice(0, S.pairs).flatMap(e => [e, e]));
                let flipped = [], found = 0, moves = 0, lock = true;
                wrap.innerHTML = statBar([['mm-stage', `스테이지 ${stage + 1}/3`], ['mm-moves', '시도 0'], ['mm-found', `0/${S.pairs}쌍`]]) + `<div id="mm-grid" class="grid gap-2 w-full" style="grid-template-columns:repeat(${S.cols},1fr);max-width:${S.cols * 76}px">${cards.map((c, i) => `<div data-i="${i}" class="flip-card open aspect-[3/4] cursor-pointer"><div class="flip-inner"><div class="flip-face bg-gradient-to-br from-indigo-500 to-purple-700 text-3xl shadow">❓</div><div class="flip-face flip-back bg-slate-100 text-4xl md:text-5xl shadow">${c}</div></div></div>`).join('')}</div><p id="mm-msg" class="mt-3 text-yellow-300">잘 기억하세요! 👀</p>`;
                const els = [...wrap.querySelectorAll('.flip-card')];
                after(() => { els.forEach(e => e.classList.remove('open')); lock = false; setTxt('mm-msg', '같은 그림 두 장을 찾으세요'); }, 1200 + S.pairs * 150);
                $('mm-grid').addEventListener('click', e => {
                    const c = e.target.closest('.flip-card'); if(!c || lock || G.over) return; const i = +c.dataset.i;
                    if(c.classList.contains('open')) return;
                    c.classList.add('open'); sfx.tick(); flipped.push(i);
                    if(flipped.length < 2) return;
                    moves++; totalMoves++; setTxt('mm-moves', '시도 ' + moves); lock = true;
                    const [a, b] = flipped; flipped = [];
                    if(cards[a] === cards[b]){
                        found++; addScore(20); sfx.good(); lock = false; setTxt('mm-found', `${found}/${S.pairs}쌍`);
                        [a, b].forEach(k => els[k].querySelector('.flip-back').classList.replace('bg-slate-100', 'bg-emerald-200'));
                        if(found === S.pairs){
                            const bonus = Math.max(0, (S.pairs * 2 - moves) * 15); addScore(100 + bonus);
                            if(stage === STAGES.length - 1) return after(() => win(`3스테이지 완료! 총 ${totalMoves}번 시도`), 500);
                            setTxt('mm-msg', `스테이지 클리어! +${100 + bonus}점`); stage++; after(play, 1300);
                        }
                    } else after(() => { els[a].classList.remove('open'); els[b].classList.remove('open'); lock = false; }, 700);
                });
            };
            play();
        }};

        // --- 스도쿠 9×9: 매번 새 퍼즐 생성(유일해), 숫자 패드, 실수 3번 제한, 강조 표시 ---
        E.sudoku = { ctl: 'none', run(g){
            const wrap = makeWrap();
            const ok = (b, i, v) => { const r = Math.floor(i / 9), c = i % 9, br = r - r % 3, bc = c - c % 3; for(let k = 0; k < 9; k++){ if(b[r * 9 + k] === v || b[k * 9 + c] === v || b[(br + Math.floor(k / 3)) * 9 + bc + k % 3] === v) return false; } return true; };
            const fill = b => { const i = b.indexOf(0); if(i < 0) return true; for(const v of shuffle([1,2,3,4,5,6,7,8,9])){ if(ok(b, i, v)){ b[i] = v; if(fill(b)) return true; b[i] = 0; } } return false; };
            const count = (b, lim) => { const i = b.indexOf(0); if(i < 0) return 1; let n = 0; for(let v = 1; v <= 9 && n < lim; v++){ if(ok(b, i, v)){ b[i] = v; n += count(b, lim - n); b[i] = 0; } } return n; };
            const make = holes => { const sol = Array(81).fill(0); fill(sol); const p = [...sol]; let removed = 0; for(const i of shuffle([...Array(81).keys()])){ if(removed >= holes) break; const v = p[i]; p[i] = 0; if(count([...p], 2) !== 1) p[i] = v; else removed++; } return { sol, p }; };
            const setup = () => {
                wrap.innerHTML = `<div class="text-5xl mb-4">🧮</div><h2 class="text-2xl font-bold text-cyan-400 mb-6">난이도 선택</h2><div class="flex gap-3">${[['쉬움', 36], ['보통', 46], ['어려움', 54]].map(([n, k]) => `<button data-h="${k}" class="px-5 py-4 ${btnCls()} text-xl">${n}</button>`).join('')}</div>`;
                wrap.querySelectorAll('[data-h]').forEach(b => b.addEventListener('click', () => play(+b.dataset.h)));
            };
            const play = (holes) => {
                const { sol, p } = make(holes), given = p.map(v => v > 0), cur = [...p]; let sel = cur.indexOf(0), mistakes = 0, wrong = new Set();
                const cs = Math.floor(Math.min(360, wrap.clientWidth - 12) / 9);
                wrap.innerHTML = statBar([['sd-mis', '실수 0/3'], ['sd-left', '']]) + `<div id="sd-grid" class="grid bg-[#8b7cf6] p-[3px] gap-0 rounded-lg" style="grid-template-columns:repeat(9,${cs}px)"></div><div id="sd-pad" class="grid grid-cols-5 gap-1.5 mt-3" style="width:${cs * 9}px">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-n="${n}" class="py-2 bg-indigo-700 rounded-lg text-xl font-bold active:scale-95">${n}</button>`).join('')}<button data-n="0" class="py-2 bg-slate-600 rounded-lg text-lg active:scale-95">⌫</button></div>`;
                const render = () => {
                    const sv = cur[sel], sr = Math.floor(sel / 9), sc = sel % 9;
                    $('sd-grid').innerHTML = cur.map((v, i) => {
                        const r = Math.floor(i / 9), c = i % 9, same = sv && v === sv, rel = r === sr || c === sc || (Math.floor(r / 3) === Math.floor(sr / 3) && Math.floor(c / 3) === Math.floor(sc / 3));
                        const bg = i === sel ? '#c9bffb' : wrong.has(i) ? '#fecdd3' : same ? '#ddd6fe' : rel ? '#f3efff' : '#ffffff';
                        const bd = `border-right:${c % 3 === 2 && c < 8 ? 3 : 1}px solid ${c % 3 === 2 ? '#8b7cf6' : '#e2dafa'};border-bottom:${r % 3 === 2 && r < 8 ? 3 : 1}px solid ${r % 3 === 2 ? '#8b7cf6' : '#e2dafa'}`;
                        return `<button data-i="${i}" style="width:${cs}px;height:${cs}px;background:${bg};${bd};font-size:${cs * .55}px" class="flex items-center justify-center font-bold ${given[i] ? 'text-slate-100' : wrong.has(i) ? 'text-red-400' : 'text-[#6a5ae0]'}">${v || ''}</button>`;
                    }).join('');
                    setTxt('sd-left', `남은 칸 ${cur.filter(v => !v).length}`);
                };
                const put = n => {
                    if(G.over || given[sel]) return;
                    if(n === 0){ cur[sel] = 0; wrong.delete(sel); render(); return; }
                    cur[sel] = n;
                    if(sol[sel] !== n){ wrong.add(sel); mistakes++; setTxt('sd-mis', `실수 ${mistakes}/3`); sfx.bad(); render(); if(mistakes >= 3) return after(() => gameOver('실수 3번! 다시 도전해 보세요.'), 400); return; }
                    wrong.delete(sel); addScore(10); sfx.pop(); render();
                    if(cur.every((v, i) => v === sol[i])){ addScore(holes * 10 - mistakes * 50); win(`스도쿠 완성! 실수 ${mistakes}번`); }
                };
                $('sd-grid').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if(b){ sel = +b.dataset.i; render(); } });
                $('sd-pad').addEventListener('click', e => { const b = e.target.closest('[data-n]'); if(b) put(+b.dataset.n); });
                G.onPress = (k, e) => { if(e && e.key && e.key.length === 1) return; const d = { up: -9, down: 9, left: -1, right: 1 }[k]; if(d !== undefined){ const n = sel + d; if(n >= 0 && n < 81 && !(d === 1 && n % 9 === 0) && !(d === -1 && sel % 9 === 0)){ sel = n; render(); } } };
                listen(window, 'keydown', e => { if(/^[1-9]$/.test(e.key)) put(+e.key); if(e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') put(0); });
                render();
            };
            setup();
        }};

        // --- 하노이의 탑: 3→4→5개 원판, 최소 이동 표시, 키보드 1/2/3 ---
        E.hanoi = { ctl: 'none', run(g){
            const wrap = makeWrap(); const DC = ['#f87171', '#fb923c', '#facc15', '#4ade80', '#38bdf8'];
            let n = 3, pegs, sel = null, moves = 0;
            const start = () => { pegs = [[...Array(n).keys()].map(i => n - i), [], []]; sel = null; moves = 0; render(); };
            const render = () => {
                const min = Math.pow(2, n) - 1;
                wrap.innerHTML = statBar([['hn-lv', `원판 ${n}개 (${n - 2}/3단계)`], ['hn-mv', `이동 ${moves} / 최소 ${min}`]]) + `<p class="text-sm text-slate-400 mb-4">기둥을 눌러 원판을 집고, 다른 기둥을 눌러 내려놓으세요. 큰 원판은 작은 원판 위에 못 올려요.</p><div id="hn-pegs" class="flex justify-between items-end gap-2 bg-slate-800 p-3 rounded-xl w-full max-w-[380px] h-[200px]">${pegs.map((p, i) => `<div data-p="${i}" class="relative w-1/3 h-full flex flex-col-reverse items-center cursor-pointer rounded-lg ${sel === i ? 'bg-slate-700 ring-2 ring-yellow-400' : 'hover:bg-slate-700/50'}"><div class="absolute bottom-0 w-2 h-[85%] bg-slate-500 rounded-t"></div><div class="w-full h-2 bg-slate-500 rounded z-10"></div>${p.map((d, k) => `<div class="z-10 rounded-full h-5 mb-[2px] transition ${sel === i && k === p.length - 1 ? '-translate-y-4' : ''}" style="width:${25 + d * 14}%;background:${DC[d - 1]}"></div>`).join('')}<span class="absolute -bottom-6 text-slate-500 text-sm">${i + 1}</span></div>`).join('')}</div><div class="h-8"></div>`;
                $('hn-pegs').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if(b) choose(+b.dataset.p); });
            };
            const choose = i => {
                if(G.over) return;
                if(sel === null){ if(pegs[i].length){ sel = i; sfx.tick(); render(); } return; }
                if(sel === i){ sel = null; render(); return; }
                const d = pegs[sel][pegs[sel].length - 1], top = pegs[i][pegs[i].length - 1];
                if(top && top < d){ sfx.bad(); sel = null; render(); shakeEl($('hn-pegs')); return; }
                pegs[i].push(pegs[sel].pop()); moves++; sel = null; sfx.pop(); render();
                if(pegs[2].length === n){
                    const min = Math.pow(2, n) - 1, pts = 100 * (n - 2) + Math.max(0, 100 - (moves - min) * 5); addScore(pts); sfx.good();
                    if(n === 5) return win(`5단 하노이 탑 완성! (${moves}번 이동)`);
                    n++; after(start, 900); setTxt('hn-mv', `클리어! +${pts}점 · 다음 단계로...`);
                }
            };
            listen(window, 'keydown', e => { if(['1','2','3'].includes(e.key)) choose(+e.key - 1); });
            start();
        }};

        // --- 슬라이딩 퍼즐: 항상 풀 수 있게 섞기, 3×3 → 4×4, 방향키/스와이프 ---
        E.sliding = { ctl: 'dpad', run(g){
            const wrap = makeWrap(); let n = 3, t, moves = 0, sec = 0;
            every(() => { sec++; setTxt('sl-time', `⏱️ ${sec}초`); }, 1000);
            const start = () => {
                t = [...Array(n * n).keys()].map(i => (i + 1) % (n * n)); moves = 0;
                let e = n * n - 1, prev = -1;
                for(let k = 0; k < n * n * 40; k++){ const opts = nbrs(e).filter(x => x !== prev); const m = pick(opts); t[e] = t[m]; t[m] = 0; prev = e; e = m; }
                render();
            };
            const nbrs = e => { const r = []; if(e % n > 0) r.push(e - 1); if(e % n < n - 1) r.push(e + 1); if(e >= n) r.push(e - n); if(e < n * n - n) r.push(e + n); return r; };
            const render = () => {
                wrap.innerHTML = statBar([['sl-lv', `${n}×${n} (${n - 2}/2단계)`], ['sl-mv', `이동 ${moves}`], ['sl-time', `⏱️ ${sec}초`]]) + `<div id="sl-grid" class="grid gap-1.5 bg-slate-800 p-2 rounded-xl w-full max-w-[320px] aspect-square no-touch" style="grid-template-columns:repeat(${n},1fr)">${t.map((v, i) => `<button data-i="${i}" class="rounded-lg font-black ${n === 3 ? 'text-4xl' : 'text-3xl'} ${v === 0 ? 'bg-slate-900' : (v === i + 1 ? 'bg-emerald-600' : 'bg-indigo-600 hover:bg-indigo-500') + ' shadow'}">${v || ''}</button>`).join('')}</div><p class="text-xs text-slate-500 mt-3">타일 클릭 · 방향키 · 스와이프 (제자리 타일은 초록색)</p>`;
                $('sl-grid').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if(b) tryMove(+b.dataset.i); });
                onSwipe($('sl-grid'), dir => G.onPress(dir));
            };
            const tryMove = i => {
                if(G.over) return; const e = t.indexOf(0);
                if(!nbrs(e).includes(i)) return;
                t[e] = t[i]; t[i] = 0; moves++; sfx.tick(); render();
                if(t.slice(0, -1).every((v, k) => v === k + 1)){
                    addScore(Math.max(50, (n === 3 ? 300 : 800) - moves * 2)); sfx.good();
                    if(n === 4) return win(`4×4 퍼즐까지 완성! 총 ${sec}초`);
                    n = 4; after(start, 800);
                }
            };
            G.onPress = k => { const e = t.indexOf(0); const m = { left: e + 1, right: e - 1, up: e + n, down: e - n }[k]; if(m === undefined) return; if((k === 'left' && e % n === n - 1) || (k === 'right' && e % n === 0)) return; if(m >= 0 && m < n * n) tryMove(m); };
            start();
        }};

        // --- 소코반: 6스테이지(모두 풀이 검증), 되돌리기, 다시하기 ---
        E.sokoban = { ctl: 'dpad', run(g){
            const LEVELS = [
                ["########","#   #  #","# $   .#","#@  #  #","########"],
                ["  ####","###  #","#. $ #","# #  ##","#. $ @#","#  #  #","#######"],
                ["#######","#.    #","# $$  #","#  #  #","#  @ .#","#######"],
                ["########","#  #   #","# $  $ #","#.##.# #","#   @  #","########"],
                ["#######","#.  # #","#  $  #","# #@# #","#  $  #","#.    #","#######"],
                ["#######","#.   .#","#  $  #","# $@$ #","#  $  #","#.   .#","#######"],
            ];
            const wrap = makeWrap(); let lv = 0, map, W, H, px, py, boxes, goals, hist, moves;
            const load = () => {
                const L = LEVELS[lv]; H = L.length; W = Math.max(...L.map(r => r.length)); map = []; boxes = []; goals = []; hist = []; moves = 0;
                for(let y = 0; y < H; y++){ map.push([]); for(let x = 0; x < W; x++){ const c = L[y][x] || ' '; map[y].push(c === '#' ? '#' : ' '); if(c === '@' || c === '+'){ px = x; py = y; } if(c === '$' || c === '*') boxes.push([x, y]); if(c === '.' || c === '*' || c === '+') goals.push(x + ',' + y); } }
                render();
            };
            const isBox = (x, y) => boxes.findIndex(b => b[0] === x && b[1] === y);
            const render = () => {
                const cs = Math.floor(Math.min(46, (Math.min(380, wrap.clientWidth) - 16) / W));
                let h = statBar([['sk-lv', `스테이지 ${lv + 1}/${LEVELS.length}`], ['sk-mv', `이동 ${moves}`]]) + `<div class="grid gap-0 bg-slate-900 p-2 rounded-xl" style="grid-template-columns:repeat(${W},${cs}px)">`;
                for(let y = 0; y < H; y++) for(let x = 0; x < W; x++){
                    const goal = goals.includes(x + ',' + y), b = isBox(x, y) >= 0, wall = map[y][x] === '#';
                    const e = (px === x && py === y) ? '🧑' : b ? (goal ? '✅' : '📦') : goal ? '🎯' : '';
                    h += `<div class="flex items-center justify-center" style="width:${cs}px;height:${cs}px;font-size:${cs * .7}px;background:${wall ? '#e3b58a' : '#fffaf3'};${wall ? 'box-shadow:inset 0 -4px 0 #c99468' : 'box-shadow:inset 0 0 0 1px #f1e6da'}">${e}</div>`;
                }
                wrap.innerHTML = h + `</div><div class="flex gap-2 mt-4"><button id="sk-undo" class="px-4 py-2 ${btnCls('bg-slate-700', 'rgb(30,41,59)')}">↩️ 되돌리기</button><button id="sk-reset" class="px-4 py-2 ${btnCls('bg-slate-700', 'rgb(30,41,59)')}">🔄 다시하기</button></div>`;
                $('sk-undo').addEventListener('click', undo); $('sk-reset').addEventListener('click', load);
            };
            const undo = () => { const s = hist.pop(); if(!s) return; [px, py] = s.p; boxes = s.b; moves--; render(); };
            const move = (dx, dy) => {
                if(G.over) return;
                const nx = px + dx, ny = py + dy; if(map[ny][nx] === '#') return;
                const bi = isBox(nx, ny); const snap = { p: [px, py], b: boxes.map(b => [...b]) };
                if(bi >= 0){ const bx = nx + dx, by = ny + dy; if(map[by][bx] === '#' || isBox(bx, by) >= 0){ sfx.bad(); return; } boxes[bi] = [bx, by]; sfx.hit(); } else sfx.tick();
                hist.push(snap); px = nx; py = ny; moves++; render();
                if(boxes.every(b => goals.includes(b[0] + ',' + b[1]))){
                    addScore(Math.max(50, 200 - moves)); sfx.good();

            const area = $('ty-area'), inp = $('ty-in'); inp.focus();
            listen(area, 'pointerdown', e => { e.preventDefault(); inp.focus(); });
            const spawn = () => {
                const w = pick(WORDS), el = document.createElement('div');
                el.className = 'absolute px-2 py-1 rounded-lg bg-indigo-700 text-white font-bold text-lg md:text-xl shadow whitespace-nowrap';
                el.textContent = w; el.style.left = rnd(2, 70) + '%'; el.style.top = '0px'; area.appendChild(el);
                words.push({ w, el, y: -30 });
            };
            const submit = () => {
                const v = inp.value.trim(); inp.value = ''; if(!v || G.over) return;
                let hit = null; for(const o of words) if(o.w === v && (!hit || o.y > hit.y)) hit = o;
                if(hit){
                    hit.el.remove(); words.splice(words.indexOf(hit), 1); typed++; chars += v.length;
                    addScore(v.length * 10 + lvl * 5); sfx.pop(); floatText(area, `+${v.length * 10 + lvl * 5}`, hit.el.offsetLeft + 20, hit.y, '#4ade80');
                    if(typed % 8 === 0){ lvl++; setTxt('ty-lv', 'LV ' + lvl); sfx.win(); }
                } else { sfx.bad(); shakeEl(inp); }

            };
            inp.addEventListener('keydown', e => { if(e.key === 'Enter' || (e.key === ' ' && !e.isComposing)){ e.preventDefault(); setTimeout(submit, 10); } });
            inp.addEventListener('input', e => { if(e.isComposing) return; const v = inp.value.trim(); if(v && words.some(o => o.w === v)) submit(); });   // 단어가 완성되면 자동 입력
            loop(() => {
                t++; const H = area.clientHeight;
                if(--spawnT <= 0){ spawn(); spawnT = Math.max(45, 150 - lvl * 12) / g.cfg.spd; }
                for(const o of [...words]){
                    o.y += (0.45 + lvl * 0.12) * g.cfg.spd;
                    if(o.y > H - 30){ o.el.remove(); words.splice(words.indexOf(o), 1); lives--; sfx.bad(); setTxt('ty-life', hearts(lives)); shakeEl(area); if(lives <= 0) return gameOver(`${typed}개 단어 입력 · 타수 ${Math.round(chars / ((performance.now() - startT) / 60000))}`); }
                }
            }, () => { for(const o of words) o.el.style.top = o.y + 'px'; });
        }};

        // ==========================================
        // 11. 학급 도구 엔진
        // ==========================================

        // --- 사다리타기: 이름/결과 입력, 무작위 가로줄, 경로 애니메이션 ---
        E.ladder = { ctl: 'none', noScore: true, run(g){
            const wrap = makeWrap(); let saved = store.get('ladder', null);
            let n = saved ? saved.names.length : 4;
            const keep = () => { const nm = [...wrap.querySelectorAll('[data-nm]')].map(e => e.value), rs = [...wrap.querySelectorAll('[data-rs]')].map(e => e.value); saved = { names: Array.from({length: n}, (_, i) => nm[i] || `${i + 1}번`), res: Array.from({length: n}, (_, i) => rs[i] || '꽝') }; };
            const COLORS = ['#f87171', '#fb923c', '#facc15', '#4ade80', '#22d3ee', '#818cf8', '#e879f9', '#f472b6'];
            const setup = () => {
                const names = saved && saved.names.length === n ? saved.names : Array.from({length: n}, (_, i) => `${i + 1}번`);
                const res = saved && saved.res.length === n ? saved.res : Array.from({length: n}, (_, i) => i === 0 ? '당첨 🎉' : '꽝');
                wrap.innerHTML = `<h2 class="text-2xl font-bold text-cyan-400 mb-3">🪜 사다리 설정</h2><div class="flex items-center gap-3 mb-3"><span>인원</span><button id="ld-minus" class="w-10 h-10 bg-slate-700 rounded-lg text-xl">−</button><b id="ld-n" class="text-2xl w-8">${n}</b><button id="ld-plus" class="w-10 h-10 bg-slate-700 rounded-lg text-xl">+</button></div><div class="grid grid-cols-2 gap-x-3 gap-y-1.5 w-full max-w-[380px] mb-4 text-sm"><p class="text-slate-400">참가자</p><p class="text-slate-400">결과</p>${names.map((nm, i) => `<input data-nm="${i}" value="${esc(nm)}" maxlength="8" class="bg-slate-800 border border-slate-600 rounded-lg px-2 py-1.5 text-center"><input data-rs="${i}" value="${esc(res[i])}" maxlength="10" class="bg-slate-800 border border-slate-600 rounded-lg px-2 py-1.5 text-center">`).join('')}</div><button id="ld-go" class="px-8 py-3 ${btnCls('bg-emerald-600', 'rgb(4,120,87)')} text-xl">사다리 만들기 ▶</button>`;
                $('ld-minus').addEventListener('click', () => { if(n > 2){ n--; keep(); setup(); } });
                $('ld-plus').addEventListener('click', () => { if(n < 8){ n++; keep(); setup(); } });
                $('ld-go').addEventListener('click', () => {
                    const nm = [...wrap.querySelectorAll('[data-nm]')].map(e => e.value.trim() || '?'), rs = [...wrap.querySelectorAll('[data-rs]')].map(e => e.value.trim() || '?');
                    saved = { names: nm, res: rs }; store.set('ladder', saved); play(nm, rs);
                });
            };
            const play = (names, res) => {
                const ROWS = 12, rungs = Array.from({length: ROWS}, () => Array(n - 1).fill(false));
                for(let r = 0; r < ROWS; r++) for(let c = 0; c < n - 1; c++) if(Math.random() < .45 && !(c > 0 && rungs[r][c - 1])) rungs[r][c] = true;
                for(let c = 0; c < n - 1; c++) if(!rungs.some(r => r[c])){ const r = rnd(0, ROWS - 1); rungs[r][c] = true; if(c > 0) rungs[r][c - 1] = false; if(c < n - 2) rungs[r][c + 1] = false; }
                const W = 360, H = 300, X = c => 30 + c * (W - 60) / (n - 1), Y = r => 20 + (r + .5) * (H - 40) / ROWS;
                const shown = new Set();
                wrap.innerHTML = `<div class="flex w-full max-w-[380px] justify-between px-1 mb-1">${names.map((nm, i) => `<button data-s="${i}" class="text-xs md:text-sm px-1.5 py-1 rounded-lg font-bold truncate max-w-[70px]" style="background:${COLORS[i]};color:#0f172a">${esc(nm)}</button>`).join('')}</div><svg id="ld-svg" viewBox="0 0 ${W} ${H}" class="w-full max-w-[380px] bg-slate-900 rounded-xl"><g stroke="#64748b" stroke-width="4" stroke-linecap="round">${[...Array(n)].map((_, c) => `<line x1="${X(c)}" y1="10" x2="${X(c)}" y2="${H - 10}"/>`).join('')}${rungs.map((row, r) => row.map((on, c) => on ? `<line x1="${X(c)}" y1="${Y(r)}" x2="${X(c + 1)}" y2="${Y(r)}"/>` : '').join('')).join('')}</g><g id="ld-paths"></g></svg><div class="flex w-full max-w-[380px] justify-between px-1 mt-1">${res.map((r, i) => `<div id="ld-r${i}" class="text-xs md:text-sm px-1.5 py-1 rounded-lg bg-slate-700 font-bold truncate max-w-[70px]">❓</div>`).join('')}</div><p id="ld-msg" class="text-yellow-300 text-lg h-8 mt-2">위의 이름을 눌러 사다리를 타세요!</p><div class="flex gap-2"><button id="ld-all" class="px-4 py-2 ${btnCls()}">전체 공개</button><button id="ld-re" class="px-4 py-2 ${btnCls('bg-slate-700', 'rgb(30,41,59)')}">⚙️ 다시 설정</button></div>`;
                const trace = s => { let c = s; const pts = [[X(c), 10]]; for(let r = 0; r < ROWS; r++){ pts.push([X(c), Y(r)]); if(c > 0 && rungs[r][c - 1]) c--; else if(c < n - 1 && rungs[r][c]) c++; pts.push([X(c), Y(r)]); } pts.push([X(c), H - 10]); return { pts, end: c }; };
                const run = (s, instant) => {
                    if(shown.has(s)) return; shown.add(s);
                    const { pts, end } = trace(s), pl = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
                    pl.setAttribute('points', pts.map(p => p.join(',')).join(' ')); pl.setAttribute('fill', 'none'); pl.setAttribute('stroke', COLORS[s]); pl.setAttribute('stroke-width', '5'); pl.setAttribute('stroke-linejoin', 'round');
                    $('ld-paths').appendChild(pl);
                    const len = pl.getTotalLength(); pl.style.strokeDasharray = len; pl.style.strokeDashoffset = instant ? 0 : len;
                    const reveal = () => { const r = $('ld-r' + end); if(!r) return; r.textContent = res[end]; r.style.background = COLORS[s]; r.style.color = '#0f172a'; r.classList.add('pop'); setTxt('ld-msg', `${names[s]} → ${res[end]}`); sfx.good(); };
                    if(instant) reveal(); else { pl.getBoundingClientRect(); pl.style.transition = 'stroke-dashoffset 1.6s linear'; pl.style.strokeDashoffset = 0; sfx.jump(); after(reveal, 1600); }
                };
                wrap.querySelectorAll('[data-s]').forEach(b => b.addEventListener('click', () => run(+b.dataset.s)));
                $('ld-all').addEventListener('click', () => names.forEach((_, i) => run(i, true)));
                $('ld-re').addEventListener('click', setup);
            };
            setup();
        }};

        // --- 룰렛 (청소 당번 / 급식 메뉴): 항목 편집, 감속 회전, 뽑힌 항목 제외 옵션 ---
        E.roulette = { ctl: 'none', noScore: true, run(g){
            const wrap = makeWrap(); const type = g.cfg.type;
            const DEF = type === 'food' ? ['돈까스 🍛','스파게티 🍝','짜장면 🍜','비빔밥 🍲','햄버거 🍔','카레라이스 🍛','김밥 🍙','떡볶이 🌶️','치킨 🍗','피자 🍕'] : ['교실 쓸기 🧹','칠판 닦기 🧽','분리수거 ♻️','복도 청소 🚪','창틀 닦기 🪟','화분 물주기 🪴','쉬는 날 🎉'];
            let items = store.get('roulette:' + type, DEF), rot = 0, spinning = false, exclude = false;
            const COLORS = ['#f87171', '#fb923c', '#facc15', '#4ade80', '#22d3ee', '#818cf8', '#e879f9', '#f472b6', '#a3e635', '#38bdf8'];
            wrap.innerHTML = `<div class="relative w-full max-w-[300px] aspect-square mb-3"><canvas id="rl-cv" width="400" height="400" class="w-full h-full" style="background:transparent"></canvas><div class="absolute left-1/2 -top-1 -translate-x-1/2 text-4xl drop-shadow-lg">🔻</div></div><p id="rl-res" class="text-2xl md:text-3xl font-black text-yellow-300 h-10 mb-2"></p><div class="flex flex-wrap gap-2 justify-center mb-2"><button id="rl-spin" class="px-8 py-3 ${btnCls('bg-emerald-600', 'rgb(4,120,87)')} text-xl">🎡 돌리기!</button><button id="rl-edit" class="px-4 py-3 ${btnCls('bg-slate-700', 'rgb(30,41,59)')}">✏️ 항목 수정</button></div><label class="text-sm text-slate-300 flex items-center gap-2"><input id="rl-ex" type="checkbox" class="w-4 h-4"> 뽑힌 항목은 다음에서 제외</label><div id="rl-editor" class="hidden w-full max-w-[340px] mt-3"><textarea id="rl-ta" rows="6" class="w-full bg-slate-800 border border-slate-600 rounded-lg p-2 text-sm text-white"></textarea><div class="flex gap-2 mt-2 justify-center"><button id="rl-save" class="px-4 py-2 ${btnCls()}">저장</button><button id="rl-def" class="px-4 py-2 ${btnCls('bg-slate-700', 'rgb(30,41,59)')}">기본값</button></div><p class="text-xs text-slate-500 mt-1">한 줄에 하나씩 입력 (2~16개)</p></div>`;
            const cv = $('rl-cv'), ctx = cv.getContext('2d'), R = 190;
            const draw = () => {
                ctx.clearRect(0, 0, 400, 400); const n = items.length, a = Math.PI * 2 / n;
                items.forEach((it, i) => {
                    const s = rot + i * a - Math.PI / 2;
                    ctx.fillStyle = COLORS[i % COLORS.length]; ctx.beginPath(); ctx.moveTo(200, 200); ctx.arc(200, 200, R, s, s + a); ctx.closePath(); ctx.fill(); ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2; ctx.stroke();
                    ctx.save(); ctx.translate(200, 200); ctx.rotate(s + a / 2); ctx.fillStyle = '#0f172a'; ctx.font = `bold ${n > 10 ? 15 : 19}px Jua, ${EMOJI_FONT}`; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText(it.length > 10 ? it.slice(0, 10) + '…' : it, R - 12, 0); ctx.restore();
                });
                ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.arc(200, 200, 26, 0, 7); ctx.fill(); ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.arc(200, 200, 16, 0, 7); ctx.fill();
            };
            const current = () => { const n = items.length, a = Math.PI * 2 / n; const p = ((-rot) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2); return Math.floor(p / a) % n; };
            $('rl-spin').addEventListener('click', () => {
                if(spinning || items.length < 2) return; spinning = true; setTxt('rl-res', '두구두구...');
                const start = rot, total = Math.PI * 2 * rnd(5, 8) + Math.random() * Math.PI * 2, dur = 4200, t0 = performance.now(); let lastIdx = current();
                const step = now => {
                    if(!G || !G.alive) return;
                    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 4); rot = start + total * e; draw();
                    const ci = current(); if(ci !== lastIdx){ lastIdx = ci; sfx.tick(); }
                    if(k < 1){ G.raf = requestAnimationFrame(step); return; }
                    const chosen = items[current()]; setTxt('rl-res', `🎉 ${chosen}`); $('rl-res').classList.remove('pop'); void $('rl-res').offsetWidth; $('rl-res').classList.add('pop'); sfx.win();
                    if(exclude && items.length > 2){ after(() => { items = items.filter((_, i) => i !== current()); draw(); }, 1500); }
                    spinning = false;
                };
                G.raf = requestAnimationFrame(step);
            });
            $('rl-ex').addEventListener('change', e => exclude = e.target.checked);
            $('rl-edit').addEventListener('click', () => { $('rl-editor').classList.toggle('hidden'); $('rl-ta').value = items.join('\n'); });
            $('rl-save').addEventListener('click', () => { const v = $('rl-ta').value.split('\n').map(s => s.trim()).filter(Boolean).slice(0, 16); if(v.length < 2) return shakeEl($('rl-ta')); items = v; store.set('roulette:' + type, items); $('rl-editor').classList.add('hidden'); draw(); });
            $('rl-def').addEventListener('click', () => { $('rl-ta').value = DEF.join('\n'); });
            draw();
        }};

        // --- 발표자 제비뽑기: 번호 범위, 중복 없이 뽑기, 기록 ---
        E.draw = { ctl: 'none', noScore: true, run(g){
            const wrap = makeWrap(); let max = store.get('draw:max', 25), drawn = [], busy = false;
            wrap.innerHTML = `<div class="flex items-center gap-2 mb-4 text-lg"><span>1번부터</span><input id="dr-max" type="number" min="2" max="99" value="${max}" class="w-20 bg-slate-800 border border-slate-600 rounded-lg px-2 py-1 text-center text-xl"><span>번까지</span></div><div id="dr-card" class="w-40 h-52 md:w-48 md:h-60 bg-gradient-to-br from-yellow-300 to-orange-500 rounded-3xl shadow-2xl flex items-center justify-center text-7xl md:text-8xl font-black text-slate-900 mb-4 border-8 border-white">?</div><p id="dr-left" class="text-slate-400 mb-3"></p><div class="flex gap-2 mb-4"><button id="dr-go" class="px-8 py-3 ${btnCls('bg-emerald-600', 'rgb(4,120,87)')} text-xl">🎟️ 뽑기</button><button id="dr-reset" class="px-4 py-3 ${btnCls('bg-slate-700', 'rgb(30,41,59)')}">🔄 초기화</button></div><div id="dr-hist" class="flex flex-wrap gap-1.5 justify-center max-w-[360px]"></div>`;
            const upd = () => { setTxt('dr-left', `남은 번호 ${max - drawn.length}개 / 전체 ${max}개`); $('dr-hist').innerHTML = drawn.map((v, i) => `<span class="px-2.5 py-1 rounded-full ${i === drawn.length - 1 ? 'bg-yellow-500 text-slate-900' : 'bg-slate-700'} font-bold">${v}</span>`).join(''); };
            $('dr-max').addEventListener('change', e => { max = clamp(parseInt(e.target.value) || 25, 2, 99); e.target.value = max; store.set('draw:max', max); drawn = []; setTxt('dr-card', '?'); upd(); });
            $('dr-reset').addEventListener('click', () => { drawn = []; setTxt('dr-card', '?'); upd(); });
            $('dr-go').addEventListener('click', async () => {
                if(busy) return; const left = [...Array(max).keys()].map(i => i + 1).filter(v => !drawn.includes(v));
                if(!left.length){ setTxt('dr-card', '끝'); return; }
                busy = true; const card = $('dr-card');
                for(let i = 0; i < 14; i++){ card.textContent = pick(left); sfx.tick(); await wait(50 + i * 12); }
                const v = pick(left); drawn.push(v); card.textContent = v; card.classList.remove('pop'); void card.offsetWidth; card.classList.add('pop'); sfx.win(); upd(); busy = false;
            });
            upd();
        }};

        // --- 주사위: 점 표시 주사위, 굴리기 애니메이션, 합계와 기록 ---
        E.dice = { ctl: 'none', noScore: true, run(g){
            const wrap = makeWrap(); const n = g.cfg.n, PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
            let busy = false, hist = [];
            const face = v => `<div class="grid grid-cols-3 grid-rows-3 gap-1 p-3 w-full h-full">${[...Array(9)].map((_, i) => `<div class="flex items-center justify-center">${PIPS[v].includes(i) ? `<div class="pip" style="width:70%;${v === 1 ? 'background:#dc2626;width:90%' : ''}"></div>` : ''}</div>`).join('')}</div>`;
            wrap.innerHTML = `<div id="dc-box" class="flex gap-6 mb-5">${[...Array(n)].map((_, i) => `<div id="dc-${i}" class="w-28 h-28 md:w-36 md:h-36 bg-white rounded-3xl shadow-[0_8px_0_#cbd5e1] transition-transform">${face(i + 1)}</div>`).join('')}</div><p id="dc-sum" class="text-3xl font-black text-yellow-300 h-10 mb-3">${n > 1 ? '합계: ?' : ''}</p><button id="dc-go" class="px-10 py-4 ${btnCls('bg-emerald-600', 'rgb(4,120,87)')} text-2xl mb-4">🎲 굴리기</button><div id="dc-hist" class="flex flex-wrap gap-1.5 justify-center max-w-[360px] text-sm"></div>`;
            const roll = async () => {
                if(busy) return; busy = true; const els = [...Array(n)].map((_, i) => $('dc-' + i));
                for(let k = 0; k < 10; k++){ els.forEach(el => { el.innerHTML = face(rnd(1, 6)); el.style.transform = `rotate(${rnd(-25, 25)}deg) translateY(${rnd(-12, 0)}px)`; }); tone(200 + rnd(0, 200), .03, 'square', .03); await wait(70); }
                const vals = els.map(el => { const v = rnd(1, 6); el.innerHTML = face(v); el.style.transform = 'none'; return v; });
                const sum = vals.reduce((a, b) => a + b, 0); sfx.coin();
                setTxt('dc-sum', n > 1 ? `합계: ${sum}${vals[0] === vals[1] ? ' (더블! 🎉)' : ''}` : `${sum}!`);
                hist.unshift(n > 1 ? `${vals.join('+')}=${sum}` : sum); hist = hist.slice(0, 12);
                $('dc-hist').innerHTML = hist.map((h, i) => `<span class="px-2 py-1 rounded-full ${i ? 'bg-slate-700' : 'bg-yellow-500 text-slate-900 font-bold'}">${h}</span>`).join('');
                busy = false;

            $('dc-go').addEventListener('click', roll);
            G.onPress = k => { if(k === 'action') roll(); };
        }};

        // --- 스톱워치: 5라운드, 3라운드부터 숫자가 사라지는 블라인드 모드 ---
        E.stopwatch = { ctl: 'none', run(g){
            const wrap = makeWrap(); const TARGETS = [1, 1, 1, 2, 3]; let round = 0, running = false, t0 = 0, results = [];
            wrap.innerHTML = statBar([['sw-round', '1/5 라운드'], ['sw-goal', '목표 1.00초']]) + `<div id="sw-disp" class="text-7xl md:text-8xl font-black font-mono text-white mb-3 tabular-nums">0.00</div><p id="sw-msg" class="text-lg text-yellow-300 h-8 mb-4">시작을 누르고 목표 시간에 멈추세요!</p><button id="sw-btn" class="w-40 h-40 rounded-full ${btnCls('bg-emerald-600', 'rgb(4,120,87)')} text-3xl">시작</button><div id="sw-log" class="mt-4 text-sm text-slate-300 space-y-1"></div>`;
            const disp = $('sw-disp');
            const tick = () => { if(!running) return; const e = (performance.now() - t0) / 1000; disp.textContent = (round >= 2 && e > .5) ? '?.??' : e.toFixed(2); G.raf = requestAnimationFrame(tick); };
            const press = () => {
                if(G.over) return; const b = $('sw-btn');
                if(!running){ running = true; t0 = performance.now(); b.textContent = '멈춤!'; b.classList.replace('bg-emerald-600', 'bg-red-600'); setTxt('sw-msg', round >= 2 ? '🙈 블라인드! 마음속으로 세어 보세요' : ''); sfx.tick(); G.raf = requestAnimationFrame(tick); return; }

        // --- 픽셀 아크릴: 16×16, 팔레트, 펜/지우개/채우기, PNG 저장, 자동 저장 ---

                count++; const shape = pick(['circle', 'circle', 'ring', 'heart', 'star']), n = 70;
                for(let i = 0; i < n; i++){
                    const a = i / n * Math.PI * 2; let sp = shape === 'ring' ? 4 : Math.random() * 4 + 1, vx = Math.cos(a) * sp, vy = Math.sin(a) * sp;
                    if(shape === 'heart'){ const hx = 16 * Math.pow(Math.sin(a), 3), hy = -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)); vx = hx * .28; vy = hy * .28; }
                    if(shape === 'star'){ const k = 1 + .6 * Math.cos(5 * a); vx *= k; vy *= k; }
                    parts.push({ x: r.x, y: r.y, vx, vy, life: rnd(50, 80), hue: r.hue + rnd(-20, 20) });
                }
                sfx.boom(); tone(rnd(500, 900), .3, 'triangle', .03, .05);
            };
            listen(cv, 'pointerdown', e => { const p = canvasPos(cv, e); launch(p.x, p.y); });
            G.onPress = k => { if(k === 'action') auto = !auto; };
            loop(() => {
                t++; if(auto && t % 25 === 0) launch(rnd(60, w - 60), rnd(60, h / 2));
                rockets.forEach(r => { const dx = r.tx - r.x, dy = r.ty - r.y, d = Math.hypot(dx, dy); if(d < 8){ r.done = true; explode(r); } else { r.x += dx / d * 8; r.y += dy / d * 8; } });
                rockets = rockets.filter(r => !r.done);
                parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vx *= .98; p.vy = p.vy * .98 + .05; p.life--; }); parts = parts.filter(p => p.life > 0);
            }, () => {
                ctx.fillStyle = 'rgba(2,6,23,.22)'; ctx.fillRect(0, 0, w, h);
                rockets.forEach(r => { ctx.fillStyle = `hsl(${r.hue},100%,75%)`; ctx.fillRect(r.x - 2, r.y - 2, 4, 8); });
                parts.forEach(p => { ctx.fillStyle = `hsla(${p.hue},100%,${50 + p.life / 3}%,${Math.min(1, p.life / 30)})`; ctx.fillRect(p.x, p.y, 3, 3); });

            });
        }};

        // --- 키우기(타이쿤): 테마별 단계 성장, 터치/자동 업그레이드, 황금 보너스 ---

            tube:   { unit: '조회수', fx: '👍', up1: '🎙️ 장비 업그레이드', up2: '✂️ 편집자 고용', btn: '채널 성장', stages: [['새내기 유튜버', '📹'], ['구독자 1천', '🔔'], ['실버 버튼', '🥈'], ['골드 버튼', '🥇'], ['다이아 버튼', '💎']] },

        E.tycoon = { ctl: 'none', run(g){

        // --- 용사 키우기: 몬스터 체력바, 치명타, 무기/동료 업그레이드, 제한시간 드래곤 보스 ---
        E.rpg = { ctl: 'none', run(g){
            const MON = [['🐌', '달팽이', 15], ['🐀', '들쥐', 40], ['🦇', '박쥐', 90], ['🐍', '독사', 180], ['🐺', '늑대', 350], ['🐗', '멧돼지', 650], ['👺', '도깨비', 1200], ['🧟', '좀비', 2200], ['👹', '오우거', 4000], ['🐉', '드래곤', 10000]];

        // ==========================================

        // --- 숨은 그림 찾기: 30초, 단계마다 칸 증가, 오답 -3초 ---
        E.find_target = { ctl: 'none', run(g){

            const judge = isEven => {
                if(G.over) return;
                if(isEven !== null && (num % 2 === 0) === isEven){ combo++; cnt++; addScore(10 + Math.min(combo, 20)); sfx.coin(); }
                else { combo = 0; lives--; sfx.bad(); shakeEl($('eo-num')); setTxt('eo-life', hearts(lives)); if(lives <= 0) return gameOver(`${cnt}개 정답! ${isEven === null ? '(시간 초과)' : `(${num}은 ${num % 2 ? '홀수' : '짝수'})`}`); }
                setTxt('eo-cnt', '정답 ' + cnt); setTxt('eo-combo', '콤보 ' + combo); next();
            };
            every(() => { const left = limit - (performance.now() - qt), bar = $('eo-bar'); if(bar){ bar.style.width = Math.max(0, left / limit * 100) + '%'; bar.classList.toggle('bg-red-500', left < 800); } if(left <= 0) judge(null); }, 50);
            $('eo-e').addEventListener('click', () => judge(true)); $('eo-o').addEventListener('click', () => judge(false));
            G.onPress = k => { if(k === 'left') judge(true); if(k === 'right') judge(false); };
            next();
        }};

        // ==========================================
        // 13. 시작
        // ==========================================
        // 등록되지 않은 엔진이 있으면 콘솔에 경고 (개발용 안전장치)
        gameDefs.forEach(g => { if(!E[g.e]) console.warn('엔진 없음:', g.e, g.t); });
        window.addEventListener('keydown', e => { if(e.key === 'Escape' && !$('settings').classList.contains('hidden')) $('settings').classList.add('hidden'); });
        window.onload = () => { loadMainScreen(); };
    </script>
</body>
