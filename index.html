        body { font-family: 'Jua', sans-serif; overflow: hidden; touch-action: none; background-color: #0f172a; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 10px; }
        .btn-press:active { transform: scale(0.92); }
        .prevent-select { -webkit-user-select: none; user-select: none; }

        #game-container { display: flex; align-items: center; justify-content: center; background-color: #000; }
        canvas { touch-action: none; outline: none; background-color: #020617; max-width: 100%; max-height: 100%; object-fit: contain; }

            </div>

        // 1. 이벤트 방어 및 매핑 (스크롤 튐 완전 해결)
        window.addEventListener('keydown', e => {
            if(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                if(document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') e.preventDefault();
            }
            if(e.key === 'ArrowUp' || e.key === 'w') keys.up = true;
            if(e.key === 'ArrowDown' || e.key === 's') keys.down = true;
            if(e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if(e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if(e.key === ' ') keys.action = true;
        }, {passive: false});

        window.addEventListener('keyup', e => {
            if(e.key === 'ArrowUp' || e.key === 'w') keys.up = false;
            if(e.key === 'ArrowDown' || e.key === 's') keys.down = false;
            if(e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if(e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            if(e.key === ' ') keys.action = false;
        });

        const bindBtn = (id, key) => {
            const btn = document.getElementById(id); if(!btn) return;
            const press = (e) => { e.preventDefault(); keys[key] = true; btn.classList.add('bg-slate-700'); };
            const release = (e) => { e.preventDefault(); keys[key] = false; btn.classList.remove('bg-slate-700'); };
            btn.addEventListener('touchstart', press, {passive: false}); btn.addEventListener('mousedown', press);
            btn.addEventListener('touchend', release); btn.addEventListener('mouseup', release); btn.addEventListener('mouseleave', release);
        };
        bindBtn('btn-up', 'up'); bindBtn('btn-down', 'down'); bindBtn('btn-left', 'left'); bindBtn('btn-right', 'right'); bindBtn('btn-action', 'action');

        document.getElementById('btn-header-main').addEventListener('click', loadMainScreen);
        document.getElementById('btn-top-main').addEventListener('click', loadMainScreen);
        document.getElementById('btn-modal-retry').addEventListener('click', () => { modal.classList.add('hidden'); if(currentId) startGame(currentId); });
        document.getElementById('btn-modal-main').addEventListener('click', () => { modal.classList.add('hidden'); loadMainScreen(); });

        ];

        gameDefs.forEach((g, i) => g.id = i + 1);

        // 3. UI 렌더링 및 모달 컨트롤 (버그 완전 수정)
        function initMenu() {
            const menu = document.getElementById('game-menu');
            let html = '';
            const cats = [...new Set(gameDefs.map(g => g.c))];
            cats.forEach(cName => {
                html += `<div class="mb-4"><p class="font-bold text-yellow-400 mb-1 border-b border-slate-700 pb-1 text-xs md:text-sm pl-1">${cName}</p><div class="grid grid-cols-1 gap-1">`;
                gameDefs.filter(g => g.c === cName).forEach(g => { 
                    html += `<button id="btn-menu-${g.id}" class="text-left px-2 py-2 md:py-3 rounded-lg bg-slate-800 hover:bg-indigo-600 transition truncate text-slate-200 focus:outline-none focus:ring-1 focus:ring-cyan-400 text-[11px] md:text-sm border border-slate-700 active:scale-95 shadow">${g.id}. ${g.t}</button>`; 
                });
                html += `</div></div>`;
            });
            menu.innerHTML = html;
            gameDefs.forEach(g => { 
                const btn = document.getElementById(`btn-menu-${g.id}`); 
                if(btn) btn.addEventListener('click', () => selectGame(g.id)); 
            });
        }

        function loadMainScreen() {
            closeModal();
            currentId = null; score = 0; document.getElementById('score-board').innerText = 'SCORE: 0';
            
            menuView.classList.remove('hidden');
            if(window.innerWidth < 1024) gameView.classList.add('hidden');
            else { gameView.classList.remove('hidden'); gameView.classList.add('flex'); }
            
            mobileControls.classList.add('hidden'); actionControl.classList.add('hidden');
            container.innerHTML = `<div class="text-center p-2 flex flex-col items-center justify-center w-full h-full bg-slate-950 rounded-xl"><span class="text-6xl md:text-7xl mb-4 md:mb-6 animate-bounce">🚀</span><h2 class="text-lg md:text-2xl font-bold text-yellow-400 mb-2">엽쌤스쿨 100선 아카이브</h2><p class="text-[11px] md:text-sm text-slate-400 px-2 leading-relaxed">아케이드, 퍼즐, 교육용 퀴즈, 학급 도구, 엽쌤 스페셜까지!<br>단 하나도 빠짐없이 100% 구동되는 리마스터 에디션.</p></div>`;
        }

        function selectGame(id) {
            closeModal(); currentId = id; const game = gameDefs.find(g => g.id === id); if(!game) return;
            score = 0; document.getElementById('score-board').innerText = 'SCORE: 0';
            document.getElementById('game-title').innerText = game.id + ". " + game.t; document.getElementById('game-info').innerText = game.d;

            if(window.innerWidth < 1024) {
                menuView.classList.add('hidden');
                gameView.classList.remove('hidden'); gameView.classList.add('flex');
            }

            const isCanvas = ['snake','pong','brick','dodge','catch','shooter','dino','flappy','pacman','defense','rhythm','bowling','space_real'].includes(game.e);
            if(isCanvas) { mobileControls.classList.remove('hidden'); mobileControls.classList.add('grid'); actionControl.classList.remove('hidden'); }
            else { mobileControls.classList.add('hidden'); mobileControls.classList.remove('grid'); actionControl.classList.add('hidden'); }

            container.innerHTML = `<div class="text-center p-4 md:p-6 flex flex-col items-center justify-center w-full h-full bg-slate-900 rounded-xl"><h3 class="text-2xl md:text-3xl font-bold text-cyan-400 mb-4">${game.t}</h3><p class="text-sm md:text-base text-slate-300 mb-8 md:mb-10">${game.d}</p><button id="btn-start-game" class="px-8 py-4 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-bold text-xl text-white shadow-[0_4px_0_rgb(4,120,87)] active:translate-y-1 active:shadow-none transition w-full max-w-[250px]">🚀 게임 시작!</button></div>`;
            document.getElementById('btn-start-game').addEventListener('click', () => startGame(id));
        }

        function triggerGameOver(scoreVal) {
            if(currentTimer) { clearInterval(currentTimer); currentTimer = null; }
            keys = { up: false, down: false, left: false, right: false, action: false };
            document.getElementById('modal-title').innerText = "게임 오버!"; document.getElementById('modal-title').className = "text-3xl md:text-5xl font-bold text-red-500 mb-2 md:mb-4 text-center";
            document.getElementById('modal-desc').innerText = "최종 점수: " + scoreVal; modal.classList.remove('hidden');
        }

        function triggerSuccess(msg, pts = 0) {
            if(currentTimer) { clearInterval(currentTimer); currentTimer = null; }
            keys = { up: false, down: false, left: false, right: false, action: false };
            if(pts > 0) { score += pts; document.getElementById('score-board').innerText = 'SCORE: ' + score; }
            document.getElementById('modal-title').innerText = "성공!"; document.getElementById('modal-title').className = "text-3xl md:text-5xl font-bold text-emerald-400 mb-2 md:mb-4 text-center";
            document.getElementById('modal-desc').innerText = msg; modal.classList.remove('hidden');
        }

        function closeModal(restart = false) {
            modal.classList.add('hidden');
            if(restart && currentId) startGame(currentId);
        }

        function startGame(id) {
            const game = gameDefs.find(g => g.id === id); if(!game) return;
            score = 0; document.getElementById('score-board').innerText = 'SCORE: 0';
            const isCanvas = ['snake','pong','brick','dodge','catch','shooter','dino','flappy','pacman','defense','rhythm','bowling','space_real'].includes(game.e);
            if(isCanvas) runCanvasEngine(game); else runDOMEngine(game);
        }

        // ==========================================
        // 4. 캔버스 아케이드 완벽 구현 엔진 
        // ==========================================
        function getCanvasContext() {
            if (currentTimer) { clearInterval(currentTimer); currentTimer = null; }
            keys = { up: false, down: false, left: false, right: false, action: false };
            container.innerHTML = '<canvas id="canvas" width="480" height="480" class="rounded-lg shadow-inner"></canvas>';
            return document.getElementById('canvas').getContext('2d');
        }

        function runCanvasEngine(g) {
            const ctx = getCanvasContext();
            const w = 480, h = 480; let frame = 0;

            if(g.e === 'snake') {
                let snake = [{x:12, y:12}], food = {x:6, y:6}, dx=1, dy=0, size=20;
                currentTimer = setInterval(() => {
                    if(keys.up && dy===0){dx=0;dy=-1;} if(keys.down && dy===0){dx=0;dy=1;}
                    if(keys.left && dx===0){dx=-1;dy=0;} if(keys.right && dx===0){dx=1;dy=0;}
                    let head = {x: snake[0].x+dx, y: snake[0].y+dy};
                    if(head.x<0||head.x>=24||head.y<0||head.y>=24||snake.slice(1).some(s=>s.x===head.x&&s.y===head.y)){ triggerGameOver(score); return; }
                    snake.unshift(head);
                    if(head.x===food.x&&head.y===food.y){ score+=10; document.getElementById('score-board').innerText='SCORE: '+score; food={x:Math.floor(Math.random()*24), y:Math.floor(Math.random()*24)}; } else snake.pop();
                    ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,w,h);
                    ctx.fillStyle='#ef4444'; ctx.fillRect(food.x*size, food.y*size, size-2, size-2);
                    ctx.fillStyle='#22c55e'; snake.forEach(s=>ctx.fillRect(s.x*size, s.y*size, size-2, size-2));
                }, g.cfg.spd || 100);
            }
            else if(g.e === 'pong') {
                let py=200, bx=240, by=240, dx=4*g.cfg.spd, dy=3*g.cfg.spd;
                currentTimer = setInterval(() => {
                    if(keys.up && py>0) py-=8; if(keys.down && py<h-80) py+=8;
                    bx+=dx; by+=dy; 
                    if(by<0||by>h-10) dy*=-1; if(bx>w-10) dx*=-1;
                    if(bx<=20 && by>=py && by<=py+80){ dx*=-1; score+=10; document.getElementById('score-board').innerText='SCORE: '+score; }
                    if(bx<0){ triggerGameOver(score); return; }
                    ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,w,h);
                    ctx.fillStyle='#fff'; ctx.fillRect(10,py,12,80); ctx.fillRect(bx,by,10,10);
                }, 1000/60);
            }
            else if(g.e === 'brick') {
                let px=200, bx=240, by=300, dx=4, dy=-4, bricks = []; 
                for(let c=0;c<6;c++){ bricks[c]=[]; for(let r=0;r<5;r++) bricks[c][r]={status:1}; }
                currentTimer = setInterval(() => {
                    if(keys.right && px<w-80) px+=8; if(keys.left && px>0) px-=8;
                    bx+=dx; by+=dy;
                    if(bx>w-8||bx<8) dx*=-1; if(by<8) dy*=-1;
                    if(by>h-30 && bx>px && bx<px+80) dy*=-1;
                    if(by>h){ triggerGameOver(score); return; }
                    
                    let allCleared = true;
                    for(let c=0;c<6;c++){for(let r=0;r<5;r++){
                        let b=bricks[c][r]; if(b.status===1){
                            allCleared = false;
                            let bx_pos=c*75+15, by_pos=r*25+20;
                            if(bx>bx_pos && bx<bx_pos+70 && by>by_pos && by<by_pos+20){ dy*=-1; b.status=0; score+=50; document.getElementById('score-board').innerText='SCORE: '+score; }
                        }
                    }}
                    if(allCleared && g.cfg.inf) { for(let c=0;c<6;c++) for(let r=0;r<5;r++) bricks[c][r].status=1; by=300; dy=-4; } 
                    else if(allCleared) { triggerSuccess('모든 벽돌 격파 성공!', score); return; }

                    ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,w,h);
                    for(let c=0;c<6;c++){for(let r=0;r<5;r++){ if(bricks[c][r].status===1){ctx.fillStyle='#38bdf8'; ctx.fillRect(c*75+15,r*25+20,70,18);} }}
                    ctx.fillStyle='#22c55e'; ctx.fillRect(px,h-20,80,12); ctx.fillStyle='#ef4444'; ctx.beginPath(); ctx.arc(bx,by,8,0,Math.PI*2); ctx.fill();
                }, 1000/60);
            }
            else if(g.e === 'space_real') {
                let px=220, py=400, meteors=[], stars=[];
                currentTimer = setInterval(() => {
                    frame++; 
                    if(keys.up && py>0) py-=6; if(keys.down && py<h-30) py+=6;
                    if(keys.left && px>0) px-=6; if(keys.right && px<w-30) px+=6;
                    
                    if(frame%5===0) stars.push({x:Math.random()*w, y:0}); 
                    if(frame%20===0) meteors.push({x:Math.random()*(w-40), y:-40, spd:4+Math.random()*3});
                    
                    for(let i=stars.length-1; i>=0; i--) { stars[i].y+=8; if(stars[i].y>h) stars.splice(i,1); }
                    for(let i=meteors.length-1; i>=0; i--) {
                        meteors[i].y+=meteors[i].spd;
                        if(meteors[i].y>h) { meteors.splice(i,1); score+=10; document.getElementById('score-board').innerText='SCORE: '+score; }
                        else if(px<meteors[i].x+30 && px+30>meteors[i].x && py<meteors[i].y+30 && py+30>meteors[i].y) { triggerGameOver(score); return; }
                    }
                    
                    ctx.fillStyle='#020617'; ctx.fillRect(0,0,w,h); 
                    ctx.fillStyle='#ffffff'; stars.forEach(s=>ctx.fillRect(s.x, s.y, 2, 8));
                    ctx.fillStyle='#38bdf8'; ctx.fillRect(px,py,30,30);
                    ctx.fillStyle = '#ef4444'; meteors.forEach(m=>{ ctx.beginPath(); ctx.arc(m.x+15, m.y+15, 15, 0, Math.PI*2); ctx.fill(); });
                }, 1000/60);
            }
            else if(g.e === 'shooter') {
                let px=220, bullets=[], enemies=[], cd=0;
                currentTimer = setInterval(() => {
                    frame++; if(cd>0) cd--;
                    if(keys.right && px<w-40) px+=6; if(keys.left && px>0) px-=6;
                    if(keys.action && cd===0) { bullets.push({x:px+18, y:h-40}); if(g.cfg.spread){bullets.push({x:px, y:h-40}); bullets.push({x:px+36, y:h-40});} cd=15; keys.action=false; }
                    if(frame%(g.cfg.hard?25:40)===0) enemies.push({x:Math.random()*(w-40), y:-40, hp:g.cfg.hard?2:1});
                    
                    for(let i=bullets.length-1; i>=0; i--) { bullets[i].y -= 10; if(bullets[i].y < 0) bullets.splice(i,1); }
                    for(let i=enemies.length-1; i>=0; i--){
                        enemies[i].y += (g.cfg.hard?4:3);
                        if(enemies[i].y > h){ triggerGameOver(score); return; }
                        for(let j=bullets.length-1; j>=0; j--){
                            if(bullets[j] && bullets[j].x > enemies[i].x-10 && bullets[j].x < enemies[i].x+40 && bullets[j].y > enemies[i].y && bullets[j].y < enemies[i].y+40) {
                                bullets.splice(j,1); enemies[i].hp--;
                                if(enemies[i].hp <= 0) { enemies.splice(i,1); score+=30; document.getElementById('score-board').innerText='SCORE: '+score; }
                                break;
                            }
                        }
                    }
                    ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,w,h);
                    ctx.fillStyle='#22c55e'; ctx.fillRect(px,h-40,40,30); 
                    ctx.fillStyle = g.cfg.ice ? '#e0f2fe' : '#fbbf24'; bullets.forEach(b=>ctx.fillRect(b.x,b.y,4,15)); 
                    ctx.fillStyle = g.cfg.ice ? '#cbd5e1' : '#a855f7'; enemies.forEach(e=>ctx.fillRect(e.x,e.y,40,40)); 
                }, 1000/60);
            }
            else if(g.e === 'defense') {
                let enemies=[];
                const canvas = document.getElementById('canvas');
                const chkHit = (x,y) => { for(let i=enemies.length-1; i>=0; i--){ if(Math.hypot(enemies[i].x-x, enemies[i].y-y)<40){ enemies.splice(i,1); score+=20; document.getElementById('score-board').innerText='SCORE: '+score; } } };
                canvas.addEventListener('mousedown', e=>{ let r=canvas.getBoundingClientRect(); chkHit((e.clientX-r.left)*480/r.width, (e.clientY-r.top)*480/r.height); });
                canvas.addEventListener('touchstart', e=>{ e.preventDefault(); let r=canvas.getBoundingClientRect(); chkHit((e.touches[0].clientX-r.left)*480/r.width, (e.touches[0].clientY-r.top)*480/r.height); }, {passive:false});
                
                currentTimer = setInterval(() => {
                    frame++; if(frame%35===0) enemies.push({x:Math.random()*(w-40)+20, y:-40});
                    for(let i=enemies.length-1; i>=0; i--){ enemies[i].y+=2.5; if(enemies[i].y>h){ triggerGameOver(score); return; } }
                    ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,w,h);
                    ctx.fillStyle='#3b82f6'; ctx.fillRect(0,h-20,w,20);
                    ctx.fillStyle='#ef4444'; enemies.forEach(e=>{ ctx.beginPath(); ctx.arc(e.x, e.y, 25, 0, Math.PI*2); ctx.fill(); });
                }, 1000/60);
            }
            else if(g.e === 'rhythm') {
                let notes=[], spd=g.cfg.spd||4;
                currentTimer = setInterval(() => {
                    frame++; if(frame%(spd*10)===0) notes.push({y:0});
                    if(keys.action) {
                        let hit=false; for(let i=notes.length-1; i>=0; i--){ if(notes[i].y>h-80 && notes[i].y<h-20){ notes.splice(i,1); hit=true; score+=50; document.getElementById('score-board').innerText='SCORE: '+score; break; } }
                        if(!hit && notes.length>0 && notes[0].y>h/2){ triggerGameOver(score); return; } keys.action=false;
                    }
                    for(let i=notes.length-1; i>=0; i--){ notes[i].y+=spd; if(notes[i].y>h){ triggerGameOver(score); return; } }
                    ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,w,h);
                    ctx.fillStyle='#334155'; ctx.fillRect(0,h-80,w,60);
                    ctx.fillStyle='#38bdf8'; notes.forEach(n=>ctx.fillRect(w/2-30, n.y, 60, 20));
                }, 1000/60);
            }
            else if(g.e === 'bowling') {
                let bx=0, bdx=7, thn=false, by=h-60;
                currentTimer = setInterval(() => {
                    if(!thn) { bx+=bdx; if(bx>w-30 || bx<0) bdx*=-1; }
                    if(keys.action && !thn) { thn=true; keys.action=false; }

        // ==========================================

        function runDOMEngine(g) {

                window.cHn=(i)=>{ if(s===null){if(p[i].length>0){s=i;dHn();}}else{ let d=p[s][p[s].length-1]; if(p[i].length===0||p[i][p[i].length-1]>d){p[i].push(p[s].pop());score+=10;document.getElementById('score-board').innerText='SCORE: '+score;} s=null; dHn(); if(p[2].length===3)triggerSuccess('하노이 탑 완성!',100); } }; dHn();

                window.mSk=(dx,dy)=>{ let nx=px+dx,ny=py+dy; if(nx>=0&&nx<5&&ny>=0&&ny<5){ if(nx===bx&&ny===by){ let nbx=bx+dx,nby=by+dy; if(nbx>=0&&nbx<5&&nby>=0&&nby<5){bx=nbx;by=nby;px=nx;py=ny;} }else{px=nx;py=ny;} score+=5;document.getElementById('score-board').innerText='SCORE: '+score; dSk(); if(bx===3&&by===3)triggerSuccess('창고 정리 완료!',100); } }; dSk();
            }
            else if(g.e === 'colormatch') {
                let cls=['bg-red-500','bg-blue-500','bg-green-500','bg-yellow-500','bg-pink-500','bg-purple-500'];
                window.dCm=()=>{ let tg=cls[Math.floor(Math.random()*cls.length)], op=[...cls].sort(()=>Math.random()-0.5).slice(0,4); if(!op.includes(tg))op[Math.floor(Math.random()*4)]=tg; let h=`<h2 class="text-2xl font-bold text-cyan-400 mb-6">색상 매칭</h2><div class="w-24 h-24 rounded-2xl mx-auto shadow-lg mb-8 ${tg}"></div><div class="grid grid-cols-2 gap-4 w-[200px] mx-auto">`; op.forEach((c,i)=>{ h+=`<button onclick="cCm('${c}','${tg}')" class="w-full aspect-square rounded-xl shadow-md ${c} active:scale-95 transition"></button>`; }); wrap.innerHTML=h+`</div>`; };

                const cEO = (isE) => { if((num%2===0) === isE){ score+=10; document.getElementById('score-board').innerText='SCORE: '+score; nxNum(); } else triggerGameOver(score); };

            }
            else if(g.e === 'tictactoe') {
                let bd=Array(9).fill(''); let h=`<h2 class="text-2xl font-bold text-emerald-400 mb-6">틱택토 (삼목)</h2><div class="grid grid-cols-3 gap-2 w-[260px] mx-auto">`;
                for(let i=0;i<9;i++) h+=`<button id="tic-${i}" class="w-full aspect-square bg-slate-800 text-5xl font-black rounded-xl text-yellow-400 shadow-inner hover:bg-slate-700 transition"></button>`; wrap.innerHTML = h + `</div>`;
                for(let i=0;i<9;i++) { document.getElementById(`tic-${i}`).addEventListener('click', function() { if(bd[i] !== '') return; bd[i] = 'X'; this.innerText = 'X'; let empty = bd.map((v,idx)=>v===''?idx:-1).filter(v=>v!==-1); if(empty.length>0) { let c=empty[Math.floor(Math.random()*empty.length)]; bd[c]='O'; setTimeout(()=>{ document.getElementById(`tic-${c}`).innerText='O'; document.getElementById(`tic-${c}`).classList.add('text-cyan-400'); },300); } else { setTimeout(()=>triggerSuccess('무승부입니다!', 0), 400); } }); }
            }
            else if(g.e === 'find_target') {
                let target = g.cfg.ico, bg = g.cfg.bg;
                window.renderGrid = () => {
                    let h = `<h2 class="text-2xl font-bold text-cyan-400 mb-6">${g.t}</h2><div class="grid grid-cols-5 gap-1.5 w-[300px] mx-auto">`;
                    let tgIdx = Math.floor(Math.random()*25);
                    for(let i=0; i<25; i++) { h += `<button id="ft-${i}" class="text-4xl bg-slate-800 rounded-lg py-2 shadow-inner hover:bg-slate-700 aspect-square flex items-center justify-center transition active:scale-90">${(i === tgIdx) ? target : bg}</button>`; }
                    wrap.innerHTML = h + `</div>`;
                    for(let i=0; i<25; i++) { document.getElementById(`ft-${i}`).addEventListener('click', function() { if(i === tgIdx) { score+=20; document.getElementById('score-board').innerText='SCORE: '+score; window.renderGrid(); } else triggerGameOver(score); }); }
                }; window.renderGrid();
            }
            else if(g.e === 'order_click') {
                let cur = 0, arr = g.cfg.type==='alpha' ? 'ABCDEFGHIJKLMNOP'.split('') : Array.from({length:16}, (_,i)=>i+1), shf = [...arr].sort(()=>Math.random()-0.5);
                wrap.innerHTML = `<h2 class="text-2xl font-bold text-pink-400 mb-2">${g.t}</h2><p class="mb-6 text-slate-400">순서대로 누르세요!</p><div class="grid grid-cols-4 gap-2 w-[300px] mx-auto" id="oc-grid"></div>`;
                let grid = document.getElementById('oc-grid');
                shf.forEach((val) => { let btn = document.createElement('button'); btn.className = "text-2xl font-black bg-slate-800 rounded-xl aspect-square hover:bg-slate-700 flex items-center justify-center shadow-lg transition active:scale-95"; btn.innerText = val; btn.addEventListener('click', function() { if(val === arr[cur]) { this.classList.replace('bg-slate-800', 'bg-emerald-600'); this.classList.add('pointer-events-none'); cur++; score+=10; document.getElementById('score-board').innerText='SCORE: '+score; if(cur===arr.length) triggerSuccess('전부 맞췄습니다!', 50); } else triggerGameOver(score); }); grid.appendChild(btn); });
            }
            else if(g.e === 'stroop') {
                let cArr = ['red', 'blue', 'green', 'yellow'], nArr = ['빨강', '파랑', '초록', '노랑'], twc = ['text-red-500', 'text-blue-500', 'text-green-500', 'text-yellow-500'];
                window.rStroop = () => { let ci=Math.floor(Math.random()*4), ni=Math.floor(Math.random()*4); wrap.innerHTML = `<h2 class="text-2xl font-bold text-cyan-400 mb-4">실제 색상을 누르세요</h2><div class="text-7xl font-bold mb-8 ${twc[ci]}">${nArr[ni]}</div><div class="grid grid-cols-2 gap-3 w-[260px] mx-auto"><button id="st-0" class="p-4 bg-red-600 rounded-xl font-bold text-2xl">빨강</button><button id="st-1" class="p-4 bg-blue-600 rounded-xl font-bold text-2xl">파랑</button><button id="st-2" class="p-4 bg-green-600 rounded-xl font-bold text-2xl">초록</button><button id="st-3" class="p-4 bg-yellow-500 text-black rounded-xl font-bold text-2xl">노랑</button></div>`; [0,1,2,3].forEach(i => document.getElementById(`st-${i}`).addEventListener('click', () => { if(i===ci){ score+=20; document.getElementById('score-board').innerText='SCORE: '+score; window.rStroop(); } else triggerGameOver(score); })); }; window.rStroop();
            }
            else if(g.e === 'catch_dom') {
                wrap.innerHTML = `<h2 class="text-2xl font-bold text-emerald-400 mb-6">${g.t}</h2><div id="cd-area" class="relative w-[320px] aspect-square bg-slate-800 rounded-2xl overflow-hidden shadow-inner border-2 border-slate-700 mx-auto"></div>`;
                let area = document.getElementById('cd-area'), tg = document.createElement('button'); tg.className = "absolute text-6xl transform -translate-x-1/2 -translate-y-1/2 active:scale-75 transition duration-200"; tg.innerText = g.cfg.emo; area.appendChild(tg);
                let mv = () => { tg.style.left=(Math.random()*70+15)+'%'; tg.style.top=(Math.random()*70+15)+'%'; }; mv(); currentTimer = setInterval(mv, 750);
                tg.addEventListener('mousedown', () => { score+=20; document.getElementById('score-board').innerText='SCORE: '+score; if(score>=100) triggerSuccess('잡았습니다!', 50); else mv(); }); tg.addEventListener('touchstart', (e) => { e.preventDefault(); tg.dispatchEvent(new Event('mousedown')); }, {passive:false});
            }
            else if(g.e === 'tool') {
                const resList = g.cfg.type==='yeop' ? ['대길! 항상 응원합니다!', '수고 많았어요!', '조금 쉬어가는 것도 좋습니다.'] : ["🎉 당첨!", "🧹 청소 당번!", "🎁 숙제 면제!", "🍦 아이스크림!", "🎤 발표자!"];
                wrap.innerHTML = `<span class="text-8xl mb-8 drop-shadow-lg">${g.cfg.type.includes('dice')?'🎲':(g.cfg.type==='roulette'?'🎰':(g.cfg.type==='yeop'?'💌':'🪜'))}</span><h2 class="text-3xl font-bold text-emerald-400 mb-8">${g.t}</h2><button id="t-btn" class="px-10 py-5 bg-indigo-600 rounded-2xl font-bold text-2xl shadow-[0_6px_0_rgb(67,56,202)] active:translate-y-1 active:shadow-none transition">시작하기</button><div id="t-res" class="text-4xl font-black text-slate-500 mt-10 h-16">대기 중...</div>`;
                document.getElementById('t-btn').addEventListener('click', function() { this.disabled = true; this.innerText = "진행 중..."; let cnt=0, resElem = document.getElementById('t-res'), mx = setInterval(()=>{ if(g.cfg.type==='food') resElem.innerText = ['돈까스 🍛','스파게티 🍝','짜장면 🍜','비빔밥 🍲','햄버거 🍔'][Math.floor(Math.random()*5)]; else resElem.innerText = g.cfg.type.includes('dice') ? Math.floor(Math.random()*(g.cfg.type==='dice2'?12:6))+1 : resList[Math.floor(Math.random()*resList.length)]; cnt++; if(cnt>15) { clearInterval(mx); this.disabled=false; this.innerText="다시 하기"; resElem.className="text-4xl font-black text-yellow-400 animate-bounce mt-10 h-16 px-4 drop-shadow-md"; } },100); });
            }
            else if(g.e === 'tycoon' || g.e === 'clicker') {
                if(g.e === 'clicker') {
                    let clk = 0, time = 10; wrap.innerHTML = `<h2 class="text-3xl font-bold text-emerald-400 mb-2">광클 연타</h2><p id="clk-time" class="text-xl text-yellow-400 mb-6 font-bold bg-slate-800 px-6 py-2 rounded-full">남은 시간: 10초</p><p id="clk-txt" class="text-slate-300 mb-8 text-xl">0번 클릭!</p><button id="btn-clk" class="w-56 h-56 bg-red-600 rounded-full font-black text-5xl shadow-[0_10px_0_rgb(185,28,28)] active:translate-y-2 active:shadow-none transition select-none">터치!</button>`;
                    document.getElementById('btn-clk').addEventListener('click', () => { clk++; document.getElementById('clk-txt').innerText=clk+'번 클릭!'; }); document.getElementById('btn-clk').addEventListener('touchstart', (e) => { e.preventDefault(); document.getElementById('btn-clk').dispatchEvent(new Event('click')); }, {passive:false});
                    currentTimer = setInterval(()=>{ time--; document.getElementById('clk-time').innerText='남은 시간: '+time+'초'; if(time<=0) triggerSuccess(`${clk}번 연타했습니다!`, clk); },1000);
                } else {
                    let lvl=1, cst=50; wrap.innerHTML = `<h2 class="text-3xl font-bold text-cyan-400 mb-2">${g.t}</h2><p id="t-lvl" class="text-slate-400 mb-8 text-lg bg-slate-800 px-6 py-2 rounded-full">레벨: ${lvl} (터치당 +${lvl})</p><button id="btn-tc" class="text-[120px] mb-10 active:scale-90 transition transform bg-transparent drop-shadow-2xl select-none">${g.cfg.emo}</button><br><button id="up-btn" class="px-8 py-4 bg-emerald-600 rounded-2xl font-bold text-2xl opacity-50 pointer-events-none transition shadow-[0_6px_0_rgb(4,120,87)]">${g.cfg.txt} (비용: ${cst})</button>`;
                    const doClick = () => { score+=lvl; document.getElementById('score-board').innerText='SCORE: '+score; if(score>=cst) document.getElementById('up-btn').classList.remove('opacity-50','pointer-events-none'); };
                    document.getElementById('btn-tc').addEventListener('click', doClick); document.getElementById('btn-tc').addEventListener('touchstart', (e) => { e.preventDefault(); doClick(); }, {passive:false});
                    document.getElementById('up-btn').addEventListener('click', () => { if(score>=cst) { score-=cst; lvl++; cst=Math.floor(cst*1.5); document.getElementById('score-board').innerText='SCORE: '+score; document.getElementById('t-lvl').innerText=`레벨: ${lvl} (터치당 +${lvl})`; document.getElementById('up-btn').innerText=`${g.cfg.txt} (비용: ${cst})`; document.getElementById('up-btn').classList.add('opacity-50','pointer-events-none'); } });
                }
            }
            else if(g.e === 'quiz') {
                const getQ = () => {
                    let q="", a="", md=g.cfg.mode;
                    if(md==='mul'){ let x=Math.floor(Math.random()*8)+2, y=Math.floor(Math.random()*9)+1; q=`${x} x ${y} = ?`; a=(x*y).toString(); }
                    else if(md==='add'){ let x=Math.floor(Math.random()*50)+1, y=Math.floor(Math.random()*50)+1; q=`${x} + ${y} = ?`; a=(x+y).toString(); }
                    else if(md==='add_hard'){ let x=Math.floor(Math.random()*90)+10, y=Math.floor(Math.random()*90)+10; q=`${x} + ${y} = ?`; a=(x+y).toString(); }
                    else if(md==='div'){ let y=Math.floor(Math.random()*9)+1, x=y*(Math.floor(Math.random()*9)+1); q=`${x} ÷ ${y} = ?`; a=(x/y).toString(); }
                    else {
                        const db = { animal:[['호랑이','ㅎㄹㅇ'],['기린','ㄱㄹ'],['코끼리','ㅋㄲㄹ'],['돼지','ㄷㅈ']], fruit:[['수박','ㅅㅂ'],['사과','ㅅㄱ'],['포도','ㅍㄷ'],['바나나','ㅂㄴㄴ']], job:[['선생님','ㅅㅅㄴ'],['의사','ㅇㅅ'],['경찰관','ㄱㅊㄱ']], korean1:[['안돼','안되/안돼'],['설렘','설레임/설렘']], korean2:[['베개','베개/베게'],['금세','금새/금세']], capital:[['서울','한국'],['도쿄','일본'],['워싱턴','미국']], capital_asia:[['방콕','태국'],['하노이','베트남']], history:[['1592','임진왜란 연도'],['1446','훈민정음 반포']], proverb:[['오는','가는 말이 고와야 _ 말이 곱다'],['외양간','소 잃고 _ 고친다']], idiom:[['이','일석_조'],['익','다다_선']], nonsense:[['열바다','가장 뜨거운 바다?'],['킹콩','왕이 넘어지면?']], eng:[['사과','Apple'],['학교','School']], opposite:[['짧다','길다'],['작다','크다']], science:[['O','물은 100도에서 끓는다(O/X)'],['X','태양은 행성이다(O/X)']] };
                        let arr=db[md]||[['1','테스트']]; let r=arr[Math.floor(Math.random()*arr.length)];
                        if(['animal','fruit','job'].includes(md)){ q=`초성: ${r[1]}`; a=r[0]; } else{ q=r[1]; a=r[0]; }
                    } return {q, a};
                };
                let cur = getQ();
                wrap.innerHTML = `<h2 class="text-3xl font-bold text-yellow-400 mb-6">${g.t}</h2><p id="q-txt" class="text-4xl font-black text-white mb-10 drop-shadow-md px-4 leading-relaxed">${cur.q}</p><div class="flex gap-2 w-full max-w-[320px] mx-auto"><input id="q-ans" type="text" class="bg-slate-800 border-2 border-slate-600 px-4 py-3 rounded-xl text-center text-2xl font-bold w-full text-white shadow-inner focus:outline-none focus:border-cyan-400" placeholder="정답 입력" onkeydown="if(event.key==='Enter') document.getElementById('btn-quiz').click();"><button id="btn-quiz" class="bg-indigo-600 px-6 py-3 rounded-xl font-bold text-2xl shadow-[0_4px_0_rgb(67,56,202)] active:translate-y-1 active:shadow-none transition">제출</button></div>`;
                document.getElementById('btn-quiz').addEventListener('click', () => { if(document.getElementById('q-ans').value.trim() === cur.a) { score+=20; document.getElementById('score-board').innerText='SCORE: '+score; cur=getQ(); document.getElementById('q-txt').innerText=cur.q; document.getElementById('q-ans').value=''; } else triggerGameOver(score); });
            }
            else if(g.e === 'baseball') {
                let s=""; while(s.length<3){ let r=Math.floor(Math.random()*9)+1; if(!s.includes(r.toString())) s+=r; } let tr=0;
                wrap.innerHTML = `<h2 class="text-2xl font-bold text-yellow-400 mb-2">숫자 야구</h2><p class="text-sm text-slate-400 mb-6">서로 다른 3자리 숫자 (1~9)</p><div class="flex gap-2 w-[280px] mb-4 mx-auto"><input id="bb-in" type="number" class="bg-slate-800 border-2 border-slate-600 px-4 py-3 rounded-xl text-center text-2xl font-bold w-full text-white" onkeydown="if(event.key==='Enter') document.getElementById('btn-bb').click();"><button id="btn-bb" class="bg-indigo-600 px-6 py-3 rounded-xl font-bold text-xl">던지기</button></div><div id="bb-log" class="text-lg space-y-2 h-40 overflow-y-auto w-[280px] bg-slate-900 p-3 rounded-xl border border-slate-700 shadow-inner mx-auto"></div>`;
                document.getElementById('btn-bb').addEventListener('click', () => { let v = document.getElementById('bb-in').value; if(v.length!==3) return; tr++; if(v === s) { triggerSuccess(`🎉 ${tr}번 만에 홈런!`, 100); return; } let st=0, b=0; for(let i=0;i<3;i++){ if(v[i]===s[i]) st++; else if(s.includes(v[i])) b++; } document.getElementById('bb-log').innerHTML = `<p>${tr}차 [${v}] : <span class="text-yellow-400 font-bold">${st}S</span> <span class="text-cyan-400 font-bold">${b}B</span></p>` + document.getElementById('bb-log').innerHTML; document.getElementById('bb-in').value = ''; });
            }
            else if(g.e === 'updown') {
                let sec = Math.floor(Math.random()*100)+1, tr = 0;
                wrap.innerHTML = `<h2 class="text-2xl font-bold text-yellow-400 mb-2">업다운 게임</h2><p id="ud-msg" class="text-slate-300 mb-6 text-sm">1~100 숫자를 유추하세요.</p><div class="flex gap-2 w-[280px] mx-auto"><input id="ud-in" type="number" class="bg-slate-800 border-2 border-slate-600 px-4 py-3 rounded-xl text-center text-2xl font-bold w-full text-white" onkeydown="if(event.key==='Enter') document.getElementById('btn-ud').click();"><button id="btn-ud" class="bg-indigo-600 px-6 py-3 rounded-xl font-bold text-xl">확인</button></div>`;
                document.getElementById('btn-ud').addEventListener('click', () => { let val = parseInt(document.getElementById('ud-in').value); if(isNaN(val)) return; tr++; let m = document.getElementById('ud-msg'); if(val === sec) { triggerSuccess(`🎉 정답! ${tr}번 만에 맞췄습니다.`, Math.max(10, 100-tr*10)); } else if(val < sec) m.innerText = `📈 UP! (${val}보다 큽니다)`; else m.innerText = `📉 DOWN! (${val}보다 작습니다)`; document.getElementById('ud-in').value = ''; });
            }
        }

        window.onload = () => { initMenu(); loadMainScreen(); };
    </script>
</body>
</html>
