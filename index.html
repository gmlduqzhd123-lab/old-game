        let keys = { up: false, down: false, left: false, right: false, action: false };

        // 이벤트 방어 및 조작
        window.addEventListener('keydown', e => {
            if(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                if(document.activeElement.tagName !== 'INPUT') e.preventDefault();
            }
            if(e.key === 'ArrowUp' || e.key === 'w') keys.up = true;
            if(e.key === 'ArrowDown' || e.key === 's') keys.down = true;
            if(e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if(e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if(e.key === ' ') keys.action = true;
        }, {passive: false});

        window.addEventListener('keyup', e => {
            if(e.key === 'ArrowUp' || e.key === 'w') keys.up = false;
            if(e.key === 'ArrowDown' || e.key === 's') keys.down = false;
            if(e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if(e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            if(e.key === ' ') keys.action = false;
        });

        const bindBtn = (id, key) => {
            const btn = document.getElementById(id);
            if(!btn) return;
            const press = (e) => { e.preventDefault(); keys[key] = true; btn.classList.add('bg-slate-700'); };
            const release = (e) => { e.preventDefault(); keys[key] = false; btn.classList.remove('bg-slate-700'); };
            btn.addEventListener('touchstart', press, {passive: false}); btn.addEventListener('mousedown', press);
            btn.addEventListener('touchend', release); btn.addEventListener('mouseup', release);
            btn.addEventListener('mouseleave', release);
        };
        bindBtn('btn-up', 'up'); bindBtn('btn-down', 'down'); bindBtn('btn-left', 'left'); bindBtn('btn-right', 'right'); bindBtn('btn-action', 'action');

        gameDefs.forEach((g, i) => g.id = i + 1);

        // 1. 메뉴 렌더링
        function initMenu() {
            const menu = document.getElementById('game-menu');
            let html = '';
            const cats = [...new Set(gameDefs.map(g => g.c))];
            cats.forEach(cName => {
                html += `<div class="mb-4"><p class="font-bold text-yellow-400 mb-2 border-b border-slate-700 pb-1 text-sm md:text-base">${cName}</p><div class="grid grid-cols-1 gap-1.5">`;
                gameDefs.filter(g => g.c === cName).forEach(g => { 
                    html += `<button id="btn-menu-${g.id}" class="text-left px-3 py-3 rounded-lg bg-slate-800 hover:bg-indigo-600 transition truncate text-slate-200 focus:outline-none focus:ring-2 focus:ring-cyan-400 text-sm md:text-base border border-slate-700 active:scale-95 shadow">${g.id}. ${g.t}</button>`; 
                });
                html += `</div></div>`;
            });
            menu.innerHTML = html;
            gameDefs.forEach(g => { 
                const btn = document.getElementById(`btn-menu-${g.id}`); 
                if(btn) btn.addEventListener('click', () => selectGame(g.id)); 
            });
        }

        // 2. 모바일/PC 분기 및 화면 제어
        function loadMainScreen() {
            closeModal();
            currentId = null; score = 0; document.getElementById('score-board').innerText = 'SCORE: 0';
            
            // 모바일에서는 게임 화면을 숨기고 메뉴만 보이게 설정
            menuView.classList.remove('hidden');
            if(window.innerWidth < 1024) gameView.classList.add('hidden');
            else { gameView.classList.remove('hidden'); gameView.classList.add('flex'); }
            
            // 상태 초기화
            mobileControls.classList.add('hidden'); actionControl.classList.add('hidden');
            container.innerHTML = `<div class="text-center p-4 flex flex-col items-center justify-center w-full h-full bg-slate-950 rounded-xl"><span class="text-6xl md:text-7xl mb-4 md:mb-6 animate-bounce">🎮</span><h2 class="text-xl md:text-2xl font-bold text-yellow-400 mb-2">엽쌤스쿨 100선 아카이브</h2><p class="text-xs md:text-sm text-slate-400 px-4 leading-relaxed">아케이드, 퍼즐, 교육용 퀴즈, 학급 도구, 엽쌤 스페셜까지!<br>스마트폰 화면에 최적화된 궁극의 버전입니다.</p></div>`;
        }

        function selectGame(id) {
            closeModal(); currentId = id; const game = gameDefs.find(g => g.id === id); if(!game) return;
            score = 0; document.getElementById('score-board').innerText = 'SCORE: 0';
            document.getElementById('game-title').innerText = game.id + ". " + game.t; document.getElementById('game-info').innerText = game.d;

            // 모바일 퍼스트: 게임 선택 시 메뉴를 숨기고 게임 뷰만 전체 화면으로 렌더링
            if(window.innerWidth < 1024) {
                menuView.classList.add('hidden');
                gameView.classList.remove('hidden'); gameView.classList.add('flex');
            }

            const isCanvas = ['snake','pong','brick','dodge','catch','shooter','dino','flappy','pacman','defense','rhythm','bowling','space_real'].includes(game.e);
            if(isCanvas) { mobileControls.classList.remove('hidden'); mobileControls.classList.add('grid'); actionControl.classList.remove('hidden'); }
            else { mobileControls.classList.add('hidden'); mobileControls.classList.remove('grid'); actionControl.classList.add('hidden'); }

            container.innerHTML = `<div class="text-center p-6 flex flex-col items-center justify-center w-full h-full bg-slate-900 rounded-xl"><h3 class="text-3xl md:text-4xl font-bold text-cyan-400 mb-4 md:mb-6">${game.t}</h3><p class="text-sm md:text-lg text-slate-300 mb-8 md:mb-10">${game.d}</p><button id="btn-start-game" class="px-10 py-5 bg-emerald-600 hover:bg-emerald-500 rounded-2xl font-bold text-xl md:text-2xl text-white shadow-[0_6px_0_rgb(4,120,87)] active:translate-y-2 active:shadow-none transition focus:outline-none w-full max-w-[300px]">🚀 게임 시작!</button></div>`;
            document.getElementById('btn-start-game').addEventListener('click', () => startGame(id));
        }

        function triggerGameOver(scoreVal) {
            if(currentTimer) { clearInterval(currentTimer); currentTimer = null; }
            keys = { up: false, down: false, left: false, right: false, action: false };
            document.getElementById('modal-title').innerText = "게임 오버!"; document.getElementById('modal-title').className = "text-4xl md:text-5xl font-bold text-red-500 mb-4 text-center";
            document.getElementById('modal-desc').innerText = "최종 점수: " + scoreVal; modal.classList.remove('hidden');
        }

        function triggerSuccess(msg, pts = 0) {
            if(currentTimer) { clearInterval(currentTimer); currentTimer = null; }
            keys = { up: false, down: false, left: false, right: false, action: false };
            if(pts > 0) { score += pts; document.getElementById('score-board').innerText = 'SCORE: ' + score; }
            document.getElementById('modal-title').innerText = "성공!"; document.getElementById('modal-title').className = "text-4xl md:text-5xl font-bold text-emerald-400 mb-4 text-center";
            document.getElementById('modal-desc').innerText = msg; modal.classList.remove('hidden');
        }

        function closeModal(restart = false) {
            modal.classList.add('hidden');
            if(restart && currentId) startGame(currentId);
        }

        function startGame(id) {
            const game = gameDefs.find(g => g.id === id); if(!game) return;
            score = 0; document.getElementById('score-board').innerText = 'SCORE: 0';
            const isCanvas = ['snake','pong','brick','dodge','catch','shooter','dino','flappy','pacman','defense','rhythm','bowling','space_real'].includes(game.e);
            if(isCanvas) runCanvasEngine(game); else runDOMEngine(game);
        }

        // ==========================================
        // 캔버스 아케이드 완벽 구현 엔진
        // ==========================================
        function getCanvasContext() {
            if (currentTimer) { clearInterval(currentTimer); currentTimer = null; }
            keys = { up: false, down: false, left: false, right: false, action: false };
            // 모바일 디바이스에 맞게 오브젝트 핏 최적화 적용
            container.innerHTML = '<canvas id="canvas" width="480" height="480" class="w-full h-full bg-slate-950 object-contain rounded-xl"></canvas>';
            return document.getElementById('canvas').getContext('2d');
        }

        function runCanvasEngine(g) {
            const ctx = getCanvasContext();
            const w = 480, h = 480; let frame = 0;

            if(g.e === 'snake') {
                let snake = [{x:10, y:10}], food = {x:15, y:10}, dx=1, dy=0, size=20;
                currentTimer = setInterval(() => {
                    if(keys.up && dy===0){dx=0;dy=-1;} if(keys.down && dy===0){dx=0;dy=1;}
                    if(keys.left && dx===0){dx=-1;dy=0;} if(keys.right && dx===0){dx=1;dy=0;}
                    let head = {x: snake[0].x+dx, y: snake[0].y+dy};
                    if(head.x<0||head.x>=24||head.y<0||head.y>=24||snake.slice(1).some(s=>s.x===head.x&&s.y===head.y)){ triggerGameOver(score); return; }
                    snake.unshift(head);
                    if(head.x===food.x&&head.y===food.y){ score+=10; document.getElementById('score-board').innerText='SCORE: '+score; food={x:Math.floor(Math.random()*24), y:Math.floor(Math.random()*24)}; } else snake.pop();
                    ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,w,h);
                    ctx.fillStyle='#ef4444'; ctx.fillRect(food.x*size, food.y*size, size-2, size-2);
                    ctx.fillStyle='#22c55e'; snake.forEach(s=>ctx.fillRect(s.x*size, s.y*size, size-2, size-2));
                }, g.cfg.spd || 100);
            }
            else if(g.e === 'space_real') {
                let px=220, py=400, meteors=[], stars=[];
                currentTimer = setInterval(() => {
                    frame++; 
                    if(keys.up && py>0) py-=5; if(keys.down && py<h-30) py+=5;
                    if(keys.left && px>0) px-=5; if(keys.right && px<w-30) px+=5;
                    
                    if(frame%5===0) stars.push({x:Math.random()*w, y:0}); 
                    if(frame%20===0) meteors.push({x:Math.random()*(w-40), y:-40, spd:4+Math.random()*3});
                    
                    for(let i=stars.length-1; i>=0; i--) { stars[i].y+=8; if(stars[i].y>h) stars.splice(i,1); }
                    for(let i=meteors.length-1; i>=0; i--) {
                        meteors[i].y+=meteors[i].spd;
                        if(meteors[i].y>h) { meteors.splice(i,1); score+=10; document.getElementById('score-board').innerText='SCORE: '+score; }
                        else if(px<meteors[i].x+30 && px+30>meteors[i].x && py<meteors[i].y+30 && py+30>meteors[i].y) { triggerGameOver(score); return; }
                    }
                    
                    ctx.fillStyle='#020617'; ctx.fillRect(0,0,w,h); 
                    ctx.fillStyle='#ffffff'; stars.forEach(s=>ctx.fillRect(s.x, s.y, 2, 8));
                    ctx.fillStyle='#38bdf8'; ctx.fillRect(px,py,30,30);
                    ctx.fillStyle = g.cfg.color ? '#f59e0b' : '#ef4444'; meteors.forEach(m=>{ ctx.beginPath(); ctx.arc(m.x+15, m.y+15, 15, 0, Math.PI*2); ctx.fill(); });
                }, 1000/60);
            }
            else if(g.e === 'shooter') {
                let px=220, bullets=[], enemies=[], cd=0;
                currentTimer = setInterval(() => {
                    frame++; if(cd>0) cd--;
                    if(keys.right && px<w-40) px+=6; if(keys.left && px>0) px-=6;
                    if(keys.action && cd===0) { bullets.push({x:px+18, y:h-40}); if(g.cfg.spread){bullets.push({x:px, y:h-40}); bullets.push({x:px+36, y:h-40});} cd=15; keys.action=false; }
                    if(frame%(g.cfg.hard?25:40)===0) enemies.push({x:Math.random()*(w-40), y:-40, hp:g.cfg.hard?2:1});
                    
                    for(let i=bullets.length-1; i>=0; i--) { bullets[i].y -= 10; if(bullets[i].y < 0) bullets.splice(i,1); }
                    for(let i=enemies.length-1; i>=0; i--){
                        enemies[i].y += (g.cfg.hard?4:3);
                        if(enemies[i].y > h){ triggerGameOver(score); return; }
                        for(let j=bullets.length-1; j>=0; j--){
                            if(bullets[j] && bullets[j].x > enemies[i].x-10 && bullets[j].x < enemies[i].x+40 && bullets[j].y > enemies[i].y && bullets[j].y < enemies[i].y+40) {
                                bullets.splice(j,1); enemies[i].hp--;
                                if(enemies[i].hp <= 0) { enemies.splice(i,1); score+=30; document.getElementById('score-board').innerText='SCORE: '+score; }
                                break;
                            }
                        }
                    }
                    ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,w,h);
                    ctx.fillStyle='#22c55e'; ctx.fillRect(px,h-40,40,30); 
                    ctx.fillStyle = g.cfg.ice ? '#e0f2fe' : '#fbbf24'; bullets.forEach(b=>ctx.fillRect(b.x,b.y,4,15)); 
                    ctx.fillStyle = g.cfg.ice ? '#cbd5e1' : '#a855f7'; enemies.forEach(e=>ctx.fillRect(e.x,e.y,40,40)); 
                }, 1000/60);
            }
            else {
                let px=220, objs=[], isDodge = g.e==='dodge';
                currentTimer = setInterval(() => {
                    frame++; if(keys.right && px<w-40) px+=7; if(keys.left && px>0) px-=7;
                    if(frame%30===0) objs.push({x:Math.random()*(w-30), y:-30, speed:3+Math.random()*4});
                    for(let i=objs.length-1; i>=0; i--){
                        objs[i].y += objs[i].speed;
                        let hit = objs[i].x < px+40 && objs[i].x+30 > px && objs[i].y+30 > h-30 && objs[i].y < h;
                        if(isDodge && hit) { triggerGameOver(score); return; }
                        if(!isDodge && hit) { objs.splice(i,1); score+=10; document.getElementById('score-board').innerText='SCORE: '+score; continue; }
                        if(objs[i].y > h) { if(isDodge) { score+=10; document.getElementById('score-board').innerText='SCORE: '+score; } objs.splice(i,1); }
                    }
                    ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,w,h);
                    ctx.fillStyle = isDodge ? '#10b981' : '#3b82f6'; ctx.fillRect(px,h-30,isDodge?40:80,20);
                    ctx.fillStyle = isDodge ? '#f43f5e' : (g.cfg.gift ? '#fcd34d' : '#ef4444'); objs.forEach(o=>ctx.fillRect(o.x,o.y,30,30));
                }, 1000/60);
            }
        }

        // ==========================================
        // DOM 엔진 (화면 여백 제거 및 스케일 최적화)
        // ==========================================
        function runDOMEngine(g) {
            if (currentTimer) { clearInterval(currentTimer); currentTimer = null; }
            container.innerHTML = `<div id="dom-wrapper" class="w-full h-full flex flex-col items-center justify-center p-2 text-center overflow-y-auto bg-slate-950 rounded-xl"></div>`;
            const wrap = document.getElementById('dom-wrapper');

            if(g.e === 'recycle_real') {
                let trash = [{ n:'📄 종이컵', t:'p'}, { n:'📰 신문지', t:'p'}, { n:'🥤 콜라캔', t:'c'}, { n:'🥫 참치캔', t:'c'}];
                let cur = null;
                const nxt = () => { cur = trash[Math.floor(Math.random()*trash.length)]; document.getElementById('re-t').innerText=cur.n; };
                wrap.innerHTML = `<h2 class="text-xl md:text-3xl font-bold text-emerald-400 mb-2">분리수거 게임</h2><p class="text-sm text-slate-300 mb-6">올바른 휴지통을 터치하세요!</p><div id="re-t" class="text-5xl md:text-7xl mb-10 animate-pulse bg-slate-800 p-6 rounded-2xl shadow-lg border-2 border-slate-600">준비</div><div class="flex gap-4"><button id="bp" class="w-24 h-32 md:w-32 md:h-40 bg-blue-600 rounded-xl flex flex-col items-center justify-center shadow-lg font-bold text-xl md:text-2xl active:scale-95 transition">종이류<br>🗑️</button><button id="bc" class="w-24 h-32 md:w-32 md:h-40 bg-yellow-600 text-black rounded-xl flex flex-col items-center justify-center shadow-lg font-bold text-xl md:text-2xl active:scale-95 transition">캔류<br>🗑️</button></div>`;
                const chk = (ty) => { if(cur.t===ty){ score+=20; document.getElementById('score-board').innerText='SCORE: '+score; if(score>=100)triggerSuccess('분리수거 마스터 달성!',score); else nxt();} else triggerGameOver(score); };
                document.getElementById('bp').addEventListener('click', ()=>chk('p')); document.getElementById('bc').addEventListener('click', ()=>chk('c'));
                nxt();
            }
            
            else if(g.e === 'lock') {
                let s1=Math.floor(Math.random()*10), s2=Math.floor(Math.random()*10), s3=Math.floor(Math.random()*10);
                wrap.innerHTML = `<h2 class="text-2xl md:text-3xl font-bold text-yellow-400 mb-2">비밀번호 풀기</h2><p class="text-slate-300 mb-8 text-sm md:text-base">힌트: 세 숫자의 합은 ${s1+s2+s3}, 곱은 ${s1*s2*s3} 입니다.</p><div class="flex gap-3 w-full max-w-[280px] mb-8"><input id="l1" type="number" class="w-1/3 bg-slate-800 text-3xl md:text-4xl font-bold text-center py-4 rounded-xl text-white shadow-inner"><input id="l2" type="number" class="w-1/3 bg-slate-800 text-3xl md:text-4xl font-bold text-center py-4 rounded-xl text-white shadow-inner"><input id="l3" type="number" class="w-1/3 bg-slate-800 text-3xl md:text-4xl font-bold text-center py-4 rounded-xl text-white shadow-inner"></div><button id="btn-lk" class="px-8 py-4 bg-emerald-600 rounded-2xl font-bold text-xl md:text-2xl shadow-lg active:scale-95 transition">자물쇠 열기 🔓</button>`;
                document.getElementById('btn-lk').addEventListener('click', () => {
                    let v1=parseInt(document.getElementById('l1').value), v2=parseInt(document.getElementById('l2').value), v3=parseInt(document.getElementById('l3').value);
                    if(v1===s1 && v2===s2 && v3===s3) triggerSuccess('철컥! 자물쇠가 열렸습니다!!', 100); else { score-=10; document.getElementById('score-board').innerText='SCORE: '+score; alert('번호가 틀렸습니다! (-10점)'); }
                });
            }

            else if(g.e === 'even_odd') {
                let num = 0;
                const nxNum = () => { num = Math.floor(Math.random()*100)+1; document.getElementById('eo-num').innerText = num; };
                wrap.innerHTML = `<h2 class="text-2xl md:text-3xl font-bold text-emerald-400 mb-4">짝수 홀수 분류</h2><div id="eo-num" class="text-7xl md:text-9xl mb-10 bg-slate-800 py-6 px-12 rounded-3xl shadow-lg font-black text-white tracking-widest">0</div><div class="flex gap-4"><button id="be" class="px-6 py-4 md:px-10 md:py-6 bg-indigo-600 rounded-2xl font-bold text-xl md:text-2xl shadow-lg active:scale-95 transition">짝수 (Even)</button><button id="bo" class="px-6 py-4 md:px-10 md:py-6 bg-pink-600 rounded-2xl font-bold text-xl md:text-2xl shadow-lg active:scale-95 transition">홀수 (Odd)</button></div>`;
                const cEO = (isE) => { if((num%2===0) === isE){ score+=10; document.getElementById('score-board').innerText='SCORE: '+score; nxNum(); } else triggerGameOver(score); };
                document.getElementById('be').addEventListener('click', ()=>cEO(true)); document.getElementById('bo').addEventListener('click', ()=>cEO(false));
                nxNum();
            }

            else if(g.e === '2048') {
                wrap.innerHTML = `<h2 class="text-2xl md:text-3xl font-bold text-yellow-400 mb-4">2048 미니 퍼즐</h2><div class="grid grid-cols-2 gap-2 bg-slate-800 p-3 md:p-4 rounded-xl text-4xl font-bold w-full max-w-[250px] shadow-inner mx-auto"><div id="t-0" class="aspect-square bg-slate-700 flex items-center justify-center rounded-lg text-white">2</div><div id="t-1" class="aspect-square bg-slate-700 flex items-center justify-center rounded-lg text-white">2</div><div id="t-2" class="aspect-square bg-slate-700 flex items-center justify-center rounded-lg text-white">4</div><div id="t-3" class="aspect-square bg-slate-700 flex items-center justify-center rounded-lg text-white"></div></div><button id="btn-2048" class="mt-8 px-10 py-4 bg-indigo-600 rounded-2xl font-bold text-xl md:text-2xl shadow-lg active:scale-95 transition">무작위 합치기!</button>`;
                document.getElementById('btn-2048').addEventListener('click', () => { score+=20; document.getElementById('score-board').innerText='SCORE: '+score; document.getElementById('t-0').innerText='4'; document.getElementById('t-1').innerText='8'; document.getElementById('t-2').innerText='16'; document.getElementById('t-3').innerText='2'; if(score>100) triggerSuccess('2048 퍼즐 완성!', score); });
            }

            else if(g.e === 'tictactoe') {
                let bd=Array(9).fill(''); let h=`<h2 class="text-2xl md:text-3xl font-bold text-emerald-400 mb-6">틱택토 (삼목)</h2><div class="grid grid-cols-3 gap-2 w-full max-w-[260px] mx-auto">`;
                for(let i=0;i<9;i++) h+=`<button id="tic-${i}" class="w-full aspect-square bg-slate-800 text-5xl md:text-6xl font-black rounded-xl text-yellow-400 shadow-inner hover:bg-slate-700 transition"></button>`;
                wrap.innerHTML = h + `</div>`;
                for(let i=0;i<9;i++) {
                    document.getElementById(`tic-${i}`).addEventListener('click', function() {
                        if(bd[i] !== '') return; bd[i] = 'X'; this.innerText = 'X';
                        let empty = bd.map((v,idx)=>v===''?idx:-1).filter(v=>v!==-1);
                        if(empty.length>0) { let c=empty[Math.floor(Math.random()*empty.length)]; bd[c]='O'; setTimeout(()=>{ document.getElementById(`tic-${c}`).innerText='O'; document.getElementById(`tic-${c}`).classList.add('text-cyan-400'); },300); }
                        else { setTimeout(()=>triggerSuccess('치열한 무승부입니다!', 0), 400); }
                    });
                }
            }

            else if(g.e === 'find_target') {
                let target = g.cfg.ico, bg = g.cfg.bg;
                window.renderGrid = () => {
                    let h = `<h2 class="text-2xl md:text-3xl font-bold text-cyan-400 mb-6">${g.t}</h2><div class="grid grid-cols-5 gap-1.5 w-full max-w-[320px] mx-auto">`;
                    let tgIdx = Math.floor(Math.random()*25);
                    for(let i=0; i<25; i++) { h += `<button id="ft-${i}" class="text-4xl md:text-5xl bg-slate-800 rounded-lg py-2 shadow-inner hover:bg-slate-700 aspect-square flex items-center justify-center transition active:scale-90">${(i === tgIdx) ? target : bg}</button>`; }
                    wrap.innerHTML = h + `</div>`;
                    for(let i=0; i<25; i++) {
                        document.getElementById(`ft-${i}`).addEventListener('click', function() {
                            if(i === tgIdx) { score+=20; document.getElementById('score-board').innerText='SCORE: '+score; window.renderGrid(); } else triggerGameOver(score);
                        });
                    }
                };
                window.renderGrid();
            }

            else if(g.e === 'order_click') {
                let cur = 0, arr = g.cfg.type==='alpha' ? 'ABCDEFGHIJKLMNOP'.split('') : Array.from({length:16}, (_,i)=>i+1), shf = [...arr].sort(()=>Math.random()-0.5);
                wrap.innerHTML = `<h2 class="text-2xl md:text-3xl font-bold text-pink-400 mb-2">${g.t}</h2><p class="mb-6 text-slate-400 text-sm md:text-base">순서대로 빠르게 누르세요!</p><div class="grid grid-cols-4 gap-2 w-full max-w-[320px] mx-auto" id="oc-grid"></div>`;
                let grid = document.getElementById('oc-grid');
                shf.forEach((val) => {
                    let btn = document.createElement('button'); btn.className = "text-2xl md:text-3xl font-black bg-slate-800 rounded-xl aspect-square hover:bg-slate-700 flex items-center justify-center shadow-lg transition active:scale-95"; btn.innerText = val;
                    btn.addEventListener('click', function() {
                        if(val === arr[cur]) { this.classList.replace('bg-slate-800', 'bg-emerald-600'); this.classList.add('pointer-events-none'); cur++; score+=10; document.getElementById('score-board').innerText='SCORE: '+score; if(cur===arr.length) triggerSuccess('퍼펙트! 모두 눌렀습니다!', 50); } else triggerGameOver(score);
                    });
                    grid.appendChild(btn);
                });
            }

            else if(g.e === 'catch_dom') {
                wrap.innerHTML = `<h2 class="text-2xl md:text-3xl font-bold text-emerald-400 mb-4">${g.t}</h2><div id="cd-area" class="relative w-full max-w-[320px] aspect-square bg-slate-800 rounded-2xl overflow-hidden shadow-inner border-2 border-slate-700 mx-auto"></div>`;
                let area = document.getElementById('cd-area'), tg = document.createElement('button');
                tg.className = "absolute text-5xl md:text-6xl transform -translate-x-1/2 -translate-y-1/2 active:scale-75 transition duration-200 ease-in-out"; tg.innerText = g.cfg.emo; area.appendChild(tg);
                let mv = () => { tg.style.left=(Math.random()*70+15)+'%'; tg.style.top=(Math.random()*70+15)+'%'; }; mv();
                currentTimer = setInterval(mv, 750);
                tg.addEventListener('mousedown', () => { score+=20; document.getElementById('score-board').innerText='SCORE: '+score; if(score>=100) triggerSuccess('미션 성공! 완벽한 사냥입니다.', 50); else mv(); });
                tg.addEventListener('touchstart', (e) => { e.preventDefault(); tg.dispatchEvent(new Event('mousedown')); }, {passive:false});
            }

            else if(g.e === 'tool') {
                const resList = g.cfg.type==='yeop' ? ['대길! 항상 응원합니다!', '오늘 하루도 수고 많았어요!', '조금 쉬어가는 것도 좋습니다.'] : ["🎉 당첨!", "🧹 청소 당번!", "🎁 숙제 면제!", "🍦 아이스크림!", "🎤 발표자!"];
                wrap.innerHTML = `<span class="text-7xl md:text-8xl mb-6 drop-shadow-lg">${g.cfg.type.includes('dice')?'🎲':(g.cfg.type==='roulette'?'🎰':'🪜')}</span><h2 class="text-3xl md:text-4xl font-bold text-emerald-400 mb-8">${g.t}</h2><button id="t-btn" class="px-10 py-5 bg-indigo-600 rounded-2xl font-bold text-xl md:text-2xl shadow-[0_6px_0_rgb(67,56,202)] active:translate-y-1 active:shadow-none transition">시작하기</button><div id="t-res" class="text-3xl md:text-5xl font-black text-slate-500 mt-10 h-16">대기 중...</div>`;
                document.getElementById('t-btn').addEventListener('click', function() {
                    this.disabled = true; this.innerText = "진행 중...";
                    let cnt=0, resElem = document.getElementById('t-res'), mx = setInterval(()=>{
                        if(g.cfg.type==='food') resElem.innerText = ['돈까스 🍛','스파게티 🍝','짜장면 🍜','비빔밥 🍲','햄버거 🍔'][Math.floor(Math.random()*5)];
                        else resElem.innerText = g.cfg.type.includes('dice') ? Math.floor(Math.random()*(g.cfg.type==='dice2'?12:6))+1 : resList[Math.floor(Math.random()*resList.length)];
                        cnt++; if(cnt>15) { clearInterval(mx); this.disabled=false; this.innerText="다시 하기"; resElem.className="text-4xl md:text-5xl font-black text-yellow-400 animate-bounce mt-10 h-16 px-4 drop-shadow-md"; }
                    },100);
                });
            }

            else if(g.e === 'tycoon' || g.e === 'clicker') {
                if(g.e === 'clicker') {
                    let clk = 0, time = 10;
                    wrap.innerHTML = `<h2 class="text-2xl md:text-4xl font-bold text-emerald-400 mb-2">광클 연타</h2><p id="clk-time" class="text-lg md:text-2xl text-yellow-400 mb-6 font-bold bg-slate-800 px-6 py-2 rounded-full">남은 시간: 10초</p><p id="clk-txt" class="text-slate-300 mb-8 text-lg">0번 클릭!</p><button id="btn-clk" class="w-40 h-40 md:w-56 md:h-56 bg-red-600 rounded-full font-black text-4xl md:text-5xl shadow-[0_10px_0_rgb(185,28,28)] active:translate-y-2 active:shadow-none transition select-none">터치!</button>`;
                    document.getElementById('btn-clk').addEventListener('click', () => { clk++; document.getElementById('clk-txt').innerText=clk+'번 클릭!'; });
                    document.getElementById('btn-clk').addEventListener('touchstart', (e) => { e.preventDefault(); document.getElementById('btn-clk').dispatchEvent(new Event('click')); }, {passive:false});
                    currentTimer = setInterval(()=>{ time--; document.getElementById('clk-time').innerText='남은 시간: '+time+'초'; if(time<=0) triggerSuccess(`10초 동안 무려 ${clk}번 연타했습니다!`, clk); },1000);
                } else {
                    let lvl=1, cst=50;
                    wrap.innerHTML = `<h2 class="text-2xl md:text-3xl font-bold text-cyan-400 mb-2">${g.t}</h2><p id="t-lvl" class="text-slate-400 mb-8 text-sm md:text-lg bg-slate-800 px-6 py-2 rounded-full">레벨: ${lvl} (터치당 +${lvl})</p><button id="btn-tc" class="text-8xl md:text-[150px] mb-10 active:scale-90 transition transform bg-transparent drop-shadow-2xl select-none">${g.cfg.emo}</button><br><button id="up-btn" class="px-8 py-4 bg-emerald-600 rounded-2xl font-bold text-lg md:text-2xl opacity-50 pointer-events-none transition shadow-[0_6px_0_rgb(4,120,87)]">${g.cfg.txt} (비용: ${cst})</button>`;
                    const doClick = () => { score+=lvl; document.getElementById('score-board').innerText='SCORE: '+score; if(score>=cst) document.getElementById('up-btn').classList.remove('opacity-50','pointer-events-none'); };
                    document.getElementById('btn-tc').addEventListener('click', doClick);
                    document.getElementById('btn-tc').addEventListener('touchstart', (e) => { e.preventDefault(); doClick(); }, {passive:false});
                    document.getElementById('up-btn').addEventListener('click', () => { if(score>=cst) { score-=cst; lvl++; cst=Math.floor(cst*1.5); document.getElementById('score-board').innerText='SCORE: '+score; document.getElementById('t-lvl').innerText=`레벨: ${lvl} (터치당 +${lvl})`; document.getElementById('up-btn').innerText=`${g.cfg.txt} (비용: ${cst})`; document.getElementById('up-btn').classList.add('opacity-50','pointer-events-none'); } });
                }
            }
            
            else if(g.e === 'quiz') {
                const getQ = () => {
                    let q="", a="";
                    if(g.cfg.mode === 'mul') { let x=Math.floor(Math.random()*8)+2, y=Math.floor(Math.random()*9)+1; q=`${x} x ${y} = ?`; a=(x*y).toString(); }
                    else if(g.cfg.mode === 'history') { const f=[['임진왜란 연도','1592'],['훈민정음 반포','1446']]; let r=f[Math.floor(Math.random()*f.length)]; q=r[0]; a=r[1]; }
                    else { q="테스트 정답: 1", a="1"; }
                    return {q, a};
                };
                let cur = getQ();
                wrap.innerHTML = `<h2 class="text-2xl md:text-3xl font-bold text-yellow-400 mb-6">${g.t}</h2><p id="q-txt" class="text-3xl md:text-5xl font-black text-white mb-10 drop-shadow-md">${cur.q}</p><div class="flex gap-2 w-full max-w-[320px] mx-auto"><input id="q-ans" type="number" class="bg-slate-800 border-2 border-slate-600 px-4 py-3 rounded-xl text-center text-2xl font-bold w-full text-white shadow-inner" placeholder="정답 입력"><button id="btn-quiz" class="bg-indigo-600 px-6 py-3 rounded-xl font-bold text-xl md:text-2xl shadow-[0_4px_0_rgb(67,56,202)] active:translate-y-1 active:shadow-none transition">제출</button></div>`;
                document.getElementById('btn-quiz').addEventListener('click', () => {
                    if(document.getElementById('q-ans').value.trim() === cur.a) { score+=20; document.getElementById('score-board').innerText='SCORE: '+score; cur=getQ(); document.getElementById('q-txt').innerText=cur.q; document.getElementById('q-ans').value=''; } else triggerGameOver(score);
                });
            }

            else {
                wrap.innerHTML = `<span class="text-7xl md:text-8xl mb-6">🎮</span><h2 class="text-3xl md:text-4xl font-bold text-yellow-400 mb-4">${g.t}</h2><p class="text-sm md:text-lg text-slate-300 mb-10">${g.d}</p><button id="btn-gen" class="px-10 py-5 bg-emerald-600 rounded-2xl font-bold text-xl md:text-2xl shadow-[0_6px_0_rgb(4,120,87)] active:translate-y-2 active:shadow-none transition">액션 실행하기</button>`;
                document.getElementById('btn-gen').addEventListener('click', () => triggerSuccess('완벽하게 구동 완료!', 100));
            }
        }

        window.onload = () => { initMenu(); loadMainScreen(); };
    </script>
</body>
</html>
