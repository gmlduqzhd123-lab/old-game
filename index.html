        html .bg-indigo-500, html .bg-indigo-600, html .bg-indigo-700, html .bg-emerald-500, html .bg-emerald-600, html .bg-emerald-700,

        /* 눌리는 입체 버튼 */
        .btn3d { box-shadow: 0 5px 0 rgba(46,42,66,.18); transition: transform .08s, box-shadow .08s, filter .15s; }
        .btn3d:hover { filter: brightness(1.05); }
        .btn3d:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(46,42,66,.18); }

        /* 상단 바 */
        .icon-btn { width: 42px; height: 42px; border-radius: 14px; background: #fff; border: 2px solid var(--line); display: inline-flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 3px 0 #e6ddfb; flex-shrink: 0; }

        /* 홈: 분류 탭과 게임 카드 */

        .game-card { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 8px 12px; background: #fff; border: 2px solid var(--line); border-radius: 22px; box-shadow: 0 5px 0 var(--soft2); text-align: center; transition: transform .1s; min-width: 0; }

        .mini-card .card-icon { width: 38px; height: 38px; font-size: 22px; border-radius: 12px; }

        /* 게임 화면 */
        #game-container { position: relative; width: 100%; height: 100%; border-radius: 26px; overflow: hidden; background: #fff; border: 3px solid var(--soft2, var(--line)); box-shadow: 0 6px 0 var(--soft2, var(--line)); display: flex; align-items: center; justify-content: center; }

            #dom-wrapper > :first-child { margin-top: auto; }

        .stat-chip { background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 4px 12px; }
        .hud-chip { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 4px 14px; font-size: 17px; box-shadow: 0 3px 0 #efe8fc; }

        /* 조작 버튼 */
        .pad-btn { width: 56px; height: 56px; border-radius: 18px; background: #fff; border: 2px solid var(--line); box-shadow: 0 4px 0 var(--soft2, #e6ddfb); font-size: 24px; display: flex; align-items: center; justify-content: center; color: var(--ink2, #6a5ae0); }
        .pad-btn.pressed, .pad-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--soft2, #e6ddfb); background: var(--soft, #f4f0ff); }
        .act-btn { min-width: 96px; height: 96px; border-radius: 999px; background: var(--c, var(--accent)); color: #fff; font-size: 17px; line-height: 1.15; padding: 0 12px; box-shadow: 0 6px 0 rgba(46,42,66,.22); word-break: keep-all; }
        .act-btn.pressed, .act-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(46,42,66,.22); }
        @media (min-width: 1024px) { .pad-btn { width: 50px; height: 50px; } .act-btn { min-width: 84px; height: 84px; } }

        /* 결과창 / 설정창 */
        .overlay { position: absolute; inset: 0; background: rgba(255,247,238,.82); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
        .panel { background: #fff; border: 3px solid var(--line); border-radius: 28px; box-shadow: 0 8px 0 #e6ddfb, 0 20px 40px rgba(46,42,66,.12); padding: 24px 20px; width: 100%; max-width: 380px; text-align: center; }

        @keyframes starPop { 0% { transform: scale(0) rotate(-40deg); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }
        .confetti { position: fixed; top: -12px; width: 10px; height: 14px; border-radius: 3px; z-index: 90; pointer-events: none; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(105vh) rotate(720deg); } }
        input[type=range] { accent-color: var(--accent); }

        /* 공용 애니메이션 */
        @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }

        @keyframes pop { 0%{transform:scale(.4);opacity:0} 70%{transform:scale(1.12);opacity:1} 100%{transform:scale(1)} }

        @keyframes floatUp { 0%{transform:translate(-50%,0);opacity:1} 100%{transform:translate(-50%,-50px);opacity:0} }
        .float-txt { position:absolute; pointer-events:none; font-weight:bold; animation: floatUp .8s ease-out forwards; white-space:nowrap; z-index:30; text-shadow:0 2px 0 #fff, 0 0 6px #fff; }
        @keyframes wobble { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-12deg)} 75%{transform:rotate(12deg)} }
        .wobble { animation: wobble .4s infinite; }
        @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
        .bob { animation: bob 2s ease-in-out infinite; }
        .flip-card { perspective: 600px; }
        .flip-inner { position:relative; width:100%; height:100%; transition: transform .35s; transform-style: preserve-3d; }

        .hidden { display: none !important; }
        @media (max-width: 400px) { #btn-full { display: none !important; } }

    <!-- 설정 -->

            <label class="block mb-4"><span class="flex justify-between mb-1"><span>🔊 효과음 크기</span><b id="vol-txt">70</b></span><input id="vol" type="range" min="0" max="100" step="5" class="w-full"></label>
            <label class="flex items-center justify-between mb-4 cursor-pointer"><span>🔠 글자 크게 보기</span><input id="bigtext" type="checkbox" class="w-6 h-6 accent-[#8b7cf6]"></label>
            <button id="set-full" class="btn3d w-full py-3 mb-3 rounded-2xl bg-indigo-500 text-lg">⛶ 전체 화면 켜기/끄기</button>
            <button id="set-close" class="btn3d w-full py-3 rounded-2xl bg-white border-2 border-[#ece5fb] text-lg">닫기</button>
            <p class="text-xs text-[#a9a3c2] mt-3 text-center">TV·전자칠판에 띄울 때는 전체 화면을 추천해요.</p>
        </div>
    </div>

    <script>
        // ==========================================
        // 0. 공용 유틸리티
        // ==========================================
        const $ = id => document.getElementById(id);
        const container = $('game-container');
        const modal = $('game-modal');
        const padRow = $('pad-row');
        const mobileControls = $('mobile-controls');
        const actionControl = $('btn-action');
        const homeView = $('home-view');
        const gameView = $('game-view');

        const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;          // a~b 정수
        const pick = arr => arr[Math.floor(Math.random() * arr.length)];
        const shuffle = arr => { const a = [...arr]; for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const hearts = (n, max) => '❤️'.repeat(Math.max(0, n)) + (max ? '🤍'.repeat(Math.max(0, max - n)) : '');

        // 기록 저장 (브라우저 저장소가 막혀 있어도 게임은 정상 동작)
        const store = {
            get(k, d){ try { const v = localStorage.getItem('yeop100:' + k); return v === null ? d : JSON.parse(v); } catch(e) { return d; } },
            set(k, v){ try { localStorage.setItem('yeop100:' + k, JSON.stringify(v)); } catch(e) {} }
        };

        // ==========================================
        // 1. 효과음 (Web Audio, 파일 불필요)
        // ==========================================
        let actx = null, soundOn = store.get('sound', true), soundVol = store.get('vol', 70) / 100;
        function audio(){ try { if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if(actx.state === 'suspended') actx.resume(); return actx; } catch(e) { return null; } }
        function tone(freq, dur = 0.1, type = 'square', vol = 0.05, when = 0){
            if(!soundOn || soundVol <= 0) return; const ac = audio(); if(!ac) return;
            vol *= soundVol * 1.4;
            try {
                const t = ac.currentTime + when, o = ac.createOscillator(), gn = ac.createGain();
                o.type = type; o.frequency.setValueAtTime(freq, t);
                gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                o.connect(gn); gn.connect(ac.destination); o.start(t); o.stop(t + dur + 0.05);
            } catch(e) {}
        }
        const sfx = {
            tick: () => tone(1200, .03, 'square', .02),
            hit:  () => tone(660, .06, 'square', .04),
            pop:  () => tone(880, .07, 'triangle', .08),
            good: () => { tone(523, .08, 'sine', .08); tone(784, .14, 'sine', .08, .08); },
            coin: () => { tone(988, .06, 'square', .035); tone(1319, .16, 'square', .035, .06); },
            bad:  () => tone(140, .25, 'sawtooth', .06),
            boom: () => { tone(90, .35, 'sawtooth', .08); tone(60, .4, 'square', .05, .05); },
            jump: () => { tone(400, .08, 'square', .03); tone(600, .08, 'square', .03, .05); },
            over: () => { tone(392, .16, 'sawtooth', .05); tone(330, .16, 'sawtooth', .05, .16); tone(262, .35, 'sawtooth', .05, .32); },
            win:  () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, .18, 'square', .045, i * .1)); },
        };
        const noteFreq = midi => 440 * Math.pow(2, (midi - 69) / 12);

        function refreshSoundBtn(){ $('btn-sound').textContent = soundOn && soundVol > 0 ? '🔊' : '🔇'; }
        $('btn-sound').addEventListener('click', () => { soundOn = !soundOn; if(soundOn && soundVol <= 0){ soundVol = .7; store.set('vol', 70); } store.set('sound', soundOn); refreshSoundBtn(); if(soundOn) sfx.coin(); });
        refreshSoundBtn();

        // ==========================================
        // 1-1. 설정 (효과음 크기, 글자 크게, 전체 화면)
        // ==========================================
        const canFull = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
        function toggleFull(){
            try {
                if(document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                else { const el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen).call(el); }
            } catch(e) {}
        }
        function applyBigText(on){ document.documentElement.classList.toggle('big-text', on); }
        applyBigText(store.get('bigtext', false));
        $('btn-full').classList.toggle('hidden', !canFull); $('set-full').classList.toggle('hidden', !canFull);
        $('btn-full').addEventListener('click', toggleFull); $('set-full').addEventListener('click', toggleFull);
        $('btn-settings').addEventListener('click', () => {
            $('vol').value = Math.round(soundVol * 100); $('vol-txt').textContent = Math.round(soundVol * 100);
            $('bigtext').checked = document.documentElement.classList.contains('big-text');
            $('settings').classList.remove('hidden');
        });
        $('set-close').addEventListener('click', () => $('settings').classList.add('hidden'));
        $('settings').addEventListener('click', e => { if(e.target.id === 'settings') $('settings').classList.add('hidden'); });
        $('vol').addEventListener('input', e => { soundVol = +e.target.value / 100; $('vol-txt').textContent = e.target.value; store.set('vol', +e.target.value); soundOn = soundVol > 0; store.set('sound', soundOn); refreshSoundBtn(); });
        $('vol').addEventListener('change', () => sfx.coin());
        $('bigtext').addEventListener('change', e => { applyBigText(e.target.checked); store.set('bigtext', e.target.checked); });

        // ==========================================
        // 2. 게임 실행 수명주기 (타이머/이벤트 누수 방지)
        // ==========================================
        let G = null;                 // 현재 실행 중인 게임 런타임
        let score = 0, currentId = null;

        function halt(){
            if(!G) return;
            G.alive = false;
            G.iv.forEach(clearInterval); G.iv = [];
            G.to.forEach(clearTimeout); G.to = [];
            if(G.raf) cancelAnimationFrame(G.raf); G.raf = 0;
        }
        function stopGame(){
            if(!G) return;
            halt();
            G.ls.forEach(([t, e, f, o]) => t.removeEventListener(e, f, o));
            G.cleanup.forEach(f => { try { f(); } catch(e) {} });
            G = null; resetKeys(); stopRepeat();
        }
        function newRuntime(game){
            stopGame();
            G = { game, alive: true, over: false, iv: [], to: [], ls: [], cleanup: [], raf: 0, onPress: null };
            return G;
        }
        function every(fn, ms){ const g = G; const id = setInterval(() => { if(g.alive) fn(); }, ms); g.iv.push(id); return id; }
        function after(fn, ms){ const g = G; const id = setTimeout(() => { if(g.alive) fn(); }, ms); g.to.push(id); return id; }
        function listen(t, e, f, o){ t.addEventListener(e, f, o); G.ls.push([t, e, f, o]); }
        const wait = ms => new Promise(res => after(res, ms));

        // 고정 60fps 게임 루프 (고주사율 모니터에서도 같은 속도)
        function loop(step, draw){
            const g = G, STEP = 1000 / 60; let last = performance.now(), acc = 0;
            const frame = now => {
                if(!g.alive) return;
                acc += Math.min(100, now - last); last = now;
                while(acc >= STEP){ step(); acc -= STEP; if(!g.alive) break; }
                draw();
                if(g.alive) g.raf = requestAnimationFrame(frame);
            };
            g.raf = requestAnimationFrame(frame);
        }

        // ==========================================
        // 3. 점수 / 최고 기록 / 결과 모달

        // ==========================================
        // 7. 홈(카드 목록) / 게임 화면 전환
        // ==========================================
        // 분류별 파스텔 색: c(진한 색), soft(연한 배경), soft2(테두리/그림자), ink(글자)
        const CATS = {
            '아케이드':   { icon: '🕹️', c: '#9b87f5', soft: '#efe9ff', soft2: '#ddd3fd', ink: '#6d4fe0' },
            '두뇌/퍼즐':  { icon: '🧩', c: '#60a5fa', soft: '#e6f2ff', soft2: '#cfe3fb', ink: '#2f7de0' },
            '학습 퀴즈':  { icon: '📚', c: '#34c38f', soft: '#e3f8ee', soft2: '#c8eedb', ink: '#139669' },
            '학급 도구':  { icon: '🧰', c: '#fb9a4b', soft: '#fff1df', soft2: '#fddcb8', ink: '#d9791a' },
            '엽쌤 스페셜': { icon: '💖', c: '#f472a8', soft: '#ffe7f1', soft2: '#fbcfe1', ink: '#d63d7c' },
        };
        const catVars = c => { const k = CATS[c]; return `--c:${k.c};--soft:${k.soft};--soft2:${k.soft2};--ink2:${k.ink}`; };
        const ctlHelp = { dpad: '방향키(WASD) 또는 화면의 방향 버튼', both: '방향키 + 스페이스바 또는 화면 버튼', action: '스페이스바 또는 ACTION 버튼 · 화면 터치', none: '마우스 클릭 또는 화면 터치' };
        let curCat = store.get('cat', '전체');

        function cardHTML(g){
            const b = store.get('best:' + g.id, null), eng = E[g.e];
            const badge = (b !== null && eng && !eng.noScore) ? `<span class="card-best">🏆${b.toLocaleString()}</span>` : '';
            return `<button data-id="${g.id}" class="game-card menu-btn" style="${catVars(g.c)}"><span class="card-num">${g.id}</span>${badge}<span class="card-icon">${g.i}</span><span class="card-title">${esc(g.t)}</span></button>`;
        }
        function initMenu(){
            const q = $('menu-search').value.trim().toLowerCase();
            // 분류 탭
            const tabs = ['전체', ...Object.keys(CATS)];
            $('cat-tabs').innerHTML = tabs.map(t => { const k = CATS[t]; return `<button data-cat="${t}" class="cat-tab ${t === curCat ? 'on' : ''}" style="${k ? `--c:${k.c}` : ''}">${k ? k.icon + ' ' : '✨ '}${t} <span class="opacity-70 text-xs">${t === '전체' ? 100 : gameDefs.filter(g => g.c === t).length}</span></button>`; }).join('');
            // 최근 게임 + 오늘의 추천 (검색 중이 아닐 때만)
            let extra = '';
            if(!q){
                const recent = store.get('recent', []).map(id => gameDefs.find(g => g.id === id)).filter(Boolean);
                const d = new Date(), seed = d.getFullYear() * 400 + (d.getMonth() + 1) * 32 + d.getDate();
                const today = gameDefs[(seed * 7919) % gameDefs.length];
                extra += `<button data-id="${today.id}" class="menu-btn w-full flex items-center gap-4 p-4 mb-4 rounded-3xl border-2 text-left" style="${catVars(today.c)};background:linear-gradient(120deg,var(--soft),#fff);border-color:var(--soft2);box-shadow:0 5px 0 var(--soft2)"><span class="card-icon bob shrink-0" style="background:#fff">${today.i}</span><span class="min-w-0"><span class="block text-sm" style="color:var(--ink2)">⭐ 오늘의 추천 게임</span><span class="block text-xl md:text-2xl break-keep">${today.id}. ${esc(today.t)}</span><span class="block text-sm text-[#7c7597] break-keep">${esc(today.d)}</span></span><span class="ml-auto shrink-0 text-2xl hidden sm:block">▶</span></button>`;
                if(recent.length) extra += `<p class="text-sm text-[#7c7597] mb-2 px-1">🕘 최근에 한 게임</p><div class="flex gap-2 overflow-x-auto pb-3 mb-2 -mx-3 px-3 md:mx-0 md:px-0">${recent.map(g => `<button data-id="${g.id}" class="menu-btn mini-card" style="${catVars(g.c)}"><span class="card-icon">${g.i}</span><span class="text-sm">${esc(g.t)}</span></button>`).join('')}</div>`;
            }
            $('home-extra').innerHTML = extra;
            // 게임 카드
            const list = gameDefs.filter(g => (curCat === '전체' || q || g.c === curCat) && (!q || g.t.toLowerCase().includes(q) || g.d.toLowerCase().includes(q)));
            $('game-menu').innerHTML = list.map(cardHTML).join('') || '<p class="col-span-full text-center text-[#7c7597] p-8">검색 결과가 없어요 🥲</p>';
        }
        document.addEventListener('click', e => {
            const b = e.target.closest('.menu-btn'); if(b){ selectGame(+b.dataset.id); return; }
            const t = e.target.closest('[data-cat]'); if(t){ curCat = t.dataset.cat; store.set('cat', curCat); initMenu(); $('home-view').scrollTo({ top: 0 }); }
        });
        $('menu-search').addEventListener('input', initMenu);

        function showView(mode){
            const home = mode === 'home';
            homeView.classList.toggle('hidden', !home);
            gameView.classList.toggle('hidden', home); gameView.classList.toggle('flex', !home);
            $('hdr-home').classList.toggle('hidden', !home); $('hdr-home').classList.toggle('flex', home);
            $('hdr-game').classList.toggle('hidden', home); $('hdr-game').classList.toggle('flex', !home);
        }
        function applyTheme(game){
            const k = CATS[game.c];
            [gameView, $('hdr-game')].forEach(el => el.setAttribute('style', catVars(game.c) + (el === gameView ? ';padding-bottom:max(8px, env(safe-area-inset-bottom))' : '')));
            $('game-cat').innerHTML = `<span style="color:${k.ink}">${k.icon} ${game.c}</span>`;
            $('game-title').textContent = `${game.id}. ${game.t}`;
        }

        function loadMainScreen(){
            closeModal(); stopGame();
            currentId = null; setScore(0);
            showView('home'); setControls('none'); container.innerHTML = '';
            initMenu();
        }

        function selectGame(id){
            closeModal(); stopGame();
            const game = gameDefs.find(g => g.id === id); if(!game) return;
            currentId = id; const eng = E[game.e], k = CATS[game.c];
            setScore(0); showBest(); applyTheme(game); showView('game');
            setControls('none'); container.classList.remove('canvas-mode');
            $('hud').classList.toggle('invisible', !!eng.noScore);
            const best = store.get('best:' + id, null);
            const row = (ic, label, v) => `<div class="flex gap-3 items-start text-left bg-white rounded-2xl border-2 px-4 py-3" style="border-color:${k.soft2}"><span class="text-2xl leading-none">${ic}</span><span class="min-w-0"><span class="block text-xs" style="color:${k.ink}">${label}</span><span class="block text-base break-keep">${v}</span></span></div>`;
            container.innerHTML = `<div id="dom-wrapper" class="w-full h-full flex flex-col items-center p-4 md:p-6 text-center overflow-y-auto"><div class="card-icon bob mb-3" style="width:96px;height:96px;font-size:56px;border-radius:30px">${game.i}</div><h3 class="text-2xl md:text-3xl mb-4 break-keep" style="color:${k.ink}">${esc(game.t)}</h3><div class="w-full max-w-[380px] flex flex-col gap-2 mb-5">${row('🎯', eng.noScore ? '이렇게 써요' : '목표', esc(game.d))}${row('🎮', '조작 방법', ctlHelp[eng.ctl || 'none'])}${eng.noScore ? '' : row('🏆', '나의 최고 기록', best !== null ? best.toLocaleString() + '점' : '아직 없어요. 첫 기록에 도전!')}</div><button id="btn-start-game" class="btn3d px-10 py-4 rounded-3xl text-2xl w-full max-w-[300px]" style="background:${k.c};color:#fff">${eng.noScore ? '🧰 열기' : '▶ 게임 시작!'}</button></div>`;
            $('btn-start-game').addEventListener('click', () => startGame(id));
        }

        function startGame(id){
            closeModal();
            const game = gameDefs.find(g => g.id === id); if(!game) return;
            const eng = E[game.e];
            newRuntime(game); audio();
            store.set('recent', [id, ...store.get('recent', []).filter(x => x !== id)].slice(0, 8));
            setScore(0); showBest();
            container.classList.toggle('canvas-mode', !!eng.canvas);
            setControls(eng.ctl || 'none', eng.label);
            try { eng.run(game); }
            catch(err){ console.error(err); container.innerHTML = `<div class="p-6 text-red-500">게임을 불러오는 중 문제가 발생했어요: ${esc(err.message)}</div>`; }
        }

        $('btn-back').addEventListener('click', () => { if(G && !G.over && currentId){ selectGame(currentId); return; } loadMainScreen(); });
        $('btn-modal-retry').addEventListener('click', () => { closeModal(); if(currentId) startGame(currentId); });
        $('btn-modal-main').addEventListener('click', () => { closeModal(); loadMainScreen(); });

        // ==========================================
        // 8. 아케이드 (캔버스) 엔진
        // ==========================================

        // --- 뱀 게임: 방향 입력 버퍼, 보너스 별, 먹을수록 가속 ---
        E.snake = { canvas: true, ctl: 'dpad', run(g){
            const { ctx, w, h } = makeCanvas(); const N = 20, S = w / N;
            let snake = [{x:8,y:10},{x:7,y:10},{x:6,y:10}], dir = {x:1,y:0}, q = [], eaten = 0, speed = g.cfg.spd, bonus = null, dead = false, started = false;
            const occupied = p => snake.some(s => s.x === p.x && s.y === p.y);
            const free = () => { let p; do { p = { x: rnd(0, N - 1), y: rnd(0, N - 1) }; } while(occupied(p) || (food && food.x === p.x && food.y === p.y) || (bonus && bonus.x === p.x && bonus.y === p.y)); return p; };
            let food = null; food = free();
            const DIRS = { up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0} };
            G.onPress = k => {
                const d = DIRS[k]; if(!d) return;
                if(!started){ started = true; after(tick, 50); }
                const last = q.length ? q[q.length - 1] : dir;
                if((d.x === -last.x && d.y === -last.y) || (d.x === last.x && d.y === last.y)) return;
                if(q.length < 3) q.push(d);
            };
            const draw = () => {
                for(let y = 0; y < N; y++) for(let x = 0; x < N; x++){ ctx.fillStyle = (x + y) % 2 ? '#e3f6ea' : '#d3efdf'; ctx.fillRect(x * S, y * S, S, S); }
                emo(ctx, '🍎', food.x * S + S / 2, food.y * S + S / 2 + 1, S * .85);
                if(bonus && (bonus.t > 15 || bonus.t % 4 < 2)) emo(ctx, '⭐', bonus.x * S + S / 2, bonus.y * S + S / 2 + 1, S * .9);
                snake.forEach((s, i) => {
                    const t = i / Math.max(1, snake.length - 1);
                    ctx.fillStyle = dead ? '#a3a3b5' : `hsl(${150 - t * 40}, 60%, ${48 - t * 10}%)`;
                    rrect(ctx, s.x * S + 1, s.y * S + 1, S - 2, S - 2, i === 0 ? 8 : 5); ctx.fill();
                });
                const hd = snake[0], cx = hd.x * S + S / 2, cy = hd.y * S + S / 2;
                ctx.fillStyle = '#fff';
                [[-1, 1], [1, 1]].forEach(([a]) => { const ex = cx + dir.x * 4 + (dir.y ? a * 5 : 0), ey = cy + dir.y * 4 + (dir.x ? a * 5 : 0); ctx.beginPath(); ctx.arc(ex, ey, 3.2, 0, 7); ctx.fill(); });
                txt(ctx, `길이 ${snake.length}`, 8, 6, '#3f7a5c', 16);
                if(!started) banner(ctx, w, h, '방향키를 누르면 시작!', '사과 🍎 +10 · 별 ⭐ +50 (5개마다 등장)');
            };
            const tick = () => {
                if(q.length) dir = q.shift();
                const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
                const eat = head.x === food.x && head.y === food.y;
                const body = eat ? snake : snake.slice(0, -1);
                if(head.x < 0 || head.y < 0 || head.x >= N || head.y >= N || body.some(s => s.x === head.x && s.y === head.y)){
                    dead = true; draw(); sfx.bad(); return gameOver(`길이 ${snake.length} · 점수 ${score}`);
                }
                snake.unshift(head);
                if(eat){
                    eaten++; addScore(10); sfx.coin(); food = free();
                    if(eaten % 5 === 0) bonus = { ...free(), t: 45 };
                    speed = Math.max(g.cfg.spd * 0.55, speed - 2.5);
                } else snake.pop();
                if(bonus && head.x === bonus.x && head.y === bonus.y){ addScore(50); sfx.win(); bonus = null; }
                if(bonus && --bonus.t <= 0) bonus = null;
                draw(); after(tick, speed);
            };
            draw();
        }};

        // --- 퐁: 컴퓨터 AI 대전, 7점 선승, 맞은 위치에 따라 각도 변화 ---
        E.pong = { canvas: true, ctl: 'dpad', run(g){
            const { ctx, w, h } = makeCanvas(); const PH = 80, PW = 12, WIN = 7, base = 4.6 * g.cfg.spd;
            let py = h / 2 - PH / 2, cy = h / 2 - PH / 2, ps = 0, cs = 0, ball, serveT = 0, cpuErr = 0, rally = 0, msg = '';
            const cpuSpd = 3.4 + g.cfg.spd * 1.6;
            const serve = dirX => { const a = Math.random() * .8 - .4; ball = { x: w / 2, y: h / 2, vx: dirX * base * Math.cos(a), vy: base * Math.sin(a), sp: base }; serveT = 70; rally = 0; };
            serve(1);
            const cv = $('cv');
            listen(cv, 'pointermove', e => { if(e.pointerType !== 'mouse' || e.buttons) py = clamp(canvasPos(cv, e).y - PH / 2, 0, h - PH); });
            listen(cv, 'pointerdown', e => { py = clamp(canvasPos(cv, e).y - PH / 2, 0, h - PH); });
            loop(() => {
                if(keys.up) py -= 7; if(keys.down) py += 7; py = clamp(py, 0, h - PH);
                const target = ball.vx > 0 ? ball.y - PH / 2 + cpuErr : h / 2 - PH / 2;
                cy += clamp(target - cy, -cpuSpd, cpuSpd); cy = clamp(cy, 0, h - PH);
                if(serveT > 0){ serveT--; return; }
                ball.x += ball.vx; ball.y += ball.vy;
                if(ball.y < 7){ ball.y = 7; ball.vy = Math.abs(ball.vy); sfx.tick(); }
                if(ball.y > h - 7){ ball.y = h - 7; ball.vy = -Math.abs(ball.vy); sfx.tick(); }
                const bounce = (padY, dirX) => {
                    const rel = clamp((ball.y - (padY + PH / 2)) / (PH / 2), -1, 1), ang = rel * 1.0;
                    ball.sp = Math.min(ball.sp * 1.06, base * 2.3);
                    ball.vx = dirX * Math.cos(ang) * ball.sp; ball.vy = Math.sin(ang) * ball.sp; sfx.hit(); rally++;
                };
                if(ball.vx < 0 && ball.x - 7 <= 20 + PW && ball.x > 14 && ball.y > py - 7 && ball.y < py + PH + 7){ ball.x = 20 + PW + 7; bounce(py, 1); addScore(10); cpuErr = rnd(-42, 42); }
                if(ball.vx > 0 && ball.x + 7 >= w - 20 - PW && ball.x < w - 14 && ball.y > cy - 7 && ball.y < cy + PH + 7){ ball.x = w - 20 - PW - 7; bounce(cy, -1); }
                if(ball.x < -20){ cs++; sfx.bad(); msg = '실점...'; if(cs >= WIN) return gameOver(`${ps} : ${cs} 패배... 점수 ${score}`); serve(1); }
                if(ball.x > w + 20){ ps++; addScore(100); sfx.good(); msg = '득점!'; if(ps >= WIN){ addScore((WIN - cs) * 50); return win(`${ps} : ${cs} 승리! 점수 ${score}`); } serve(-1); }
            }, () => {
                ctx.fillStyle = '#e8f3ff'; ctx.fillRect(0, 0, w, h);
                ctx.strokeStyle = '#bcd6f5'; ctx.setLineDash([10, 12]); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(w / 2, 0); ctx.lineTo(w / 2, h); ctx.stroke(); ctx.setLineDash([]);
                txt(ctx, ps, w / 2 - 60, 16, '#38bdf8', 48, 'center'); txt(ctx, cs, w / 2 + 60, 16, '#f472b6', 48, 'center');
                txt(ctx, 'YOU', w / 2 - 60, 68, '#7c7597', 14, 'center'); txt(ctx, 'CPU', w / 2 + 60, 68, '#7c7597', 14, 'center');
                ctx.fillStyle = '#38bdf8'; rrect(ctx, 20, py, PW, PH, 5); ctx.fill();
                ctx.fillStyle = '#f472b6'; rrect(ctx, w - 20 - PW, cy, PW, PH, 5); ctx.fill();
                ctx.fillStyle = '#6a5ae0'; ctx.beginPath(); ctx.arc(ball.x, ball.y, 7, 0, 7); ctx.fill();
                if(rally >= 3) txt(ctx, `랠리 ${rally}`, w / 2, h - 30, '#d97706', 16, 'center');
                if(serveT > 0) banner(ctx, w, h, msg || '준비!', `${WIN}점 먼저 내면 승리 · 랠리 +10 · 득점 +100`);
            });
        }};

        // --- 벽돌깨기: 생명 3, 내구도 벽돌, 아이템(넓은 패들/멀티볼/생명), 스테이지 ---
        E.brick = { canvas: true, ctl: 'both', run(g){
            const { ctx, w, h, cv } = makeCanvas(); const COLS = 8, BW = 54, BH = 18, GAP = 4, OX = (w - (COLS * BW + (COLS - 1) * GAP)) / 2, PY = h - 30;
            let level = 1, lives = 3, pw = 90, px = w / 2 - 45, wideT = 0, balls = [], bricks = [], drops = [], parts = [], msgT = 90;
            const COLORS = ['#38bdf8', '#a78bfa', '#f472b6', '#9ca3af'];
            const speed = () => Math.min(4.8 + level * 0.5, 9);
            const build = () => {
                bricks = []; const rows = Math.min(4 + level, 8), pat = (level - 1) % 4;
                for(let r = 0; r < rows; r++) for(let c = 0; c < COLS; c++){
                    if(pat === 1 && Math.abs(c - 3.5) > rows - r) continue;              // 피라미드
                    if(pat === 2 && (r + c) % 2) continue;                              // 체크무늬
                    if(pat === 3 && (c === 0 || c === COLS - 1) && r % 2) continue;
                    let hp = 1; if(level >= 2 && r < 2) hp = 2; if(level >= 3 && r === 0) hp = 3; if(level >= 5 && r < 3) hp = 3;
                    bricks.push({ x: OX + c * (BW + GAP), y: 50 + r * (BH + GAP), hp, max: hp });
                }
            };
            const newBall = () => { balls = [{ x: px + pw / 2, y: PY - 8, vx: 0, vy: 0, stuck: true }]; };
            build(); newBall();
            const launch = () => balls.forEach(b => { if(b.stuck){ b.stuck = false; const a = (Math.random() * .6 - .3); b.vx = Math.sin(a) * speed(); b.vy = -Math.cos(a) * speed(); } });
            listen(cv, 'pointermove', e => { px = clamp(canvasPos(cv, e).x - pw / 2, 0, w - pw); });
            listen(cv, 'pointerdown', e => { px = clamp(canvasPos(cv, e).x - pw / 2, 0, w - pw); launch(); });
            const hitBrick = (b) => {
                for(const br of bricks){
                    if(b.x + 7 > br.x && b.x - 7 < br.x + BW && b.y + 7 > br.y && b.y - 7 < br.y + BH){
                        br.hp--; addScore(10); sfx.hit();
                        if(br.hp <= 0){
                            addScore(40); bricks.splice(bricks.indexOf(br), 1);
                            for(let i = 0; i < 8; i++) parts.push({ x: br.x + BW / 2, y: br.y + BH / 2, vx: Math.random() * 6 - 3, vy: Math.random() * 6 - 3, t: 30, c: COLORS[br.max - 1] });
                            if(Math.random() < .14) drops.push({ x: br.x + BW / 2, y: br.y, type: pick(['W', 'W', 'M', 'M', 'L']) });
                        }
                        return true;
                    }
                }
                return false;
            };
            loop(() => {
                if(msgT > 0) msgT--;
                if(keys.left) px -= 8; if(keys.right) px += 8;
                if(wideT > 0 && --wideT === 0) pw = 90;
                px = clamp(px, 0, w - pw);
                if(tap('action') || tap('up')) launch();
                for(const b of balls){
                    if(b.stuck){ b.x = px + pw / 2; b.y = PY - 8; continue; }
                    b.x += b.vx; if(b.x < 7 || b.x > w - 7){ b.vx *= -1; b.x = clamp(b.x, 7, w - 7); } if(hitBrick(b)) b.vx *= -1;
                    b.y += b.vy; if(b.y < 7){ b.vy = Math.abs(b.vy); } if(hitBrick(b)) b.vy *= -1;
                    if(b.vy > 0 && b.y + 7 >= PY && b.y < PY + 12 && b.x > px - 6 && b.x < px + pw + 6){
                        const rel = clamp((b.x - (px + pw / 2)) / (pw / 2), -1, 1), a = rel * 1.05, sp = speed();
                        b.vx = Math.sin(a) * sp; b.vy = -Math.cos(a) * sp; b.y = PY - 8; sfx.tick();
                    }
                }
                balls = balls.filter(b => b.y < h + 10);
                if(!balls.length){
                    lives--; sfx.bad();
                    if(lives <= 0) return gameOver(`스테이지 ${level} · 점수 ${score}`);
                    pw = 90; wideT = 0; newBall(); msgT = 60;
                }
                drops.forEach(d => d.y += 3);
                drops = drops.filter(d => {
                    if(d.y > PY - 10 && d.y < PY + 14 && d.x > px && d.x < px + pw){
                        sfx.coin(); addScore(30);
                        if(d.type === 'W'){ pw = 140; wideT = 600; }
                        if(d.type === 'L') lives = Math.min(5, lives + 1);
                        if(d.type === 'M'){ const extra = []; balls.filter(b => !b.stuck).slice(0, 3).forEach(b => { [-0.5, 0.5].forEach(o => { const sp = speed(), a = Math.atan2(b.vx, -b.vy) + o; extra.push({ x: b.x, y: b.y, vx: Math.sin(a) * sp, vy: -Math.cos(a) * sp }); }); }); balls.push(...extra); }
                        return false;
                    }
                    return d.y < h;
                });
                parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.t--; }); parts = parts.filter(p => p.t > 0);
                if(!bricks.length){
                    addScore(200 * level);
                    if(!g.cfg.inf && level >= 3) return win(`3개 스테이지 클리어! 점수 ${score}`);
                    level++; build(); newBall(); drops = []; msgT = 90; sfx.win();
                }
            }, () => {
                ctx.fillStyle = '#f5f1ff'; ctx.fillRect(0, 0, w, h);
                bricks.forEach(br => { ctx.fillStyle = COLORS[br.hp - 1]; rrect(ctx, br.x, br.y, BW, BH, 4); ctx.fill(); if(br.max > 1){ ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(br.x + 3, br.y + 3, BW - 6, 3); } });
                parts.forEach(p => { ctx.globalAlpha = p.t / 30; ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, 4, 4); }); ctx.globalAlpha = 1;
                drops.forEach(d => { ctx.fillStyle = { W: '#22c55e', M: '#f59e0b', L: '#ef4444' }[d.type]; ctx.beginPath(); ctx.arc(d.x, d.y, 11, 0, 7); ctx.fill(); txt(ctx, { W: '↔', M: '✦', L: '♥' }[d.type], d.x, d.y + 1, '#fff', 15, 'center', 'middle'); });
                ctx.fillStyle = wideT > 0 ? '#4ade80' : '#22c55e'; rrect(ctx, px, PY, pw, 12, 6); ctx.fill();
                ctx.fillStyle = '#6a5ae0'; balls.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 7, 0, 7); ctx.fill(); });
                txt(ctx, `STAGE ${level}${g.cfg.inf ? '' : '/3'}`, 10, 12, '#7c7597', 16); txt(ctx, hearts(lives), w - 10, 10, '#fff', 16, 'right');
                if(msgT > 0 && balls[0] && balls[0].stuck) banner(ctx, w, h, `STAGE ${level}`, 'ACTION(스페이스) 또는 화면 터치로 발사!');
            });
        }};

        // --- 소행성 피하기: 생명 3, 무적 시간, 별 아이템, 시간에 따라 난이도 상승 ---
        E.dodge = { canvas: true, ctl: 'dpad', run(g){
            const { ctx, w, h, cv } = makeCanvas(); const hard = !!g.cfg.hard;
            let px = w / 2, py = h - 50, lives = 3, inv = 0, rocks = [], items = [], t = 0, stars = Array.from({length: 50}, () => ({ x: Math.random() * w, y: Math.random() * h, s: Math.random() * 2 + .5 }));
            let drag = null;
            listen(cv, 'pointerdown', e => { drag = canvasPos(cv, e); });
            listen(cv, 'pointermove', e => { if(drag){ const p = canvasPos(cv, e); px += p.x - drag.x; py += p.y - drag.y; drag = p; } });
            listen(window, 'pointerup', () => drag = null);
            loop(() => {
                t++;
                const sp = 5.5; if(keys.left) px -= sp; if(keys.right) px += sp; if(keys.up) py -= sp; if(keys.down) py += sp;
                px = clamp(px, 18, w - 18); py = clamp(py, h * .35, h - 20);
                const lvl = 1 + t / 900, rate = Math.max(hard ? 5 : 12, (hard ? 14 : 28) - t / 200);
                if(t % Math.floor(rate) === 0){ const r = rnd(12, hard ? 30 : 26); rocks.push({ x: Math.random() * w, y: -30, r, vy: (2.5 + Math.random() * 2.5) * lvl * (hard ? 1.25 : 1), vx: (Math.random() - .5) * (hard ? 2.5 : 1.2), rot: 0 }); }
                if(t % 240 === 0) items.push({ x: rnd(30, w - 30), y: -20, type: Math.random() < .2 ? '🛡️' : '⭐' });
                if(t % 6 === 0) addScore(1);
                rocks.forEach(r => { r.y += r.vy; r.x += r.vx; r.rot += .05; });
                rocks = rocks.filter(r => { if(r.y > h + 40){ addScore(2); return false; } return true; });
                items.forEach(i => i.y += 2.5);
                items = items.filter(i => { if(Math.hypot(i.x - px, i.y - py) < 30){ sfx.coin(); if(i.type === '⭐') addScore(50); else inv = 300; return false; } return i.y < h + 20; });
                stars.forEach(s => { s.y += s.s * 2; if(s.y > h) { s.y = 0; s.x = Math.random() * w; } });
                if(inv > 0) inv--;
                else for(const r of rocks){ if(Math.hypot(r.x - px, r.y - py) < r.r * .8 + 12){ lives--; inv = 100; sfx.boom(); rocks.splice(rocks.indexOf(r), 1); if(lives <= 0) return gameOver(`${Math.floor(t / 60)}초 생존 · 점수 ${score}`); break; } }
            }, () => {
                ctx.fillStyle = '#020617'; ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = '#cbd5e1'; stars.forEach(s => ctx.fillRect(s.x, s.y, s.s, s.s));
                rocks.forEach(r => emo(ctx, hard ? '☄️' : '🪨', r.x, r.y, r.r * 2, r.rot));
                items.forEach(i => emo(ctx, i.type, i.x, i.y, 28));
                if(inv % 10 < 6){ emo(ctx, '🚀', px, py, 34, -Math.PI / 4); if(inv > 100){ ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(px, py, 26, 0, 7); ctx.stroke(); } }
                txt(ctx, hearts(lives), 10, 10, '#fff', 18); txt(ctx, `${Math.floor(t / 60)}초`, w - 10, 10, '#94a3b8', 18, 'right');
                if(t < 120) banner(ctx, w, h, '피해라!', '방향키 또는 드래그로 이동 · ⭐ +50 · 🛡️ 보호막');
            });
        }};

        // --- 받기 게임 (사과 바구니 / 선물 받기): 나쁜 아이템, 황금 아이템, 놓치면 생명 감소 ---
        E.catch = { canvas: true, ctl: 'dpad', run(g){
            const { ctx, w, h, cv } = makeCanvas();
            const good = g.cfg.gift ? ['🎁', '🎀', '🧸', '🍬'] : ['🍎', '🍏', '🍐', '🍊'], gold = g.cfg.gift ? '🌟' : '🍯', bad = g.cfg.gift ? '🪨' : '🐛';
            let px = w / 2, lives = 5, objs = [], t = 0, caught = 0, fx = [];
            listen(cv, 'pointermove', e => { if(e.pointerType !== 'mouse' || e.buttons) px = canvasPos(cv, e).x; });
            listen(cv, 'pointerdown', e => { px = canvasPos(cv, e).x; });
            loop(() => {
                t++;
                if(keys.left) px -= 8; if(keys.right) px += 8; px = clamp(px, 40, w - 40);
                const lvl = 1 + caught / 25, rate = Math.max(18, 45 - caught);
                if(t % rate === 0){ const r = Math.random(); objs.push({ x: rnd(20, w - 20), y: -20, vy: (2.2 + Math.random() * 1.5) * lvl, type: r < .18 + Math.min(.12, caught / 300) ? 'bad' : r > .95 ? 'gold' : 'good', e: pick(good) }); }
                objs.forEach(o => o.y += o.vy);
                objs = objs.filter(o => {
                    if(o.y > h - 60 && o.y < h - 20 && Math.abs(o.x - px) < 44){
                        if(o.type === 'bad'){ lives--; sfx.bad(); fx.push({ x: o.x, y: h - 70, s: '-❤️', t: 40, c: '#f87171' }); }
                        else { const p = o.type === 'gold' ? 50 : 10; addScore(p); caught++; (o.type === 'gold' ? sfx.win : sfx.coin)(); fx.push({ x: o.x, y: h - 70, s: '+' + p, t: 40, c: '#facc15' }); }
                        return false;
                    }
                    if(o.y > h + 20){ if(o.type !== 'bad'){ lives--; sfx.bad(); fx.push({ x: o.x, y: h - 30, s: '놓침!', t: 40, c: '#f87171' }); } return false; }
                    return true;
                });
                fx.forEach(f => { f.y -= 1; f.t--; }); fx = fx.filter(f => f.t > 0);
                if(lives <= 0) gameOver(`${caught}개 받음 · 점수 ${score}`);
            }, () => {
                const grd = ctx.createLinearGradient(0, 0, 0, h); grd.addColorStop(0, g.cfg.gift ? '#fbe4f0' : '#cdeafe'); grd.addColorStop(1, g.cfg.gift ? '#fff7ee' : '#f0fbf4'); ctx.fillStyle = grd; ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = g.cfg.gift ? '#ffffff' : '#86d5a6'; ctx.fillRect(0, h - 12, w, 12);
                objs.forEach(o => emo(ctx, o.type === 'bad' ? bad : o.type === 'gold' ? gold : o.e, o.x, o.y, o.type === 'gold' ? 34 : 30));
                emo(ctx, g.cfg.gift ? '🛷' : '🧺', px, h - 40, 60);
                fx.forEach(f => { ctx.globalAlpha = f.t / 40; txt(ctx, f.s, f.x, f.y, f.c, 20, 'center'); }); ctx.globalAlpha = 1;
                txt(ctx, hearts(lives), 10, 10, '#fff', 16); txt(ctx, `받은 개수 ${caught}`, w - 10, 10, '#5b5475', 16, 'right');
                if(t < 120) banner(ctx, w, h, g.cfg.gift ? '선물을 받아라!' : '사과를 받아라!', `${bad} 은 피하세요 · ${gold} 는 +50`);
            });
        }};

        // --- 슈팅 (기본/하드/더블샷/눈싸움): 웨이브, 적 총알, 파워업, 5웨이브마다 보스 ---
        E.shooter = { canvas: true, ctl: 'both', label: '🔥 발사 (누르고 있기)', run(g){
            const { ctx, w, h, cv } = makeCanvas(); const hard = !!g.cfg.hard, ice = !!g.cfg.ice;

        // --- 리듬 탭: 4라인, 판정(PERFECT/GREAT/GOOD/MISS), 콤보, 체력, 등급 ---

        // --- 볼링: 10프레임 정식 점수 계산, 조준 → 방향 → 투구, 핀 물리 ---
        E.bowling = { canvas: true, ctl: 'action', label: '🎳 결정 / 던지기', run(g){

                txt(ctx, phase === 'aim' ? '① 위치를 정하세요 (ACTION)' : phase === 'angle' ? '② 방향을 정하세요 (ACTION)' : '', w - 12, h - 26, '#fde68a', 15, 'right');

        }};

        // --- 우주 탐험: 4방향 이동, 연료 관리, 보석/연료/보호막 수집 ---
        E.space = { canvas: true, ctl: 'dpad', run(g){

                if(t % 260 === 0) items.push({ x: rnd(30, w - 30), y: -20, type: '💎' });

                stars.forEach(s => { s.y += s.z * 1.5 * lvl; if(s.y > h){ s.y = 0; s.x = Math.random() * w; } });
                rocks.forEach(r => { r.x += r.vx; r.y += r.vy; r.rot += .04; }); rocks = rocks.filter(r => r.y < h + 50);
                items.forEach(i => i.y += 2.5);
                items = items.filter(i => { if(Math.hypot(i.x - px, i.y - py) < 28){ sfx.coin(); if(i.type === '⛽') fuel = Math.min(100, fuel + 35); if(i.type === '💎') addScore(100); if(i.type === '🛡️') shield = 360; return false; } return i.y < h + 20; });
                if(shield > 0) shield--; if(inv > 0) inv--;
                for(const r of rocks){ if(Math.hypot(r.x - px, r.y - py) < r.r * .8 + 12){ if(shield > 0){ r.y = h + 99; addScore(20); sfx.pop(); continue; } if(inv === 0){ lives--; inv = 100; sfx.boom(); r.y = h + 99; } } }
                if(lives <= 0) return gameOver(`운석 충돌! ${Math.floor(dist / 6)}km 비행 · 점수 ${score}`);
                if(fuel <= 0) return gameOver(`연료 고갈! ${Math.floor(dist / 6)}km 비행 · 점수 ${score}`);
            }, () => {
                ctx.fillStyle = '#020617'; ctx.fillRect(0, 0, w, h);
