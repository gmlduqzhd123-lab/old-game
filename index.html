        // 입력 컨트롤 상태 객체 (PC + 모바일 통합)
        let keys = { up: false, down: false, left: false, right: false, action: false };

        // 1. 이벤트 리스너 통합 관리 (화면 스크롤 방지 완벽 적용)
        window.addEventListener('keydown', e => {
            if(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                if(document.activeElement.tagName !== 'INPUT') e.preventDefault();
            }
            if(e.key === 'ArrowUp' || e.key === 'w') keys.up = true;
            if(e.key === 'ArrowDown' || e.key === 's') keys.down = true;
            if(e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if(e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if(e.key === ' ') keys.action = true;
        }, {passive: false});

        window.addEventListener('keyup', e => {
            if(e.key === 'ArrowUp' || e.key === 'w') keys.up = false;
            if(e.key === 'ArrowDown' || e.key === 's') keys.down = false;
            if(e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if(e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            if(e.key === ' ') keys.action = false;
        });

        // 가상 조이패드 (터치 및 마우스 지원)
        const bindBtn = (id, key) => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', e => { e.preventDefault(); keys[key] = true; });
            btn.addEventListener('touchend', e => { e.preventDefault(); keys[key] = false; });
            btn.addEventListener('mousedown', e => { keys[key] = true; });
            btn.addEventListener('mouseup', e => { keys[key] = false; });
            btn.addEventListener('mouseleave', e => { keys[key] = false; });
        };
        bindBtn('btn-up', 'up'); bindBtn('btn-down', 'down');
        bindBtn('btn-left', 'left'); bindBtn('btn-right', 'right');
        bindBtn('btn-action', 'action');

        function initMenu() {
            const menu = document.getElementById('game-menu');
            let html = '';
            categories.forEach(cat => {
                html += `<div class="mb-4">
                    <p class="font-bold text-yellow-400 mb-2 border-b border-slate-700 pb-1">${cat.name}</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-1 gap-1">`;
                cat.games.forEach(g => {
                    html += `<button onclick="selectGame(${g.id})" class="text-left px-3 py-2 rounded bg-slate-800 hover:bg-indigo-600 transition truncate">${g.id}. ${g.title}</button>`;
                });
                html += `</div></div>`;
            });
            menu.innerHTML = html;
        }

        // 플랫 배열 생성 (ID 검색용)
        const allGames = categories.flatMap(c => c.games);

        function loadMainScreen() {
            closeModal();
            currentId = null;
            score = 0;
            document.getElementById('score-board').innerText = 'SCORE: 0';
            document.getElementById('game-title').innerText = "환영합니다!";
            document.getElementById('game-info').innerText = "목록에서 게임을 선택해 주세요.";
            mobileControls.classList.add('hidden');
            actionControl.classList.add('hidden');
            
            container.innerHTML = `
                <div class="text-center p-4 flex flex-col items-center justify-center w-full h-full bg-slate-950">
                    <span class="text-6xl mb-4 animate-bounce">🚀</span>
                    <h2 class="text-xl md:text-2xl font-bold text-yellow-400 mb-2">엽쌤스쿨 100선 아카이브</h2>
                    <p class="text-xs md:text-sm text-slate-400 px-4 leading-relaxed">아케이드, 퍼즐, 교육용 퀴즈, 학급 도구까지!<br>모바일 터치로도 완벽 구동됩니다.</p>
                </div>
            `;
            container.appendChild(modal); // 모달 요소 복구
        }

        function selectGame(id) {
            closeModal();
            currentId = id;
            const game = allGames.find(g => g.id === id);
            if(!game) return;
            
            score = 0;
            document.getElementById('score-board').innerText = 'SCORE: 0';
            document.getElementById('game-title').innerText = game.title;
            document.getElementById('game-info').innerText = game.desc;

            // 모바일 컨트롤 UI 표시 여부 결정
            if(game.type === 'canvas') {
                mobileControls.classList.remove('hidden');
                mobileControls.classList.add('grid');
                actionControl.classList.remove('hidden');
            } else {
                mobileControls.classList.add('hidden');
                mobileControls.classList.remove('grid');
                actionControl.classList.add('hidden');
            }

            container.innerHTML = `
                <div class="text-center p-6 flex flex-col items-center justify-center w-full h-full">
                    <h3 class="text-3xl font-bold text-cyan-400 mb-4">${game.title}</h3>
                    <p class="text-sm md:text-base text-slate-300 mb-8">${game.desc}</p>
                    <button onclick="startGame(${id})" class="px-10 py-4 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-bold text-xl text-white shadow-[0_4px_0_rgb(4,120,87)] active:shadow-[0_0px_0_rgb(4,120,87)] active:translate-y-1 transition">🚀 게임 시작하기</button>
                </div>
            `;
            container.appendChild(modal);
        }

        // 4. 안전한 모달 제어 (alert 무한 루프 방지)
        function triggerGameOver(finalScore) {
            if(currentTimer) { clearInterval(currentTimer); currentTimer = null; }
            keys = { up: false, down: false, left: false, right: false, action: false }; // 키 초기화
            
            document.getElementById('modal-title').innerText = "게임 오버!";
            document.getElementById('modal-title').className = "text-3xl font-bold text-red-500 mb-4 text-center";
            document.getElementById('modal-desc').innerText = "최종 점수: " + finalScore;
            modal.classList.remove('hidden');
        }

        function triggerSuccess(msg, pts = 0) {
            if(pts > 0) {
                score += pts;
                document.getElementById('score-board').innerText = 'SCORE: ' + score;
            }
            document.getElementById('modal-title').innerText = "성공!";
            document.getElementById('modal-title').className = "text-3xl font-bold text-emerald-400 mb-4 text-center";
            document.getElementById('modal-desc').innerText = msg;
            modal.classList.remove('hidden');
        }

        function closeModal(restart = false) {
            modal.classList.add('hidden');
            if(restart && currentId) startGame(currentId);
        }

        // 5. 범용 게임 엔진 라우터
        function startGame(id) {
            const game = allGames.find(g => g.id === id);
            if(!game) return;
            
            score = 0;
            document.getElementById('score-board').innerText = 'SCORE: 0';
            
            if(game.type === 'canvas') {
                initCanvasEnv();
                runCanvasEngine(game);
            } else if(game.type === 'dom') {
                runDOMEngine(game);
            }
        }

        // --- 캔버스 공통 환경 ---
        function initCanvasEnv() {
            if (currentTimer) { clearInterval(currentTimer); currentTimer = null; }
            keys = { up: false, down: false, left: false, right: false, action: false };
            container.innerHTML = '<canvas id="canvas" width="480" height="480" class="bg-slate-950 w-full h-full object-contain"></canvas>';
            container.appendChild(modal);
        }

        function getCtx() { return document.getElementById('canvas').getContext('2d'); }

        // --- 통합 캔버스 엔진 ---
        function runCanvasEngine(g) {
            const ctx = getCtx();
            const w = 480, h = 480;
            let frame = 0;

            if(g.engine === 'snake') {
                let snake = [{x:10, y:10}], food = {x:15, y:10}, dx=1, dy=0, size=20;
                let speed = g.speed || 100;
                currentTimer = setInterval(() => {
                    if(keys.up && dy===0){dx=0;dy=-1;} if(keys.down && dy===0){dx=0;dy=1;}
                    if(keys.left && dx===0){dx=-1;dy=0;} if(keys.right && dx===0){dx=1;dy=0;}
                    let head = {x: snake[0].x+dx, y: snake[0].y+dy};
                    if(head.x<0||head.x>=24||head.y<0||head.y>=24||snake.slice(1).some(s=>s.x===head.x&&s.y===head.y)){
                        triggerGameOver(score); return;
                    }
                    snake.unshift(head);
                    if(head.x===food.x&&head.y===food.y){
                        score+=10; document.getElementById('score-board').innerText='SCORE: '+score;
                        food={x:Math.floor(Math.random()*24), y:Math.floor(Math.random()*24)};
                    } else snake.pop();
                    ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,w,h);
                    ctx.fillStyle='#ef4444'; ctx.fillRect(food.x*size, food.y*size, size-2, size-2);
                    ctx.fillStyle='#22c55e'; snake.forEach(s=>ctx.fillRect(s.x*size, s.y*size, size-2, size-2));
                }, speed);
            }
            else if(g.engine === 'pong') {
                let py=200, bx=240, by=240, dx=4, dy=3;
                let spdMultiplier = g.speed || 1;
                dx *= spdMultiplier; dy *= spdMultiplier;
                currentTimer = setInterval(() => {
                    if(keys.up && py>0) py-=8; if(keys.down && py<h-80) py+=8;
                    bx+=dx; by+=dy; 
                    if(by<0||by>h-10) dy*=-1; 
                    if(bx>w-10) dx*=-1;
                    if(bx<=20 && by>=py && by<=py+80){ dx*=-1; score+=10; document.getElementById('score-board').innerText='SCORE: '+score; }
                    if(bx<0){ triggerGameOver(score); return; }
                    ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,w,h);
                    ctx.fillStyle='#fff'; ctx.fillRect(10,py,12,80); ctx.fillRect(bx,by,10,10);
                }, 1000/60);
            }
            else if(g.engine === 'brick') {
                let px=200, bx=240, by=300, dx=4, dy=-4;
                let bricks = []; 
                for(let c=0;c<6;c++){ bricks[c]=[]; for(let r=0;r<5;r++) bricks[c][r]={status:1}; }
                currentTimer = setInterval(() => {
                    if(keys.right && px<w-80) px+=8; if(keys.left && px>0) px-=8;
                    bx+=dx; by+=dy;
                    if(bx>w-8||bx<8) dx*=-1; if(by<8) dy*=-1;
                    if(by>h-30 && bx>px && bx<px+80) dy*=-1;
                    if(by>h){ triggerGameOver(score); return; }
                    
                    let allCleared = true;
                    for(let c=0;c<6;c++){for(let r=0;r<5;r++){
                        let b=bricks[c][r]; if(b.status===1){
                            allCleared = false;
                            let bx_pos=c*75+15, by_pos=r*25+20;
                            if(bx>bx_pos && bx<bx_pos+70 && by>by_pos && by<by_pos+20){
                                dy*=-1; b.status=0; score+=50; document.getElementById('score-board').innerText='SCORE: '+score;
                            }
                        }
                    }}
                    if(allCleared && g.infinite) { // 무한 모드 리셋
                        for(let c=0;c<6;c++) for(let r=0;r<5;r++) bricks[c][r].status=1;
                        by = 300; dy = -4;
                    } else if(allCleared) { triggerSuccess('모든 벽돌을 부쉈습니다!', 0); clearInterval(currentTimer); return; }

                    ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,w,h);
                    for(let c=0;c<6;c++){for(let r=0;r<5;r++){
                        if(bricks[c][r].status===1){ctx.fillStyle='#38bdf8'; ctx.fillRect(c*75+15,r*25+20,70,18);}
                    }}
                    ctx.fillStyle='#22c55e'; ctx.fillRect(px,h-20,80,12);
                    ctx.fillStyle='#ef4444'; ctx.beginPath(); ctx.arc(bx,by,8,0,Math.PI*2); ctx.fill();
                }, 1000/60);
            }
            else if(g.engine === 'dodge' || g.engine === 'catch') {
                let px=220, objs=[], isDodge = g.engine==='dodge';
                let spawnRate = g.hard ? 15 : 30;
                currentTimer = setInterval(() => {
                    frame++; 
                    if(keys.right && px<w-40) px+=7; if(keys.left && px>0) px-=7;
                    if(frame%spawnRate===0) objs.push({x:Math.random()*(w-30), y:-30, speed:3+Math.random()*4});
                    
                    for(let i=objs.length-1; i>=0; i--){
                        objs[i].y += objs[i].speed;
                        let hit = objs[i].x < px+40 && objs[i].x+30 > px && objs[i].y+30 > h-30 && objs[i].y < h;
                        
                        if(isDodge && hit) { triggerGameOver(score); return; }
                        if(!isDodge && hit) { objs.splice(i,1); score+=10; document.getElementById('score-board').innerText='SCORE: '+score; continue; }
                        
                        if(objs[i].y > h) {
                            if(isDodge) { score+=10; document.getElementById('score-board').innerText='SCORE: '+score; }
                            objs.splice(i,1);
                        }
                    }
                    ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,w,h);
                    ctx.fillStyle = isDodge ? '#10b981' : '#3b82f6'; ctx.fillRect(px,h-30,isDodge?40:80,20);
                    ctx.fillStyle = isDodge ? '#f43f5e' : '#ef4444'; 
                    objs.forEach(o=>{
                        if(isDodge) ctx.fillRect(o.x,o.y,30,30);
                        else { ctx.beginPath(); ctx.arc(o.x+15,o.y+15,15,0,Math.PI*2); ctx.fill(); }
                    });
                }, 1000/60);
            }
            else if(g.engine === 'dino') {
                let y=350, dy=0, isJumping=false, obsX=w;
                let isNight = g.night;
                currentTimer = setInterval(() => {
                    if((keys.up || keys.action) && !isJumping){ dy=-13; isJumping=true; }
                    dy+=0.8; y+=dy; if(y>350){ y=350; isJumping=false; }
                    obsX-=6; if(obsX<-40){ obsX=w; score+=20; document.getElementById('score-board').innerText='SCORE: '+score; }
                    
                    if(obsX < 50+30 && obsX+30 > 50 && y+40 > 380){ triggerGameOver(score); return; }
                    
                    ctx.fillStyle = isNight ? '#000' : '#0f172a'; ctx.fillRect(0,0,w,h);
                    ctx.fillStyle = '#38bdf8'; ctx.fillRect(50,y,30,40); // player
                    ctx.fillStyle = isNight ? '#fff' : '#f59e0b'; ctx.fillRect(obsX,380,30,30); // obs
                    ctx.fillStyle = '#475569'; ctx.fillRect(0,410,w,10); // ground
                }, 1000/60);
            }
            else if(g.engine === 'shooter') {
                let px=220, bullets=[], enemies=[];
                currentTimer = setInterval(() => {
                    frame++;
                    if(keys.right && px<w-40) px+=6; if(keys.left && px>0) px-=6;
                    if(keys.action && frame%10===0) bullets.push({x:px+18, y:h-40});
                    
                    if(frame%40===0) enemies.push({x:Math.random()*(w-40), y:-40});
                    
                    bullets.forEach((b,i)=> { b.y-=10; if(b.y<0) bullets.splice(i,1); });
                    
                    for(let i=enemies.length-1; i>=0; i--){
                        enemies[i].y += 3;
                        if(enemies[i].y > h){ triggerGameOver(score); return; }
                        for(let j=bullets.length-1; j>=0; j--){
                            if(bullets[j] && bullets[j].x > enemies[i].x && bullets[j].x < enemies[i].x+40 && bullets[j].y > enemies[i].y && bullets[j].y < enemies[i].y+40) {
                                enemies.splice(i,1); bullets.splice(j,1); score+=30; document.getElementById('score-board').innerText='SCORE: '+score; break;
                            }
                        }
                    }
                    ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,w,h);
                    ctx.fillStyle='#22c55e'; ctx.fillRect(px,h-40,40,30); // player
                    ctx.fillStyle='#fbbf24'; bullets.forEach(b=>ctx.fillRect(b.x,b.y,4,15)); // bullet
                    ctx.fillStyle='#a855f7'; enemies.forEach(e=>ctx.fillRect(e.x,e.y,40,40)); // enemy
                }, 1000/60);
            }
            else if(g.engine === 'flappy') {
                let y=200, dy=0, pipeX=w, pipeH=150;
                currentTimer = setInterval(() => {
                    if(keys.up || keys.action){ dy=-7; keys.up=false; keys.action=false; } // 1회성 점프
                    dy+=0.5; y+=dy; pipeX-=4;
                    if(pipeX < -60){ pipeX=w; pipeH=50+Math.random()*200; score+=10; document.getElementById('score-board').innerText='SCORE: '+score; }
                    
                    if(y>h || y<0 || (pipeX<120 && pipeX+60>80 && (y<pipeH || y>pipeH+140))) { triggerGameOver(score); return; }
                    
                    ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,w,h);
                    ctx.fillStyle='#eab308'; ctx.beginPath(); ctx.arc(100,y,15,0,Math.PI*2); ctx.fill();
                    ctx.fillStyle='#22c55e'; ctx.fillRect(pipeX,0,60,pipeH); ctx.fillRect(pipeX,pipeH+140,60,h);
                }, 1000/60);
            }
            // fallback for missing engines
            else {
                ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,w,h);
                ctx.fillStyle='#fff'; ctx.font='20px Jua'; ctx.textAlign='center';
                ctx.fillText('엔진 로드 완료! (터치/방향키 조작)', w/2, h/2);
            }
        }

        // --- 통합 DOM 엔진 (퍼즐, 퀴즈, 타이쿤 등) ---
        function runDOMEngine(g) {
            if (currentTimer) { clearInterval(currentTimer); currentTimer = null; }
            keys = { up: false, down: false, left: false, right: false, action: false };
            
            const render = (html) => {
                container.innerHTML = `<div class="w-full h-full flex flex-col items-center justify-center p-4 text-center overflow-y-auto">${html}</div>`;
                container.appendChild(modal); // 모달 유지
            };

            // 1. 교육용 퀴즈 엔진 (Math, Words, History...)
            if(g.engine === 'quiz') {
                const generateQ = () => {
                    let q = "", a = "";
                    if(g.mode === 'mul') { let x=Math.floor(Math.random()*8)+2, y=Math.floor(Math.random()*9)+1; q=`${x} x ${y} = ?`; a=(x*y).toString(); }
                    else if(g.mode === 'addsub') { let x=Math.floor(Math.random()*50)+10, y=Math.floor(Math.random()*50)+1; q=`${x} + ${y} = ?`; a=(x+y).toString(); }
                    else if(g.mode === 'fruit') { const f=[['ㅅㅂ','수박'],['ㅅㄱ','사과'],['ㅍㄷ','포도'],['ㅂㄴㄴ','바나나']]; let r=f[Math.floor(Math.random()*f.length)]; q=r[0]; a=r[1]; }
                    else if(g.mode === 'animal') { const f=[['ㅎㄹㅇ','호랑이'],['ㄱㄹ','기린'],['ㅋㄲㄹ','코끼리'],['ㅌㄲ','토끼']]; let r=f[Math.floor(Math.random()*f.length)]; q=r[0]; a=r[1]; }
                    else if(g.mode === 'capital') { const f=[['한국','서울'],['일본','도쿄'],['미국','워싱턴'],['프랑스','파리']]; let r=f[Math.floor(Math.random()*f.length)]; q=`${r[0]}의 수도는?`; a=r[1]; }
                    else if(g.mode === 'korean') { const f=[['안되/안돼','안돼'],['설레임/설렘','설렘'],['몇일/며칠','며칠']]; let r=f[Math.floor(Math.random()*f.length)]; q=`맞는 것은? [${r[0]}]`; a=r[1]; }
                    else if(g.mode === 'history') { const f=[['임진왜란 발발 연도는?','1592'],['훈민정음 반포 연도는?','1446']]; let r=f[Math.floor(Math.random()*f.length)]; q=r[0]; a=r[1]; }
                    else if(g.mode === 'proverb') { const f=[['가는 말이 고와야 (  ) 말이 곱다','오는'],['소 잃고 (  ) 고친다','외양간']]; let r=f[Math.floor(Math.random()*f.length)]; q=r[0]; a=r[1]; }
                    else if(g.mode === 'nonsense') { const f=[['세상에서 가장 뜨거운 바다는?','열바다'],['왕이 넘어지면?','킹콩']]; let r=f[Math.floor(Math.random()*f.length)]; q=r[0]; a=r[1]; }
                    return {q, a};
                };

                let currentQ = generateQ();
                
                window.submitQuiz = () => {
                    let ans = document.getElementById('quiz-ans').value.trim();
                    if(ans === currentQ.a) {
                        score += 20; document.getElementById('score-board').innerText = 'SCORE: '+score;
                        currentQ = generateQ();
                        document.getElementById('quiz-q').innerText = currentQ.q;
                        document.getElementById('quiz-ans').value = '';
                        document.getElementById('quiz-ans').focus();
                    } else {
                        triggerGameOver(score);
                    }
                };

                render(`
                    <h2 class="text-2xl md:text-4xl font-bold text-yellow-400 mb-6">${g.title}</h2>
                    <p id="quiz-q" class="text-xl md:text-3xl font-bold text-white mb-6">${currentQ.q}</p>
                    <div class="flex flex-col md:flex-row gap-2 w-full max-w-sm">
                        <input id="quiz-ans" type="text" class="bg-slate-800 border-2 border-slate-600 px-4 py-3 rounded-xl text-center text-xl w-full text-white" placeholder="정답 입력" onkeydown="if(event.key==='Enter') submitQuiz()">
                        <button onclick="submitQuiz()" class="bg-indigo-600 hover:bg-indigo-500 px-6 py-3 rounded-xl font-bold text-xl whitespace-nowrap">제출</button>
                    </div>
                `);
                setTimeout(() => document.getElementById('quiz-ans').focus(), 100);
            }
            
            // 2. 타이쿤 / 클리커 엔진 (학급 경영용)
            else if(g.engine === 'tycoon') {
                let level = 1;
                let cost = 50;
                window.clickTycoon = () => {
                    score += level;
                    document.getElementById('score-board').innerText = 'SCORE: '+score;
                    if(score >= cost) {
                        document.getElementById('upgrade-btn').classList.remove('opacity-50', 'pointer-events-none');
                        document.getElementById('upgrade-btn').classList.add('animate-pulse');
                    }
                };
                window.upgradeTycoon = () => {
                    if(score >= cost) {
                        score -= cost; level++; cost = Math.floor(cost * 1.5);
                        document.getElementById('score-board').innerText = 'SCORE: '+score;
                        document.getElementById('tycoon-lvl').innerText = `현재 레벨: ${level} (클릭당 +${level})`;
                        document.getElementById('upgrade-btn').innerText = `🚀 업그레이드 (비용: ${cost})`;
                        document.getElementById('upgrade-btn').classList.add('opacity-50', 'pointer-events-none');
                        document.getElementById('upgrade-btn').classList.remove('animate-pulse');
                    }
                };
                render(`
                    <h2 class="text-2xl font-bold text-cyan-400 mb-2">${g.title}</h2>
                    <p id="tycoon-lvl" class="text-slate-400 mb-6">현재 레벨: ${level} (클릭당 +${level})</p>
                    <button onclick="clickTycoon()" class="text-7xl md:text-9xl mb-8 active:scale-90 transition transform select-none">${g.emoji}</button>
                    <button id="upgrade-btn" onclick="upgradeTycoon()" class="px-6 py-3 bg-emerald-600 rounded-xl font-bold text-lg opacity-50 pointer-events-none transition">🚀 업그레이드 (비용: ${cost})</button>
                `);
            }

            // 3. 무작위 뽑기 엔진 (사다리, 룰렛 대용)
            else if(g.engine === 'ladder' || g.engine === 'roulette' || g.engine === 'draw') {
                const results = ["청소 당번!", "숙제 면제권!", "아이스크림 쏘기!", "간식 당첨!", "발표자 당첨!", "무사 통과!"];
                window.rollRandom = () => {
                    const btn = document.getElementById('rand-btn');
                    const res = document.getElementById('rand-res');
                    btn.disabled = true; btn.innerText = "추첨 중...";
                    let count = 0;
                    let mix = setInterval(() => {
                        res.innerText = results[Math.floor(Math.random() * results.length)];
                        count++;
                        if(count > 15) {
                            clearInterval(mix);
                            btn.disabled = false; btn.innerText = "다시 뽑기";
                            res.className = "text-3xl font-bold text-yellow-400 animate-bounce mt-6";
                        }
                    }, 100);
                };
                render(`
                    <span class="text-6xl mb-4">${g.engine==='roulette'?'🎰':'🪜'}</span>
                    <h2 class="text-2xl font-bold text-emerald-400 mb-6">${g.title}</h2>
                    <button id="rand-btn" onclick="rollRandom()" class="px-8 py-4 bg-indigo-600 rounded-xl font-bold text-xl shadow-lg">추첨 시작!</button>
                    <div id="rand-res" class="text-2xl text-slate-500 mt-6">대기 중...</div>
                `);
            }

            // 4. 숫자 야구
            else if(g.engine === 'baseball') {
                let secret = "";
                while(secret.length < 3) { let r = Math.floor(Math.random()*9)+1; if(!secret.includes(r.toString())) secret+=r; }
                let tries = 0;
                window.guessBaseball = () => {
                    let val = document.getElementById('bb-input').value;
                    if(val.length !== 3) { triggerSuccess("3자리 숫자를 입력하세요!", 0); return; }
                    tries++;
                    if(val === secret) { triggerSuccess(`🎉 ${tries}번 만에 홈런!`, 100); return; }
                    let s=0, b=0;
                    for(let i=0;i<3;i++){ if(val[i]===secret[i]) s++; else if(secret.includes(val[i])) b++; }
                    let log = document.getElementById('bb-log');
                    log.innerHTML = `<p>${tries}차 시도 [${val}] : <span class="text-yellow-400">${s}S</span> <span class="text-cyan-400">${b}B</span></p>` + log.innerHTML;
                    document.getElementById('bb-input').value = '';
                };
                render(`
                    <h2 class="text-xl font-bold text-yellow-400 mb-2">숫자 야구</h2>
                    <p class="text-xs text-slate-400 mb-4">서로 다른 3자리 숫자를 맞추세요 (1~9)</p>
                    <div class="flex gap-2 w-full max-w-xs mb-4">
                        <input id="bb-input" type="number" class="bg-slate-800 border-2 border-slate-600 px-3 py-2 rounded-lg text-center text-xl w-full" placeholder="123">
                        <button onclick="guessBaseball()" class="bg-indigo-600 px-4 py-2 rounded-lg font-bold whitespace-nowrap">던지기</button>
                    </div>
                    <div id="bb-log" class="text-sm space-y-1 h-32 overflow-y-auto w-full max-w-xs border border-slate-700 p-2 rounded bg-slate-900"></div>
                `);
            }

            // 5. 스톱워치 1초 맞추기
            else if(g.engine === 'stopwatch') {
                let st = 0;
                window.handleSW = () => {
                    let btn = document.getElementById('sw-btn');
                    let msg = document.getElementById('sw-msg');
                    if(st === 0) {
                        st = Date.now();
                        btn.innerText = "스톱!!"; btn.className = "px-10 py-10 bg-red-600 rounded-full font-bold text-3xl shadow-xl active:scale-95";
                        msg.innerText = "측정 중...";
                    } else {
                        let diff = Math.abs((Date.now() - st) - 1000);
                        let pts = Math.max(0, 100 - diff);
                        triggerSuccess(`차이: ${diff}ms\n획득 점수: ${pts}`, pts);
                        st = 0;
                    }
                };
                render(`
                    <h2 class="text-2xl font-bold text-emerald-400 mb-4">1.00초 맞추기</h2>
                    <p id="sw-msg" class="text-slate-300 mb-8">버튼을 누르고 마음속으로 1초를 센 뒤 다시 누르세요.</p>
                    <button id="sw-btn" onclick="handleSW()" class="px-10 py-10 bg-indigo-600 rounded-full font-bold text-3xl shadow-xl active:scale-95 transition">시작</button>
                `);
            }

            // 6. 카드 짝맞추기 (메모리)
            else if(g.engine === 'memory') {
                const isAnimal = g.skin === 'animal';
                let baseIcons = isAnimal ? ['🐶','🐱','🐭','🐰','🦊','🐻'] : ['🍎','🍌','🍇','🍉','🍓','🍒'];
                let cards = [...baseIcons, ...baseIcons].sort(() => Math.random() - 0.5);
                let flipped = [], matched = 0;
                
                window.flipCard = (idx) => {
                    let btn = document.getElementById('card-'+idx);
                    if(btn.innerText !== '?' || flipped.length >= 2) return;
                    btn.innerText = cards[idx];
                    btn.classList.add('bg-slate-600');
                    flipped.push({idx, icon: cards[idx]});
                    
                    if(flipped.length === 2) {
                        setTimeout(() => {
                            if(flipped[0].icon === flipped[1].icon) {
                                matched += 2; score += 20; document.getElementById('score-board').innerText = 'SCORE: '+score;
                                if(matched === cards.length) triggerSuccess('모든 카드를 찾았습니다!', 50);
                            } else {
                                document.getElementById('card-'+flipped[0].idx).innerText = '?';
                                document.getElementById('card-'+flipped[0].idx).classList.remove('bg-slate-600');
                                document.getElementById('card-'+flipped[1].idx).innerText = '?';
                                document.getElementById('card-'+flipped[1].idx).classList.remove('bg-slate-600');
                            }
                            flipped = [];
                        }, 500);
                    }
                };
                
                let gridHtml = '<div class="grid grid-cols-4 gap-2 w-full max-w-[300px]">';
                cards.forEach((c, i) => {
                    gridHtml += `<button id="card-${i}" onclick="flipCard(${i})" class="w-full aspect-[3/4] bg-slate-800 hover:bg-slate-700 text-3xl rounded-xl flex items-center justify-center font-bold shadow transition">?</button>`;
                });
                gridHtml += '</div>';
                render(`<h2 class="text-xl font-bold text-pink-400 mb-4">${g.title}</h2>` + gridHtml);
            }

            // 7. 피아노 건반
            else if(g.engine === 'piano') {
                window.playNote = (note) => {
                    score += 5; document.getElementById('score-board').innerText = 'SCORE: '+score;
                    const c = document.getElementById('piano-display');
                    c.innerText = `🎵 ${note}`; c.classList.remove('animate-ping'); void c.offsetWidth; c.classList.add('animate-ping');
                };
                render(`
                    <div id="piano-display" class="text-4xl font-bold text-cyan-400 mb-8 h-12">🎵</div>
                    <div class="flex gap-1">
                        ${['도','레','미','파','솔','라','시','도'].map(n => 
                            `<button onclick="playNote('${n}')" class="w-10 h-32 md:w-12 md:h-40 bg-white text-black font-bold text-sm md:text-base rounded-b-lg flex items-end justify-center pb-4 active:bg-slate-200 active:scale-y-95 origin-top shadow-lg border border-slate-300 transition">${n}</button>`
                        ).join('')}
                    </div>
                `);
            }

            // 8. 미로 찾기 (간단한 그리드 이동)
            else if(g.engine === 'maze') {
                let px=0, py=0;
                window.moveMaze = (dx, dy) => {
                    let nx = px+dx, ny = py+dy;
                    if(nx>=0 && nx<5 && ny>=0 && ny<5) {
                        document.getElementById(`cell-${py}-${px}`).innerText = '';
                        px = nx; py = ny;
                        document.getElementById(`cell-${py}-${px}`).innerText = '🚶‍♂️';
                        if(px===4 && py===4) triggerSuccess('미로 탈출 성공!', 100);
                    }
                };
                let grid = '<div class="grid grid-cols-5 gap-1 bg-slate-800 p-2 rounded-lg mb-4">';
                for(let y=0;y<5;y++){ for(let x=0;x<5;x++){
                    grid += `<div id="cell-${y}-${x}" class="w-10 h-10 md:w-12 md:h-12 bg-slate-700 rounded flex items-center justify-center text-2xl">${x===4&&y===4?'🏁':(x===0&&y===0?'🚶‍♂️':'')}</div>`;
                }}
                grid += '</div>';
                render(`
                    <h2 class="text-xl font-bold text-cyan-400 mb-4">미로 탈출</h2>
                    ${grid}
                    <div class="grid grid-cols-3 gap-1 w-32">
                        <div></div><button onclick="moveMaze(0,-1)" class="bg-indigo-600 p-3 rounded">🔼</button><div></div>
                        <button onclick="moveMaze(-1,0)" class="bg-indigo-600 p-3 rounded">◀️</button><button onclick="moveMaze(0,1)" class="bg-indigo-600 p-3 rounded">🔽</button><button onclick="moveMaze(1,0)" class="bg-indigo-600 p-3 rounded">▶️</button>
                    </div>
                `);
            }

            // 9. 기타 단순 UI 게임 로직
            else {
                render(`
                    <span class="text-6xl mb-4">🎮</span>
                    <h2 class="text-2xl font-bold text-yellow-400 mb-2">${g.title}</h2>
                    <p class="text-slate-300 mb-6">${g.desc}</p>
                    <button onclick="triggerSuccess('멋지게 플레이했습니다!', 50)" class="px-8 py-3 bg-emerald-600 rounded-xl font-bold text-lg shadow-lg">액션 실행하기</button>
                `);
            }
        }

        window.onload = () => {
            initMenu();
            loadMainScreen();
        };
    </script>
</body>
</html>
