<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>엽쌤스쿨 - 100선 레트로 게임 센터</title>
    <!-- 귀여운 둥근 폰트 적용 -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Jua', sans-serif; overflow: hidden; touch-action: manipulation; background-color: #0f172a; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 10px; }
        .btn-press:active { transform: scale(0.92); }
        .prevent-select { -webkit-user-select: none; user-select: none; }
        input, textarea { -webkit-user-select: text; user-select: text; }

        /* 모바일 화면 찌그러짐 방지 캔버스 최적화 */
        #game-container { display: flex; align-items: center; justify-content: center; background-color: #000; }
        #game-container.dom-mode { max-height: none !important; aspect-ratio: auto !important; }
        canvas { touch-action: none; outline: none; background-color: #020617; max-width: 100%; max-height: 100%; object-fit: contain; }
        .no-touch { touch-action: none; }

        /* 공용 애니메이션 */
        @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }
        .shake { animation: shake .35s; }
        @keyframes pop { 0%{transform:scale(.4);opacity:0} 70%{transform:scale(1.12);opacity:1} 100%{transform:scale(1)} }
        .pop { animation: pop .25s ease-out; }
        @keyframes floatUp { 0%{transform:translate(-50%,0);opacity:1} 100%{transform:translate(-50%,-50px);opacity:0} }
        .float-txt { position:absolute; pointer-events:none; font-weight:bold; animation: floatUp .8s ease-out forwards; white-space:nowrap; z-index:30; text-shadow:0 2px 4px #000; }
        @keyframes wobble { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-12deg)} 75%{transform:rotate(12deg)} }
        .wobble { animation: wobble .4s infinite; }
        .flip-card { perspective: 600px; }
        .flip-inner { position:relative; width:100%; height:100%; transition: transform .35s; transform-style: preserve-3d; }
        .flip-card.open .flip-inner { transform: rotateY(180deg); }
        .flip-face { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; display:flex; align-items:center; justify-content:center; border-radius:.75rem; }
        .flip-back { transform: rotateY(180deg); }
        .pip { width: 22%; aspect-ratio: 1; border-radius: 50%; background: #0f172a; }
        .timebar { transition: width .1s linear; }
    </style>
</head>
<body class="text-white h-[100dvh] flex flex-col select-none prevent-select">

    <header class="bg-slate-900 border-b border-slate-800 p-2 md:p-3 text-center shadow-lg flex justify-between items-center px-4 md:px-8 shrink-0 gap-2">
        <div class="flex items-center gap-2 cursor-pointer min-w-0" id="btn-header-main">
            <span class="text-2xl md:text-3xl">🕹️</span>
            <h1 class="text-lg md:text-2xl font-black text-yellow-400 tracking-wider truncate">엽쌤스쿨 게임 센터 100</h1>
        </div>
        <div class="flex gap-2 shrink-0">
            <button id="btn-sound" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs md:text-sm rounded-lg transition font-bold shadow-lg border border-slate-700" title="소리 켜기/끄기">🔊</button>
            <button id="btn-top-main" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs md:text-sm rounded-lg transition text-cyan-400 font-bold shadow-lg border border-slate-700 whitespace-nowrap">🏠 메인 (목록)</button>
        </div>
    </header>

    <main class="flex-1 w-full mx-auto p-2 flex flex-col lg:flex-row gap-2 md:gap-4 overflow-hidden max-w-7xl relative">

        <aside id="menu-view" class="bg-slate-900 p-3 rounded-xl border border-slate-800 w-full lg:w-1/3 h-full overflow-hidden shadow-inner flex flex-col transition-all duration-300">
            <div class="text-center mb-2 shrink-0">
                <h2 class="text-lg md:text-xl font-bold text-cyan-400 uppercase tracking-wider bg-slate-900 py-1 border-b border-slate-700">🎮 100선 게임 목록</h2>
            </div>
            <input id="menu-search" type="text" placeholder="🔍 게임 이름 검색" class="shrink-0 mb-2 w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-400">
            <div id="game-menu" class="space-y-3 pb-10 flex-1 overflow-y-auto pr-1"></div>
        </aside>

        <section id="game-view" class="hidden lg:flex bg-slate-900 p-2 md:p-4 rounded-xl border border-slate-800 flex-1 flex-col items-center justify-between shadow-xl relative w-full h-full transition-all duration-300 min-h-0">

            <div class="text-center w-full shrink-0 mb-1 h-10 md:h-14">
                <div id="game-title" class="text-lg md:text-2xl font-bold text-emerald-400 truncate">게임을 골라주세요</div>
                <div id="game-info" class="text-[10px] md:text-sm text-slate-400 mt-0.5 truncate">왼쪽 목록에서 게임을 선택하세요.</div>
            </div>

            <div id="game-container" class="w-full flex-1 aspect-square max-h-[50vh] md:max-h-[60vh] lg:max-h-full border border-slate-700 relative rounded-lg shadow-2xl overflow-hidden min-h-[250px]">
            </div>

            <div id="game-modal" class="hidden absolute inset-0 bg-black/90 flex flex-col items-center justify-center z-50 p-4 backdrop-blur-sm rounded-xl">
                <h2 id="modal-title" class="text-3xl md:text-5xl font-bold text-yellow-400 mb-4 text-center">게임 오버!</h2>
                <p id="modal-desc" class="text-lg md:text-2xl text-white mb-2 text-center whitespace-pre-line">최종 점수: 0</p>
                <p id="modal-best" class="text-base md:text-lg text-yellow-300 mb-8 text-center"></p>
                <div class="flex gap-3 md:gap-4">
                    <button id="btn-modal-retry" class="px-5 py-3 md:px-8 md:py-4 bg-emerald-600 rounded-xl font-bold text-base md:text-xl shadow-[0_4px_0_rgb(4,120,87)] active:translate-y-1 active:shadow-none transition">다시 하기</button>
                    <button id="btn-modal-main" class="px-5 py-3 md:px-8 md:py-4 bg-slate-700 rounded-xl font-bold text-base md:text-xl shadow-[0_4px_0_rgb(51,65,85)] active:translate-y-1 active:shadow-none transition">메인으로</button>
                </div>
            </div>

            <div class="w-full shrink-0 flex flex-col items-center gap-1 mt-1 mb-1">
                <div class="flex items-baseline gap-4">
                    <div id="score-board" class="text-lg md:text-2xl font-bold text-yellow-400 leading-none">SCORE: 0</div>
                    <div id="best-board" class="text-xs md:text-base font-bold text-slate-400 leading-none"></div>
                </div>
                <div id="mobile-controls" class="hidden grid-cols-3 grid-rows-2 gap-1 w-[160px] md:w-[220px] mt-1">
                    <div></div><button id="btn-up" class="btn-press bg-slate-800 rounded-lg p-2 md:p-3 flex items-center justify-center text-xl md:text-3xl border-b-4 border-slate-900 text-slate-300 no-touch">🔼</button><div></div>
                    <button id="btn-left" class="btn-press bg-slate-800 rounded-lg p-2 md:p-3 flex items-center justify-center text-xl md:text-3xl border-b-4 border-slate-900 text-slate-300 no-touch">◀️</button>
                    <button id="btn-down" class="btn-press bg-slate-800 rounded-lg p-2 md:p-3 flex items-center justify-center text-xl md:text-3xl border-b-4 border-slate-900 text-slate-300 no-touch">🔽</button>
                    <button id="btn-right" class="btn-press bg-slate-800 rounded-lg p-2 md:p-3 flex items-center justify-center text-xl md:text-3xl border-b-4 border-slate-900 text-slate-300 no-touch">▶️</button>
                </div>
                <button id="btn-action" class="hidden btn-press mt-1 w-[160px] md:w-[220px] bg-indigo-600 rounded-lg py-2 md:py-3 text-sm md:text-xl font-bold border-b-4 border-indigo-900 text-white no-touch">🔥 ACTION</button>
            </div>
        </section>
    </main>

    <script>
        // ==========================================
        // 0. 공용 유틸리티
        // ==========================================
        const $ = id => document.getElementById(id);
        const container = $('game-container');
        const modal = $('game-modal');
        const mobileControls = $('mobile-controls');
        const actionControl = $('btn-action');
        const menuView = $('menu-view');
        const gameView = $('game-view');

        const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;          // a~b 정수
        const pick = arr => arr[Math.floor(Math.random() * arr.length)];
        const shuffle = arr => { const a = [...arr]; for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const hearts = (n, max) => '❤️'.repeat(Math.max(0, n)) + (max ? '🤍'.repeat(Math.max(0, max - n)) : '');

        // 기록 저장 (브라우저 저장소가 막혀 있어도 게임은 정상 동작)
        const store = {
            get(k, d){ try { const v = localStorage.getItem('yeop100:' + k); return v === null ? d : JSON.parse(v); } catch(e) { return d; } },
            set(k, v){ try { localStorage.setItem('yeop100:' + k, JSON.stringify(v)); } catch(e) {} }
        };

        // ==========================================
        // 1. 효과음 (Web Audio, 파일 불필요)
        // ==========================================
        let actx = null, soundOn = store.get('sound', true);
        function audio(){ try { if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if(actx.state === 'suspended') actx.resume(); return actx; } catch(e) { return null; } }
        function tone(freq, dur = 0.1, type = 'square', vol = 0.05, when = 0){
            if(!soundOn) return; const ac = audio(); if(!ac) return;
            try {
                const t = ac.currentTime + when, o = ac.createOscillator(), gn = ac.createGain();
                o.type = type; o.frequency.setValueAtTime(freq, t);
                gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                o.connect(gn); gn.connect(ac.destination); o.start(t); o.stop(t + dur + 0.05);
            } catch(e) {}
        }
        const sfx = {
            tick: () => tone(1200, .03, 'square', .02),
            hit:  () => tone(660, .06, 'square', .04),
            pop:  () => tone(880, .07, 'triangle', .08),
            good: () => { tone(523, .08, 'sine', .08); tone(784, .14, 'sine', .08, .08); },
            coin: () => { tone(988, .06, 'square', .035); tone(1319, .16, 'square', .035, .06); },
            bad:  () => tone(140, .25, 'sawtooth', .06),
            boom: () => { tone(90, .35, 'sawtooth', .08); tone(60, .4, 'square', .05, .05); },
            jump: () => { tone(400, .08, 'square', .03); tone(600, .08, 'square', .03, .05); },
            over: () => { tone(392, .16, 'sawtooth', .05); tone(330, .16, 'sawtooth', .05, .16); tone(262, .35, 'sawtooth', .05, .32); },
            win:  () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, .18, 'square', .045, i * .1)); },
        };
        const noteFreq = midi => 440 * Math.pow(2, (midi - 69) / 12);

        function refreshSoundBtn(){ $('btn-sound').textContent = soundOn ? '🔊' : '🔇'; }
        $('btn-sound').addEventListener('click', () => { soundOn = !soundOn; store.set('sound', soundOn); refreshSoundBtn(); if(soundOn) sfx.coin(); });
        refreshSoundBtn();

        // ==========================================
        // 2. 게임 실행 수명주기 (타이머/이벤트 누수 방지)
        // ==========================================
        let G = null;                 // 현재 실행 중인 게임 런타임
        let score = 0, currentId = null;

        function halt(){
            if(!G) return;
            G.alive = false;
            G.iv.forEach(clearInterval); G.iv = [];
            G.to.forEach(clearTimeout); G.to = [];
            if(G.raf) cancelAnimationFrame(G.raf); G.raf = 0;
        }
        function stopGame(){
            if(!G) return;
            halt();
            G.ls.forEach(([t, e, f, o]) => t.removeEventListener(e, f, o));
            G.cleanup.forEach(f => { try { f(); } catch(e) {} });
            G = null; resetKeys(); stopRepeat();
        }
        function newRuntime(game){
            stopGame();
            G = { game, alive: true, over: false, iv: [], to: [], ls: [], cleanup: [], raf: 0, onPress: null };
            return G;
        }
        function every(fn, ms){ const g = G; const id = setInterval(() => { if(g.alive) fn(); }, ms); g.iv.push(id); return id; }
        function after(fn, ms){ const g = G; const id = setTimeout(() => { if(g.alive) fn(); }, ms); g.to.push(id); return id; }
        function listen(t, e, f, o){ t.addEventListener(e, f, o); G.ls.push([t, e, f, o]); }
        const wait = ms => new Promise(res => after(res, ms));

        // 고정 60fps 게임 루프 (고주사율 모니터에서도 같은 속도)
        function loop(step, draw){
            const g = G, STEP = 1000 / 60; let last = performance.now(), acc = 0;
            const frame = now => {
                if(!g.alive) return;
                acc += Math.min(100, now - last); last = now;
                while(acc >= STEP){ step(); acc -= STEP; if(!g.alive) break; }
                draw();
                if(g.alive) g.raf = requestAnimationFrame(frame);
            };
            g.raf = requestAnimationFrame(frame);
        }

        // ==========================================
        // 3. 점수 / 최고 기록 / 결과 모달
        // ==========================================
        function setScore(v){ score = Math.round(v); $('score-board').textContent = 'SCORE: ' + score; }
        function addScore(n){ setScore(score + n); }
        function showBest(){
            const g = gameDefs.find(x => x.id === currentId);
            const b = currentId ? store.get('best:' + currentId, null) : null;
            $('best-board').textContent = (g && !g.noScore && b !== null) ? '🏆 BEST: ' + b : '';
        }
        function endGame(isWin, title, msg){
            if(!G || G.over) return;
            G.over = true; halt(); resetKeys(); stopRepeat();
            const prev = store.get('best:' + currentId, null);
            let bestMsg = '';
            if(score > 0 && (prev === null || score > prev)){ store.set('best:' + currentId, score); bestMsg = prev === null ? '🏆 첫 기록 저장!' : `🎉 최고 기록 경신! (이전 ${prev})`; }
            else if(prev !== null) bestMsg = '🏆 최고 기록: ' + prev;
            showBest();
            const t = $('modal-title');
            t.textContent = title;
            t.className = 'text-3xl md:text-5xl font-bold mb-2 md:mb-4 text-center ' + (isWin ? 'text-emerald-400' : 'text-red-500');
            $('modal-desc').textContent = msg;
            $('modal-best').textContent = bestMsg;
            modal.classList.remove('hidden');
            (isWin ? sfx.win : sfx.over)();
        }
        const gameOver = (msg) => endGame(false, '게임 오버!', msg || '최종 점수: ' + score);
        const win = (msg) => endGame(true, '성공!', msg || '최종 점수: ' + score);
        const finish = (msg) => endGame(true, '시간 종료!', msg || '최종 점수: ' + score);
        function closeModal(){ modal.classList.add('hidden'); }

        // 화면 위에 잠깐 떠오르는 점수 텍스트
        function floatText(parent, text, x, y, color = '#facc15', size = 22){
            const d = document.createElement('div'); d.className = 'float-txt'; d.textContent = text;
            d.style.left = x + 'px'; d.style.top = y + 'px'; d.style.color = color; d.style.fontSize = size + 'px';
            parent.appendChild(d); setTimeout(() => d.remove(), 800);
        }
        function shakeEl(el){ if(!el) return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

        // ==========================================
        // 4. 입력 처리 (키보드 + 모바일 버튼, 스크롤 튐 방지)
        // ==========================================
        const keys = { up: false, down: false, left: false, right: false, action: false };
        const taps = { up: false, down: false, left: false, right: false, action: false };
        const keyMap = { ArrowUp:'up', w:'up', W:'up', ArrowDown:'down', s:'down', S:'down', ArrowLeft:'left', a:'left', A:'left', ArrowRight:'right', d:'right', D:'right', ' ':'action' };
        function resetKeys(){ for(const k in keys){ keys[k] = false; taps[k] = false; } }
        function tap(k){ if(taps[k]){ taps[k] = false; return true; } return false; }
        const isTyping = () => { const el = document.activeElement; return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT'); };

        window.addEventListener('keydown', e => {
            if(isTyping()) return;
            const k = keyMap[e.key];
            if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
            if(!k || !G || G.over) return;
            if(!keys[k]) taps[k] = true;
            keys[k] = true;
            if(G.onPress) G.onPress(k, e);
        }, {passive: false});
        window.addEventListener('keyup', e => { const k = keyMap[e.key]; if(k) keys[k] = false; });
        window.addEventListener('blur', resetKeys);

        // 모바일 버튼: 누르고 있으면 방향 입력이 반복됨 (미로, 소코반 등)
        let repeatTimer = null;
        function stopRepeat(){ if(repeatTimer){ clearTimeout(repeatTimer); clearInterval(repeatTimer); repeatTimer = null; } }
        const bindBtn = (id, key) => {
            const btn = $(id); if(!btn) return;
            const press = e => {
                e.preventDefault(); audio();
                if(!G || G.over) return;
                if(!keys[key]) taps[key] = true; keys[key] = true; btn.classList.add('bg-slate-600');
                if(G.onPress){
                    G.onPress(key, e); stopRepeat();
                    if(key !== 'action') repeatTimer = setTimeout(() => { repeatTimer = setInterval(() => { if(G && G.onPress && keys[key]) G.onPress(key, e); else stopRepeat(); }, 130); }, 320);
                }
            };
            const release = e => { e.preventDefault(); keys[key] = false; btn.classList.remove('bg-slate-600'); stopRepeat(); };
            btn.addEventListener('pointerdown', press);
            ['pointerup','pointerleave','pointercancel'].forEach(ev => btn.addEventListener(ev, release));
            btn.addEventListener('contextmenu', e => e.preventDefault());
        };
        bindBtn('btn-up', 'up'); bindBtn('btn-down', 'down'); bindBtn('btn-left', 'left'); bindBtn('btn-right', 'right'); bindBtn('btn-action', 'action');

        // 게임별 화면 컨트롤 표시: 'dpad' | 'action' | 'both' | 'none'
        function setControls(ctl, actionLabel){
            const showPad = ctl === 'dpad' || ctl === 'both', showAct = ctl === 'action' || ctl === 'both';
            mobileControls.classList.toggle('hidden', !showPad); mobileControls.classList.toggle('grid', showPad);
            actionControl.classList.toggle('hidden', !showAct);
            actionControl.textContent = actionLabel || '🔥 ACTION';
        }

        // ==========================================
        // 5. 캔버스 / DOM 도우미
        // ==========================================
        function makeCanvas(w = 480, h = 480){
            container.innerHTML = `<canvas id="cv" width="${w}" height="${h}" class="rounded-lg shadow-inner"></canvas>`;
            const cv = $('cv');
            return { cv, ctx: cv.getContext('2d'), w, h };
        }
        function canvasPos(cv, e){
            const r = cv.getBoundingClientRect(), p = (e.touches && e.touches[0]) || e;
            return { x: (p.clientX - r.left) * cv.width / r.width, y: (p.clientY - r.top) * cv.height / r.height };
        }
        const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
        function emo(ctx, e, x, y, size, rot = 0, flip = false){
            ctx.save(); ctx.translate(x, y); if(rot) ctx.rotate(rot); if(flip) ctx.scale(-1, 1);
            ctx.font = `${size}px ${EMOJI_FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(e, 0, 0); ctx.restore();
        }
        function txt(ctx, s, x, y, color = '#fff', size = 18, align = 'left', base = 'top'){
            ctx.fillStyle = color; ctx.font = `${size}px Jua, sans-serif`; ctx.textAlign = align; ctx.textBaseline = base; ctx.fillText(s, x, y);
        }
        function rrect(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
        // 캔버스 화면 중앙 안내 문구 (시작 대기, 일시 메시지)
        function banner(ctx, w, h, title, sub){
            ctx.fillStyle = 'rgba(2,6,23,.65)'; ctx.fillRect(0, h / 2 - 50, w, sub ? 100 : 70);
            txt(ctx, title, w / 2, h / 2 - 38, '#facc15', 30, 'center');
            if(sub) txt(ctx, sub, w / 2, h / 2 + 8, '#e2e8f0', 16, 'center');
        }
        function makeWrap(extra = ''){
            container.innerHTML = `<div id="dom-wrapper" class="w-full h-full flex flex-col items-center justify-center p-2 md:p-4 text-center overflow-y-auto bg-slate-950 rounded-xl relative ${extra}"></div>`;
            return $('dom-wrapper');
        }
        // 게임 상단 상태줄 HTML
        const statBar = (items) => `<div class="flex flex-wrap justify-center gap-2 mb-3 text-sm md:text-base">${items.map(([id, v]) => `<span id="${id}" class="bg-slate-800 px-3 py-1 rounded-full border border-slate-700">${v}</span>`).join('')}</div>`;
        const setTxt = (id, v) => { const el = $(id); if(el) el.textContent = v; };
        const setHTML = (id, v) => { const el = $(id); if(el) el.innerHTML = v; };

        // --- 뱀 게임: 방향 입력 버퍼, 보너스 별, 먹을수록 가속 ---
        E.snake = { canvas: true, ctl: 'dpad', run(g){
            const { ctx, w, h } = makeCanvas(); const N = 20, S = w / N;
            let snake = [{x:8,y:10},{x:7,y:10},{x:6,y:10}], dir = {x:1,y:0}, q = [], eaten = 0, speed = g.cfg.spd, bonus = null, dead = false, started = false;
            const occupied = p => snake.some(s => s.x === p.x && s.y === p.y);
            const free = () => { let p; do { p = { x: rnd(0, N - 1), y: rnd(0, N - 1) }; } while(occupied(p) || (food && food.x === p.x && food.y === p.y) || (bonus && bonus.x === p.x && bonus.y === p.y)); return p; };
            let food = null; food = free();
            const DIRS = { up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0} };
            G.onPress = k => {
                const d = DIRS[k]; if(!d) return;
                if(!started){ started = true; after(tick, 50); }
                const last = q.length ? q[q.length - 1] : dir;
                if((d.x === -last.x && d.y === -last.y) || (d.x === last.x && d.y === last.y)) return;
                if(q.length < 3) q.push(d);
            };
            const draw = () => {
                for(let y = 0; y < N; y++) for(let x = 0; x < N; x++){ ctx.fillStyle = (x + y) % 2 ? '#0f172a' : '#131c33'; ctx.fillRect(x * S, y * S, S, S); }
                emo(ctx, '🍎', food.x * S + S / 2, food.y * S + S / 2 + 1, S * .85);
                if(bonus && (bonus.t > 15 || bonus.t % 4 < 2)) emo(ctx, '⭐', bonus.x * S + S / 2, bonus.y * S + S / 2 + 1, S * .9);
                snake.forEach((s, i) => {
                    const t = i / Math.max(1, snake.length - 1);
                    ctx.fillStyle = dead ? '#64748b' : `hsl(${140 - t * 40}, 75%, ${50 - t * 15}%)`;
                    rrect(ctx, s.x * S + 1, s.y * S + 1, S - 2, S - 2, i === 0 ? 8 : 5); ctx.fill();
                });
                const hd = snake[0], cx = hd.x * S + S / 2, cy = hd.y * S + S / 2;
                ctx.fillStyle = '#fff';
                [[-1, 1], [1, 1]].forEach(([a]) => { const ex = cx + dir.x * 4 + (dir.y ? a * 5 : 0), ey = cy + dir.y * 4 + (dir.x ? a * 5 : 0); ctx.beginPath(); ctx.arc(ex, ey, 3.2, 0, 7); ctx.fill(); });
                txt(ctx, `길이 ${snake.length}`, 8, 6, '#94a3b8', 16);
                if(!started) banner(ctx, w, h, '방향키를 누르면 시작!', '사과 🍎 +10 · 별 ⭐ +50 (5개마다 등장)');
            };
            const tick = () => {
                if(q.length) dir = q.shift();
                const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
                const eat = head.x === food.x && head.y === food.y;
                const body = eat ? snake : snake.slice(0, -1);
                if(head.x < 0 || head.y < 0 || head.x >= N || head.y >= N || body.some(s => s.x === head.x && s.y === head.y)){
                    dead = true; draw(); sfx.bad(); return gameOver(`길이 ${snake.length} · 점수 ${score}`);
                }
                snake.unshift(head);
                if(eat){
                    eaten++; addScore(10); sfx.coin(); food = free();
                    if(eaten % 5 === 0) bonus = { ...free(), t: 45 };
                    speed = Math.max(g.cfg.spd * 0.55, speed - 2.5);
                } else snake.pop();
                if(bonus && head.x === bonus.x && head.y === bonus.y){ addScore(50); sfx.win(); bonus = null; }
                if(bonus && --bonus.t <= 0) bonus = null;
                draw(); after(tick, speed);
            };
            draw();
        }};

        // --- 퐁: 컴퓨터 AI 대전, 7점 선승, 맞은 위치에 따라 각도 변화 ---
        E.pong = { canvas: true, ctl: 'dpad', run(g){
            const { ctx, w, h } = makeCanvas(); const PH = 80, PW = 12, WIN = 7, base = 4.6 * g.cfg.spd;
            let py = h / 2 - PH / 2, cy = h / 2 - PH / 2, ps = 0, cs = 0, ball, serveT = 0, cpuErr = 0, rally = 0, msg = '';
            const cpuSpd = 3.4 + g.cfg.spd * 1.6;
            const serve = dirX => { const a = Math.random() * .8 - .4; ball = { x: w / 2, y: h / 2, vx: dirX * base * Math.cos(a), vy: base * Math.sin(a), sp: base }; serveT = 70; rally = 0; };
            serve(1);
            const cv = $('cv');
            listen(cv, 'pointermove', e => { if(e.pointerType !== 'mouse' || e.buttons) py = clamp(canvasPos(cv, e).y - PH / 2, 0, h - PH); });
            listen(cv, 'pointerdown', e => { py = clamp(canvasPos(cv, e).y - PH / 2, 0, h - PH); });
            loop(() => {
                if(keys.up) py -= 7; if(keys.down) py += 7; py = clamp(py, 0, h - PH);
                const target = ball.vx > 0 ? ball.y - PH / 2 + cpuErr : h / 2 - PH / 2;
                cy += clamp(target - cy, -cpuSpd, cpuSpd); cy = clamp(cy, 0, h - PH);
                if(serveT > 0){ serveT--; return; }
                ball.x += ball.vx; ball.y += ball.vy;
                if(ball.y < 7){ ball.y = 7; ball.vy = Math.abs(ball.vy); sfx.tick(); }
                if(ball.y > h - 7){ ball.y = h - 7; ball.vy = -Math.abs(ball.vy); sfx.tick(); }
                const bounce = (padY, dirX) => {
                    const rel = clamp((ball.y - (padY + PH / 2)) / (PH / 2), -1, 1), ang = rel * 1.0;
                    ball.sp = Math.min(ball.sp * 1.06, base * 2.3);
                    ball.vx = dirX * Math.cos(ang) * ball.sp; ball.vy = Math.sin(ang) * ball.sp; sfx.hit(); rally++;
                };
                if(ball.vx < 0 && ball.x - 7 <= 20 + PW && ball.x > 14 && ball.y > py - 7 && ball.y < py + PH + 7){ ball.x = 20 + PW + 7; bounce(py, 1); addScore(10); cpuErr = rnd(-42, 42); }
                if(ball.vx > 0 && ball.x + 7 >= w - 20 - PW && ball.x < w - 14 && ball.y > cy - 7 && ball.y < cy + PH + 7){ ball.x = w - 20 - PW - 7; bounce(cy, -1); }
                if(ball.x < -20){ cs++; sfx.bad(); msg = '실점...'; if(cs >= WIN) return gameOver(`${ps} : ${cs} 패배... 점수 ${score}`); serve(1); }
                if(ball.x > w + 20){ ps++; addScore(100); sfx.good(); msg = '득점!'; if(ps >= WIN){ addScore((WIN - cs) * 50); return win(`${ps} : ${cs} 승리! 점수 ${score}`); } serve(-1); }
            }, () => {
                ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, w, h);
                ctx.strokeStyle = '#334155'; ctx.setLineDash([10, 12]); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(w / 2, 0); ctx.lineTo(w / 2, h); ctx.stroke(); ctx.setLineDash([]);
                txt(ctx, ps, w / 2 - 60, 16, '#38bdf8', 48, 'center'); txt(ctx, cs, w / 2 + 60, 16, '#f472b6', 48, 'center');
                txt(ctx, 'YOU', w / 2 - 60, 68, '#64748b', 14, 'center'); txt(ctx, 'CPU', w / 2 + 60, 68, '#64748b', 14, 'center');
                ctx.fillStyle = '#38bdf8'; rrect(ctx, 20, py, PW, PH, 5); ctx.fill();
                ctx.fillStyle = '#f472b6'; rrect(ctx, w - 20 - PW, cy, PW, PH, 5); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ball.x, ball.y, 7, 0, 7); ctx.fill();
                if(rally >= 3) txt(ctx, `랠리 ${rally}`, w / 2, h - 30, '#facc15', 16, 'center');
                if(serveT > 0) banner(ctx, w, h, msg || '준비!', `${WIN}점 먼저 내면 승리 · 랠리 +10 · 득점 +100`);
            });
        }};

        // --- 벽돌깨기: 생명 3, 내구도 벽돌, 아이템(넓은 패들/멀티볼/생명), 스테이지 ---
        E.brick = { canvas: true, ctl: 'both', run(g){
            const { ctx, w, h, cv } = makeCanvas(); const COLS = 8, BW = 54, BH = 18, GAP = 4, OX = (w - (COLS * BW + (COLS - 1) * GAP)) / 2, PY = h - 30;
            let level = 1, lives = 3, pw = 90, px = w / 2 - 45, wideT = 0, balls = [], bricks = [], drops = [], parts = [], msgT = 90;
            const COLORS = ['#38bdf8', '#a78bfa', '#f472b6', '#9ca3af'];
            const speed = () => Math.min(4.8 + level * 0.5, 9);
            const build = () => {
                bricks = []; const rows = Math.min(4 + level, 8), pat = (level - 1) % 4;
                for(let r = 0; r < rows; r++) for(let c = 0; c < COLS; c++){
                    if(pat === 1 && Math.abs(c - 3.5) > rows - r) continue;              // 피라미드
                    if(pat === 2 && (r + c) % 2) continue;                              // 체크무늬
                    if(pat === 3 && (c === 0 || c === COLS - 1) && r % 2) continue;
                    let hp = 1; if(level >= 2 && r < 2) hp = 2; if(level >= 3 && r === 0) hp = 3; if(level >= 5 && r < 3) hp = 3;
                    bricks.push({ x: OX + c * (BW + GAP), y: 50 + r * (BH + GAP), hp, max: hp });
                }
            };
            const newBall = () => { balls = [{ x: px + pw / 2, y: PY - 8, vx: 0, vy: 0, stuck: true }]; };
            build(); newBall();
            const launch = () => balls.forEach(b => { if(b.stuck){ b.stuck = false; const a = (Math.random() * .6 - .3); b.vx = Math.sin(a) * speed(); b.vy = -Math.cos(a) * speed(); } });
            listen(cv, 'pointermove', e => { px = clamp(canvasPos(cv, e).x - pw / 2, 0, w - pw); });
            listen(cv, 'pointerdown', e => { px = clamp(canvasPos(cv, e).x - pw / 2, 0, w - pw); launch(); });
            const hitBrick = (b) => {
                for(const br of bricks){
                    if(b.x + 7 > br.x && b.x - 7 < br.x + BW && b.y + 7 > br.y && b.y - 7 < br.y + BH){
                        br.hp--; addScore(10); sfx.hit();
                        if(br.hp <= 0){
                            addScore(40); bricks.splice(bricks.indexOf(br), 1);
                            for(let i = 0; i < 8; i++) parts.push({ x: br.x + BW / 2, y: br.y + BH / 2, vx: Math.random() * 6 - 3, vy: Math.random() * 6 - 3, t: 30, c: COLORS[br.max - 1] });
                            if(Math.random() < .14) drops.push({ x: br.x + BW / 2, y: br.y, type: pick(['W', 'W', 'M', 'M', 'L']) });
                        }
                        return true;
                    }
                }
                return false;
            };
            loop(() => {
                if(msgT > 0) msgT--;
                if(keys.left) px -= 8; if(keys.right) px += 8;
                if(wideT > 0 && --wideT === 0) pw = 90;
                px = clamp(px, 0, w - pw);
                if(tap('action') || tap('up')) launch();
                for(const b of balls){
                    if(b.stuck){ b.x = px + pw / 2; b.y = PY - 8; continue; }
                    b.x += b.vx; if(b.x < 7 || b.x > w - 7){ b.vx *= -1; b.x = clamp(b.x, 7, w - 7); } if(hitBrick(b)) b.vx *= -1;
                    b.y += b.vy; if(b.y < 7){ b.vy = Math.abs(b.vy); } if(hitBrick(b)) b.vy *= -1;
                    if(b.vy > 0 && b.y + 7 >= PY && b.y < PY + 12 && b.x > px - 6 && b.x < px + pw + 6){
                        const rel = clamp((b.x - (px + pw / 2)) / (pw / 2), -1, 1), a = rel * 1.05, sp = speed();
                        b.vx = Math.sin(a) * sp; b.vy = -Math.cos(a) * sp; b.y = PY - 8; sfx.tick();
                    }
                }
                balls = balls.filter(b => b.y < h + 10);
                if(!balls.length){
                    lives--; sfx.bad();
                    if(lives <= 0) return gameOver(`스테이지 ${level} · 점수 ${score}`);
                    pw = 90; wideT = 0; newBall(); msgT = 60;
                }
                drops.forEach(d => d.y += 3);
                drops = drops.filter(d => {
                    if(d.y > PY - 10 && d.y < PY + 14 && d.x > px && d.x < px + pw){
                        sfx.coin(); addScore(30);
                        if(d.type === 'W'){ pw = 140; wideT = 600; }
                        if(d.type === 'L') lives = Math.min(5, lives + 1);
                        if(d.type === 'M'){ const extra = []; balls.filter(b => !b.stuck).slice(0, 3).forEach(b => { [-0.5, 0.5].forEach(o => { const sp = speed(), a = Math.atan2(b.vx, -b.vy) + o; extra.push({ x: b.x, y: b.y, vx: Math.sin(a) * sp, vy: -Math.cos(a) * sp }); }); }); balls.push(...extra); }

                });
                parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.t--; }); parts = parts.filter(p => p.t > 0);

                txt(ctx, `STAGE ${level}${g.cfg.inf ? '' : '/3'}`, 10, 12, '#94a3b8', 16); txt(ctx, hearts(lives), w - 10, 10, '#fff', 16, 'right');

            });
        }};

        // --- 소행성 피하기: 생명 3, 무적 시간, 별 아이템, 시간에 따라 난이도 상승 ---

                rocks.forEach(r => { r.y += r.vy; r.x += r.vx; r.rot += .05; });
                rocks = rocks.filter(r => { if(r.y > h + 40){ addScore(2); return false; } return true; });
                items.forEach(i => i.y += 2.5);
                items = items.filter(i => { if(Math.hypot(i.x - px, i.y - py) < 30){ sfx.coin(); if(i.type === '⭐') addScore(50); else inv = 300; return false; } return i.y < h + 20; });
                stars.forEach(s => { s.y += s.s * 2; if(s.y > h) { s.y = 0; s.x = Math.random() * w; } });
                if(inv > 0) inv--;

            }, () => {
                ctx.fillStyle = '#020617'; ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = '#cbd5e1'; stars.forEach(s => ctx.fillRect(s.x, s.y, s.s, s.s));
                rocks.forEach(r => emo(ctx, hard ? '☄️' : '🪨', r.x, r.y, r.r * 2, r.rot));
                items.forEach(i => emo(ctx, i.type, i.x, i.y, 28));
                if(inv % 10 < 6){ emo(ctx, '🚀', px, py, 34, -Math.PI / 4); if(inv > 100){ ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(px, py, 26, 0, 7); ctx.stroke(); } }
                txt(ctx, hearts(lives), 10, 10, '#fff', 18); txt(ctx, `${Math.floor(t / 60)}초`, w - 10, 10, '#94a3b8', 18, 'right');

        // --- 받기 게임 (사과 바구니 / 선물 받기): 나쁜 아이템, 황금 아이템, 놓치면 생명 감소 ---
        E.catch = { canvas: true, ctl: 'dpad', run(g){

                fx.forEach(f => { ctx.globalAlpha = f.t / 40; txt(ctx, f.s, f.x, f.y, f.c, 20, 'center'); }); ctx.globalAlpha = 1;

                if(t < 120) banner(ctx, w, h, g.cfg.gift ? '선물을 받아라!' : '사과를 받아라!', `${bad} 은 피하세요 · ${gold} 는 +50`);

        // --- 슈팅 (기본/하드/더블샷/눈싸움): 웨이브, 적 총알, 파워업, 5웨이브마다 보스 ---
        E.shooter = { canvas: true, ctl: 'both', label: '🔥 발사 (누르고 있기)', run(g){
            const { ctx, w, h, cv } = makeCanvas(); const hard = !!g.cfg.hard, ice = !!g.cfg.ice;
            const SK = ice ? { me: '🧒', foes: ['☃️', '⛄'], boss: '🏔️', shot: '#f8fafc', foeShot: '❄️', bg: ['#0c4a6e', '#e0f2fe'] }
                           : { me: '🚀', foes: hard ? ['👾', '👹', '🛸'] : ['👾', '👽', '🛸'], boss: '🐙', shot: '#fbbf24', foeShot: '🔴', bg: ['#020617', '#1e1b4b'] };
            let px = w / 2, lives = 3, inv = 0, cd = 0, bullets = [], foes = [], fbul = [], items = [], parts = [], wave = 0, waveT = 0, power = g.cfg.spread ? 9999999 : 0, t = 0, touching = false;

            const nextWave = () => {
                wave++; waveT = 90;
                if(wave % 5 === 0){ foes.push({ boss: true, x: w / 2, y: -60, hp: 25 + wave * (hard ? 6 : 4), max: 25 + wave * (hard ? 6 : 4), vx: 2, ty: 90, e: SK.boss, r: 42, fire: 0 }); return; }
                const n = 5 + wave * 2;
                for(let i = 0; i < n; i++){
                    const tough = hard ? Math.random() < .5 : Math.random() < Math.min(.4, wave * .06);
                    foes.push({ x: rnd(30, w - 30), y: -40 - i * 45, hp: tough ? (hard ? 3 : 2) : 1, vy: (hard ? 1.1 : .8) + wave * .08, ph: Math.random() * 6, amp: rnd(10, 40), e: tough ? SK.foes[1] : SK.foes[0], r: 18, fire: rnd(60, 240), shooter: hard || Math.random() < wave * .06 });
                }
            };
            const boom = (x, y, c, n = 10) => { for(let i = 0; i < n; i++) parts.push({ x, y, vx: Math.random() * 6 - 3, vy: Math.random() * 6 - 3, t: 28, c }); };
            nextWave();
            loop(() => {
                t++; if(cd > 0) cd--; if(inv > 0) inv--; if(power > 0) power--;
                if(keys.left) px -= 6.5; if(keys.right) px += 6.5; px = clamp(px, 20, w - 20);
                if((keys.action || keys.up || touching) && cd === 0){
                    const y = h - 55; bullets.push({ x: px, y, vx: 0 });
                    if(power > 0){ bullets.push({ x: px - 8, y, vx: -2 }); bullets.push({ x: px + 8, y, vx: 2 }); }
                    cd = hard ? 9 : 11; sfx.tick();
                }
                bullets.forEach(b => { b.y -= 10; b.x += b.vx; }); bullets = bullets.filter(b => b.y > -10 && b.x > -10 && b.x < w + 10);
                stars.forEach(s => { s.y += s.s; if(s.y > h){ s.y = 0; s.x = Math.random() * w; } });
                if(waveT > 0) waveT--;
                for(const f of foes){
                    if(f.boss){
                        if(f.y < f.ty) f.y += 1.5; f.x += f.vx; if(f.x < 60 || f.x > w - 60) f.vx *= -1;
                        if(++f.fire % (hard ? 40 : 55) === 0) for(let a = -2; a <= 2; a++) fbul.push({ x: f.x, y: f.y + 30, vx: a * 1.3, vy: 3.5 });
                    } else {
                        f.y += f.vy; f.ph += .04; f.dx = Math.sin(f.ph) * f.amp * .05; f.x = clamp(f.x + f.dx, 20, w - 20);
                        if(f.shooter && f.y > 0 && --f.fire <= 0){ f.fire = rnd(hard ? 70 : 120, hard ? 150 : 260); const a = Math.atan2(h - 40 - f.y, px - f.x); fbul.push({ x: f.x, y: f.y + 10, vx: Math.cos(a) * 3.2, vy: Math.sin(a) * 3.2 }); }
                    }
                    for(const b of bullets){
                        if(Math.abs(b.x - f.x) < f.r && Math.abs(b.y - f.y) < f.r){
                            boom(b.x, b.y, '#fde68a', 3); b.y = -99; f.hp--; sfx.hit();
                            if(f.hp <= 0){ f.dead = true; addScore(f.boss ? 500 : f.e === SK.foes[1] ? 50 : 30); boom(f.x, f.y, f.boss ? '#f472b6' : '#a78bfa', f.boss ? 40 : 12); sfx.pop(); if(f.boss){ items.push({ x: f.x, y: f.y, type: '❤️' }); sfx.win(); } else if(Math.random() < .07) items.push({ x: f.x, y: f.y, type: Math.random() < .7 ? '⚡' : '❤️' }); }
                            break;
                        }
                    }
                    if(!f.dead && !f.boss && f.y > h - 20){ f.dead = true; if(!inv){ lives--; inv = 90; sfx.bad(); } }
                    if(!f.dead && inv === 0 && Math.abs(f.x - px) < f.r + 12 && Math.abs(f.y - (h - 45)) < f.r + 12){ f.dead = !f.boss; lives--; inv = 90; sfx.boom(); boom(px, h - 45, '#f87171', 16); }
                }
                foes = foes.filter(f => !f.dead);
                fbul.forEach(b => { b.x += b.vx; b.y += b.vy; });
                fbul = fbul.filter(b => { if(inv === 0 && Math.abs(b.x - px) < 16 && Math.abs(b.y - (h - 45)) < 18){ lives--; inv = 90; sfx.boom(); boom(px, h - 45, '#f87171', 16); return false; } return b.y < h + 10 && b.x > -10 && b.x < w + 10; });
                items.forEach(i => i.y += 2.2);
                items = items.filter(i => { if(Math.abs(i.x - px) < 26 && Math.abs(i.y - (h - 45)) < 26){ sfx.coin(); if(i.type === '⚡') power = Math.max(power, 600); else lives = Math.min(5, lives + 1); return false; } return i.y < h + 10; });
                parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.t--; }); parts = parts.filter(p => p.t > 0);
                if(lives <= 0) return gameOver(`웨이브 ${wave} · 점수 ${score}`);

            }, () => {
                const grd = ctx.createLinearGradient(0, 0, 0, h); grd.addColorStop(0, SK.bg[0]); grd.addColorStop(1, ice ? '#7dd3fc' : SK.bg[1]); ctx.fillStyle = grd; ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = ice ? '#fff' : '#94a3b8'; stars.forEach(s => ctx.fillRect(s.x, s.y, s.s * (ice ? 2 : 1), s.s * (ice ? 2 : 1)));

                foes.forEach(f => { emo(ctx, f.e, f.x, f.y, f.r * 2); if(f.boss){ ctx.fillStyle = '#334155'; ctx.fillRect(w / 2 - 100, 34, 200, 8); ctx.fillStyle = '#ef4444'; ctx.fillRect(w / 2 - 100, 34, 200 * f.hp / f.max, 8); } else if(f.hp > 1){ ctx.fillStyle = '#f87171'; ctx.fillRect(f.x - 12, f.y - 24, 8 * f.hp, 3); } });

                if(waveT > 0) banner(ctx, w, h, wave % 5 === 0 ? `⚠️ BOSS WAVE ${wave}` : `WAVE ${wave}`, t < 100 ? '←→ 이동 · 스페이스(누르고 있기) 발사 · 화면 드래그도 가능' : '');
            });
        }};

        // --- 다이노 점프: 선인장/새, 가변 점프, 숙이기, 점점 빨라짐 ---
        E.dino = { canvas: true, ctl: 'both', label: '⤴️ 점프', run(g){
            const { ctx, w, h, cv } = makeCanvas(); const night = !!g.cfg.night, GY = 380;
            let y = GY, vy = 0, ground = true, duck = false, obs = [], spd = night ? 7 : 6, dist = 0, nextObs = 60, clouds = [], t = 0, started = false, touchJump = false;

            listen(window, 'pointerup', () => { touchJump = false; });
            loop(() => {
                const jumpHeld = keys.up || keys.action || touchJump;

                    else { const n = Math.random() < .3 ? 2 : 1; obs.push({ x: w + 20, type: 'cactus', y: GY + 4, wd: 28 * n, ht: 44, n }); }

                }
                obs.forEach(o => o.x -= spd * (o.type === 'bird' ? 1.1 : 1));

                if(t % 90 === 0) clouds.push({ x: w + 40, y: rnd(40, 200) }); clouds.forEach(c => c.x -= spd * .3); clouds = clouds.filter(c => c.x > -60);
                const dh = duck ? 26 : 44, dx0 = 58, dx1 = 92, dy0 = y - dh;

                ctx.fillStyle = night ? '#334155' : '#a16207'; ctx.fillRect(0, GY + 6, w, h - GY);
                ctx.fillStyle = night ? '#475569' : '#ca8a04'; for(let i = 0; i < 16; i++){ const gx = ((i * 60 - dist) % w + w) % w; ctx.fillRect(gx, GY + 16, 20, 3); }
                obs.forEach(o => { if(o.type === 'cactus') for(let i = 0; i < o.n; i++) emo(ctx, '🌵', o.x - (o.n - 1) * 14 + i * 28, o.y - 20, 44); else emo(ctx, t % 20 < 10 ? '🦅' : '🐦', o.x, o.y - 14, 36, 0, false); });

            });
        }};

        // --- 플래피 버드: 여러 파이프, 점점 좁아지는 틈, 메달 ---
        E.flappy = { canvas: true, ctl: 'action', label: '🪽 날갯짓', run(g){
            const { ctx, w, h, cv } = makeCanvas(); const GR = g.cfg.grav, GAPW = 64;
            let y = h / 2, vy = 0, pipes = [], started = false, passed = 0, gx = 0, t = 0;
            const flap = () => { if(!G || G.over) return; started = true; vy = -7.2; sfx.jump(); };
            listen(cv, 'pointerdown', flap);
            G.onPress = k => { if(k === 'action' || k === 'up') flap(); };
            const addPipe = x => { const gap = Math.max(120, 165 - passed * 2); pipes.push({ x, top: rnd(50, h - 90 - gap), gap, done: false }); };
            addPipe(w + 40); addPipe(w + 40 + 230);
            loop(() => {
                t++; gx = (gx + 2.6) % 24;
                if(!started){ y = h / 2 + Math.sin(t / 10) * 8; return; }
                vy += GR; y += vy;
                pipes.forEach(p => p.x -= 2.6);
                if(pipes[0].x < -GAPW){ pipes.shift(); addPipe(pipes[pipes.length - 1].x + 230); }
                for(const p of pipes){
                    if(!p.done && p.x + GAPW < 100){ p.done = true; passed++; addScore(10); sfx.coin(); }
                    if(100 + 14 > p.x && 100 - 14 < p.x + GAPW && (y - 13 < p.top || y + 13 > p.top + p.gap)){ sfx.bad(); return end(); }
                }
                if(y > h - 40 || y < -20){ sfx.bad(); end(); }
            }, () => {
                const grd = ctx.createLinearGradient(0, 0, 0, h); grd.addColorStop(0, '#38bdf8'); grd.addColorStop(1, '#bae6fd'); ctx.fillStyle = grd; ctx.fillRect(0, 0, w, h);
                pipes.forEach(p => {
                    ctx.fillStyle = '#16a34a'; ctx.fillRect(p.x, 0, GAPW, p.top); ctx.fillRect(p.x, p.top + p.gap, GAPW, h);
                    ctx.fillStyle = '#15803d'; ctx.fillRect(p.x - 5, p.top - 22, GAPW + 10, 22); ctx.fillRect(p.x - 5, p.top + p.gap, GAPW + 10, 22);
                });
                ctx.fillStyle = '#ca8a04'; ctx.fillRect(0, h - 40, w, 40); ctx.fillStyle = '#65a30d'; ctx.fillRect(0, h - 40, w, 8);
                emo(ctx, '🐤', 100, y, 34, clamp(vy / 12, -0.5, 1.2), true);
                txt(ctx, passed, w / 2, 20, '#fff', 48, 'center');
                if(!started) banner(ctx, w, h, '탭하여 시작!', '스페이스 · ↑ · 화면 터치로 날갯짓');
            });
            const end = () => { const medal = passed >= 40 ? '🥇 금메달' : passed >= 20 ? '🥈 은메달' : passed >= 10 ? '🥉 동메달' : '메달 없음'; gameOver(`파이프 ${passed}개 통과 · ${medal}`); };
        }};

        // --- 기지 방어전: 적 종류 3가지, 성 체력, 웨이브, 폭탄(ACTION) ---
        E.defense = { canvas: true, ctl: 'action', label: '💥 폭탄 사용', run(g){
            const { ctx, w, h, cv } = makeCanvas();
            let hp = 10, foes = [], parts = [], wave = 0, toSpawn = 0, spawnT = 0, pause = 90, kills = 0, bombs = 1, flash = 0, fx = [];
            const TYPES = { norm: { e: '👾', hp: 1, sp: 1.1, r: 22, pts: 20 }, fast: { e: '🦇', hp: 1, sp: 2.2, r: 18, pts: 30 }, tank: { e: '👹', hp: 3, sp: .6, r: 28, pts: 60 } };
            const startWave = () => { wave++; toSpawn = 6 + wave * 3; pause = 90; };
            startWave();
            const kill = (f) => { f.dead = true; kills++; addScore(TYPES[f.t].pts); for(let i = 0; i < 10; i++) parts.push({ x: f.x, y: f.y, vx: Math.random() * 6 - 3, vy: Math.random() * 6 - 3, t: 25 }); if(kills % 15 === 0){ bombs++; fx.push({ x: f.x, y: f.y, s: '💣+1', t: 50 }); } };
            listen(cv, 'pointerdown', e => {
                const p = canvasPos(cv, e); let hit = false;
                for(const f of foes){ if(!f.dead && Math.hypot(f.x - p.x, f.y - p.y) < f.r + 16){ f.hp--; hit = true; sfx.hit(); if(f.hp <= 0){ kill(f); sfx.pop(); } break; } }
                if(!hit) fx.push({ x: p.x, y: p.y, s: '빗나감', t: 25 });
            });
            G.onPress = k => { if(k === 'action' && bombs > 0){ bombs--; flash = 20; sfx.boom(); foes.forEach(f => { if(!f.dead) kill(f); }); } };
            loop(() => {
                if(flash > 0) flash--;
                if(pause > 0){ pause--; }
                else if(toSpawn > 0 && --spawnT <= 0){
                    toSpawn--; spawnT = Math.max(14, 55 - wave * 4);
                    const r = Math.random(), t = wave >= 3 && r < .2 ? 'tank' : wave >= 2 && r < .5 ? 'fast' : 'norm';
                    foes.push({ t, x: rnd(40, w - 40), y: -30, hp: TYPES[t].hp, ph: Math.random() * 6 });
                }
                foes.forEach(f => { const T = TYPES[f.t]; f.y += T.sp * (1 + wave * .06); if(f.t === 'fast'){ f.ph += .08; f.x = clamp(f.x + Math.sin(f.ph) * 2.5, 20, w - 20); } if(f.y > h - 70 && !f.dead){ f.dead = true; hp--; sfx.bad(); flash = 8; } });
                foes = foes.filter(f => !f.dead);
                parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.t--; }); parts = parts.filter(p => p.t > 0);
                fx.forEach(f => { f.y -= .8; f.t--; }); fx = fx.filter(f => f.t > 0);
                if(hp <= 0) return gameOver(`웨이브 ${wave} · 처치 ${kills} · 점수 ${score}`);
                if(toSpawn === 0 && !foes.length){ addScore(wave * 50); startWave(); }
            }, () => {
                ctx.fillStyle = flash ? '#450a0a' : '#0f172a'; ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = '#1e3a8a'; ctx.fillRect(0, h - 70, w, 70);
                for(let i = 0; i < 6; i++) emo(ctx, i % 2 ? '🧱' : '🏰', 40 + i * 80, h - 36, 44);
                foes.forEach(f => { const T = TYPES[f.t]; emo(ctx, T.e, f.x, f.y, T.r * 2); if(T.hp > 1){ ctx.fillStyle = '#ef4444'; ctx.fillRect(f.x - 15, f.y - T.r - 8, 30 * f.hp / T.hp, 4); } });
                ctx.fillStyle = '#fbbf24'; parts.forEach(p => { ctx.globalAlpha = p.t / 25; ctx.fillRect(p.x, p.y, 4, 4); }); ctx.globalAlpha = 1;
                fx.forEach(f => { ctx.globalAlpha = Math.min(1, f.t / 20); txt(ctx, f.s, f.x, f.y, '#e2e8f0', 16, 'center'); }); ctx.globalAlpha = 1;
                txt(ctx, `성 체력 ${'🟩'.repeat(Math.max(0, hp))}`, 10, 10, '#fff', 14); txt(ctx, `WAVE ${wave}  💣×${bombs}`, w - 10, 10, '#e2e8f0', 16, 'right');
                if(pause > 0) banner(ctx, w, h, `WAVE ${wave}`, '적을 터치! 👹는 3번 · 15마리마다 폭탄 +1');
            });
        }};

        // --- 팩맨: 실제 미로, 점/파워 알약, 유령 4마리(추적 AI), 생명 3, 레벨 ---
        E.pacman = { canvas: true, ctl: 'dpad', run(g){
            const MAP = [
                "###################",
                "#........#........#",
                "#o##.###.#.###.##o#",
                "#.................#",
                "#.##.#.#####.#.##.#",
                "#....#...#...#....#",
                "####.### # ###.####",
                "   #.#       #.#   ",
                "####.# ##-## #.####",
                "    .  #   #  .    ",
                "####.# ##### #.####",
                "   #.#       #.#   ",
                "####.# ##### #.####",
                "#........#........#",
                "#.##.###.#.###.##.#",
                "#o.#.....P.....#.o#",
                "##.#.#.#####.#.#.##",
                "#....#...#...#....#",
                "#.######.#.######.#",
                "#.................#",
                "###################"];
            const R = MAP.length, C = MAP[0].length, T = 22, OX = 21, OY = 34;
            const { ctx, w, h } = makeCanvas(C * T + OX * 2, R * T + OY + 12);
            let dots, level = 1, lives = 3, frightT = 0, eatChain = 0, pauseT = 90, mouth = 0, msg = 'READY!';
            const wall = (x, y) => { if(y < 0 || y >= R) return true; if(x < 0 || x >= C) return y !== 9; const ch = MAP[y][x]; return ch === '#' || ch === '-'; };
            const DV = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] }, OPP = { up:'down', down:'up', left:'right', right:'left' };
            const resetDots = () => { dots = MAP.map(r => r.split('').map(ch => ch === '.' ? 1 : ch === 'o' ? 2 : 0)); };
            const countDots = () => dots.reduce((a, r) => a + r.filter(v => v).length, 0);
            let pac, ghosts;
            const GH = [{ c: '#ef4444', home: 0 }, { c: '#f9a8d4', home: 90 }, { c: '#22d3ee', home: 200 }, { c: '#fb923c', home: 320 }];
            const resetActors = () => {
                pac = { x: 9, y: 15, dir: 'left', want: 'left', p: 0, moving: false };
                ghosts = GH.map((d, i) => ({ ...d, x: 9, y: 7, dir: 'left', p: 0, wait: d.home, idx: i, fright: false, homeX: 8 + (i % 3) }));
                frightT = 0; pauseT = 90;
            };
            resetDots(); resetActors();
            G.onPress = k => { if(DV[k]) pac.want = k; };
            const wrapX = x => (x + C) % C;
            const step = (a, spd, chooseDir) => {
                a.p += spd;
                if(a.p >= 1){
                    a.p -= 1; const [dx, dy] = DV[a.dir]; a.x = wrapX(a.x + dx); a.y += dy;
                    chooseDir(a);
                }
            };
            const pacChoose = (a) => {
                if(!wall(a.x + DV[a.want][0], a.y + DV[a.want][1])) a.dir = a.want;
                if(wall(a.x + DV[a.dir][0], a.y + DV[a.dir][1])){ a.moving = false; a.p = 0; }
                const d = dots[a.y] && dots[a.y][a.x];
                if(d){ dots[a.y][a.x] = 0; if(d === 1){ addScore(10); if(countDots() % 2) tone(520, .04, 'square', .02); } else { addScore(50); frightT = Math.max(200, 420 - level * 60); eatChain = 0; ghosts.forEach(gh => { if(!gh.wait) { gh.fright = true; gh.dir = OPP[gh.dir]; } }); sfx.coin(); } }
            };
            const ghostChoose = (gh) => {
                const opts = Object.keys(DV).filter(k => k !== OPP[gh.dir] && !wall(gh.x + DV[k][0], gh.y + DV[k][1]));
                if(!opts.length){ gh.dir = OPP[gh.dir]; return; }
                if(gh.fright || Math.random() < (gh.idx === 2 ? .35 : .08)){ gh.dir = pick(opts); return; }
                let tx = pac.x, ty = pac.y;
                if(gh.idx === 1){ tx += DV[pac.dir][0] * 4; ty += DV[pac.dir][1] * 4; }
                if(gh.idx === 3 && Math.hypot(gh.x - pac.x, gh.y - pac.y) < 6){ tx = 0; ty = R; }
                opts.sort((a, b) => Math.hypot(gh.x + DV[a][0] - tx, gh.y + DV[a][1] - ty) - Math.hypot(gh.x + DV[b][0] - tx, gh.y + DV[b][1] - ty));
                gh.dir = opts[0];
            };
            const pos = a => { const [dx, dy] = DV[a.dir]; let x = a.x + dx * a.p; if(x > C - .5) x -= C; return { x: OX + x * T + T / 2, y: OY + (a.y + dy * a.p) * T + T / 2 }; };
            loop(() => {
                if(pauseT > 0){ pauseT--; if(!pauseT) msg = ''; return; }
                mouth += .25;
                // 팩맨 이동 (반대 방향은 즉시 전환)
                if(pac.want === OPP[pac.dir] && pac.moving){ const [dx, dy] = DV[pac.dir]; pac.x = wrapX(pac.x + dx); pac.y += dy; pac.p = 1 - pac.p; pac.dir = pac.want; if(pac.p >= 1) pac.p = 0; }
                if(!pac.moving){ pacChoose(pac); if(!wall(pac.x + DV[pac.dir][0], pac.y + DV[pac.dir][1])) pac.moving = true; }
                if(pac.moving) step(pac, .13, pacChoose);
                if(frightT > 0 && --frightT === 0) ghosts.forEach(gh => gh.fright = false);
                ghosts.forEach(gh => {
                    if(gh.wait > 0){ gh.wait--; if(!gh.wait){ gh.x = 9; gh.y = 7; gh.p = 0; gh.dir = pick(['left', 'right']); } return; }
                    step(gh, gh.fright ? .06 : Math.min(.125, .095 + level * .01), ghostChoose);
                    const a = pos(gh), b = pos(pac);
                    if(Math.hypot(a.x - b.x, a.y - b.y) < T * .7){
                        if(gh.fright){ eatChain++; const pts = 200 * Math.pow(2, eatChain - 1); addScore(pts); sfx.good(); gh.fright = false; gh.wait = 150; }
                        else { lives--; sfx.bad(); if(lives <= 0) return gameOver(`레벨 ${level} · 점수 ${score}`); resetActors(); msg = '앗! 다시 준비...'; }
                    }
                });
                if(countDots() === 0){ addScore(500 * level); sfx.win(); level++; resetDots(); resetActors(); msg = `LEVEL ${level}!`; }
            }, () => {
                ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
                for(let y = 0; y < R; y++) for(let x = 0; x < C; x++){
                    const ch = MAP[y][x], X = OX + x * T, Y = OY + y * T;
                    if(ch === '#'){ ctx.fillStyle = '#1e3a8a'; ctx.fillRect(X, Y, T, T); ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.strokeRect(X + 3, Y + 3, T - 6, T - 6); }
                    else if(ch === '-'){ ctx.fillStyle = '#f9a8d4'; ctx.fillRect(X, Y + T / 2 - 2, T, 4); }
                    const d = dots[y][x];
                    if(d === 1){ ctx.fillStyle = '#fde68a'; ctx.fillRect(X + T / 2 - 2, Y + T / 2 - 2, 4, 4); }
                    if(d === 2 && Math.floor(mouth) % 4 < 3){ ctx.fillStyle = '#fde68a'; ctx.beginPath(); ctx.arc(X + T / 2, Y + T / 2, 7, 0, 7); ctx.fill(); }
                }
                ghosts.forEach(gh => {
                    const p = gh.wait > 0 ? { x: OX + gh.homeX * T + T / 2, y: OY + 9 * T + T / 2 + Math.sin(mouth + gh.idx) * 2 } : pos(gh);
                    const blink = gh.fright && frightT < 90 && Math.floor(frightT / 10) % 2;
                    ctx.fillStyle = gh.fright ? (blink ? '#fff' : '#1d4ed8') : gh.c;
                    ctx.beginPath(); ctx.arc(p.x, p.y - 2, 9, Math.PI, 0); ctx.lineTo(p.x + 9, p.y + 9);
                    for(let i = 0; i < 3; i++){ ctx.lineTo(p.x + 9 - (i * 6 + 3), p.y + 5); ctx.lineTo(p.x + 9 - (i * 6 + 6), p.y + 9); }
                    ctx.closePath(); ctx.fill();
                    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p.x - 3.5, p.y - 3, 3, 0, 7); ctx.arc(p.x + 3.5, p.y - 3, 3, 0, 7); ctx.fill();
                    if(!gh.fright){ const [dx, dy] = DV[gh.dir]; ctx.fillStyle = '#1e3a8a'; ctx.beginPath(); ctx.arc(p.x - 3.5 + dx * 1.5, p.y - 3 + dy * 1.5, 1.5, 0, 7); ctx.arc(p.x + 3.5 + dx * 1.5, p.y - 3 + dy * 1.5, 1.5, 0, 7); ctx.fill(); }
                });
                const pp = pos(pac), ang = { right: 0, down: Math.PI / 2, left: Math.PI, up: -Math.PI / 2 }[pac.dir], m = pac.moving ? Math.abs(Math.sin(mouth)) * .7 : .3;
                ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.moveTo(pp.x, pp.y); ctx.arc(pp.x, pp.y, 10, ang + m / 2, ang - m / 2 + Math.PI * 2); ctx.closePath(); ctx.fill();
                txt(ctx, `LEVEL ${level}`, OX, 8, '#94a3b8', 16); txt(ctx, '🟡'.repeat(lives), w - OX, 8, '#fff', 14, 'right');
                if(msg) txt(ctx, msg, w / 2, OY + 11 * T + 3, '#facc15', 20, 'center');
            });
        }};

        // --- 리듬 탭: 4라인, 판정(PERFECT/GREAT/GOOD/MISS), 콤보, 체력, 등급 ---
        E.rhythm = { canvas: true, ctl: 'dpad', run(g){
            const { ctx, w, h, cv } = makeCanvas(); const LANES = 4, LW = 90, LX = (w - LANES * LW) / 2, JY = h - 70, beat = 60000 / g.cfg.bpm, travel = g.cfg.travel;
            const LCOL = ['#f472b6', '#38bdf8', '#4ade80', '#facc15'], LKEY = ['←/D', '↓/F', '↑/J', '→/K'], PITCH = [60, 64, 67, 72];
            // 악보 생성: 64박, 후반으로 갈수록 8분음표/동시치기 증가
            const notes = []; let lastLane = 0;
            for(let b = 4; b < 68; b++){
                const dens = b / 68;
                if(Math.random() < .82){ let l = rnd(0, 3); if(l === lastLane && Math.random() < .5) l = (l + rnd(1, 3)) % 4; lastLane = l; notes.push({ t: b * beat, lane: l }); if(dens > .5 && Math.random() < .15) notes.push({ t: b * beat, lane: (l + 2) % 4 }); }
                if(Math.random() < dens * .45) notes.push({ t: (b + .5) * beat, lane: rnd(0, 3) });
            }
            const total = notes.length; let t0 = performance.now() + 1500, combo = 0, maxCombo = 0, hp = 100, judge = '', judgeT = 0, cnt = { p: 0, g: 0, o: 0, m: 0 }, flash = [0, 0, 0, 0], lastBeat = -1;
            const now = () => performance.now() - t0;
            const hit = lane => {
                flash[lane] = 8; const tt = now();
                let best = null; for(const n of notes) if(!n.done && n.lane === lane && Math.abs(n.t - tt) < 180){ if(!best || Math.abs(n.t - tt) < Math.abs(best.t - tt)) best = n; }
                if(!best) return;
                const d = Math.abs(best.t - tt); best.done = true;
                if(d < 55){ judge = 'PERFECT'; cnt.p++; addScore(300 + combo * 2); }
                else if(d < 110){ judge = 'GREAT'; cnt.g++; addScore(200 + combo); }
                else { judge = 'GOOD'; cnt.o++; addScore(100); }
                combo++; maxCombo = Math.max(maxCombo, combo); hp = Math.min(100, hp + 2); judgeT = 30;
                tone(noteFreq(PITCH[lane] + (judge === 'PERFECT' ? 12 : 0)), .12, 'triangle', .09);
            };
            const LMAP = { left: 0, down: 1, up: 2, right: 3 };
            G.onPress = (k, e) => { if(e && e.key && e.key.length === 1) return; if(k in LMAP) hit(LMAP[k]); };   // D/F/J/K는 아래에서 따로 처리
            listen(window, 'keydown', e => { const i = ['d', 'f', 'j', 'k'].indexOf(e.key.toLowerCase()); if(i >= 0 && !e.repeat) hit(i); });
            listen(cv, 'pointerdown', e => { const p = canvasPos(cv, e), l = Math.floor((p.x - LX) / LW); if(l >= 0 && l < 4) hit(l); });
            loop(() => {
                const tt = now();
                const b = Math.floor(tt / beat); if(b !== lastBeat && b >= 0){ lastBeat = b; tone(b % 4 ? 180 : 110, .05, 'sine', b % 4 ? .04 : .08); }
                for(const n of notes) if(!n.done && tt - n.t > 180){ n.done = true; cnt.m++; combo = 0; judge = 'MISS'; judgeT = 30; hp -= 9; sfx.bad(); }
                for(let i = 0; i < 4; i++) if(flash[i] > 0) flash[i]--;
                if(judgeT > 0) judgeT--;
                if(hp <= 0) return gameOver(`체력 소진! 최대 콤보 ${maxCombo} · 점수 ${score}`);
                if(notes.every(n => n.done) && tt > notes[notes.length - 1].t + 600){
                    const acc = (cnt.p + cnt.g * .7 + cnt.o * .4) / total, rank = acc > .95 ? 'S' : acc > .85 ? 'A' : acc > .7 ? 'B' : acc > .5 ? 'C' : 'D';
                    return win(`랭크 ${rank} (정확도 ${Math.round(acc * 100)}%)\nPERFECT ${cnt.p} · GREAT ${cnt.g} · GOOD ${cnt.o} · MISS ${cnt.m}\n최대 콤보 ${maxCombo}`);
                }
            }, () => {
                const tt = now();
                ctx.fillStyle = '#0b1020'; ctx.fillRect(0, 0, w, h);
                for(let i = 0; i < 4; i++){
                    ctx.fillStyle = i % 2 ? '#111a33' : '#0f172a'; ctx.fillRect(LX + i * LW, 0, LW, h);
                    if(flash[i]){ ctx.fillStyle = LCOL[i] + '33'; ctx.fillRect(LX + i * LW, 0, LW, JY); }
                    ctx.fillStyle = flash[i] ? LCOL[i] : '#334155'; rrect(ctx, LX + i * LW + 6, JY - 4, LW - 12, 22, 8); ctx.fill();
                    txt(ctx, LKEY[i], LX + i * LW + LW / 2, JY + 30, '#64748b', 14, 'center');
                }
                for(const n of notes){ if(n.done) continue; const y = JY - (n.t - tt) / travel * JY; if(y < -20 || y > h) continue; ctx.fillStyle = LCOL[n.lane]; rrect(ctx, LX + n.lane * LW + 8, y - 8, LW - 16, 18, 8); ctx.fill(); }
                ctx.fillStyle = '#1e293b'; ctx.fillRect(10, 10, 120, 10); ctx.fillStyle = hp > 30 ? '#22c55e' : '#ef4444'; ctx.fillRect(10, 10, 120 * hp / 100, 10);
                txt(ctx, `진행 ${notes.filter(n => n.done).length}/${total}`, w - 10, 8, '#94a3b8', 14, 'right');
                if(judgeT > 0){ txt(ctx, judge, w / 2, h / 2 - 40, { PERFECT: '#facc15', GREAT: '#4ade80', GOOD: '#38bdf8', MISS: '#f87171' }[judge], 36, 'center'); if(combo > 1) txt(ctx, `${combo} COMBO`, w / 2, h / 2 + 2, '#e2e8f0', 20, 'center'); }
                if(tt < 0) banner(ctx, w, h, `시작까지 ${Math.ceil(-tt / 1000)}...`, '노트가 판정선에 닿을 때 해당 라인을 누르세요');
            });
        }};

        // --- 볼링: 10프레임 정식 점수 계산, 조준 → 방향 → 투구, 핀 물리 ---
        E.bowling = { canvas: true, ctl: 'action', label: '🎳 결정 / 던지기', run(g){
            const { ctx, w, h, cv } = makeCanvas(); const L0 = 150, L1 = 330, BR = 12, PR = 8;

        // --- 우주 탐험: 4방향 이동, 연료 관리, 보석/연료/보호막 수집 ---
        E.space = { canvas: true, ctl: 'dpad', run(g){
            const { ctx, w, h, cv } = makeCanvas();

        // --- 구구단 운석: 정답 운석을 쏘아 맞히기, 20문제 ---
        E.mathmeteor = { canvas: true, ctl: 'both', label: '🔫 발사', run(g){
            const { ctx, w, h, cv } = makeCanvas(); const LX = [100, 240, 380], GOAL = 20;
            let lane = 1, cx = 240, q = null, rocks = [], shots = [], lives = 3, solved = 0, speed = .9, fx = [], waitT = 60;
            const newQ = () => {
                const a = rnd(2, 9), b = rnd(1, 9), ans = a * b, set = new Set([ans]);
                while(set.size < 3){ const c = pick([ans + a, ans - a, ans + b, ans - b, (a + 1) * b, a * (b + 1), ans + rnd(1, 5), ans - rnd(1, 5)]); if(c > 0) set.add(c); }

            loop(() => {

                fx.forEach(f => { f.t--; f.y -= .5; }); fx = fx.filter(f => f.t > 0);

                for(const s of shots) for(const r of rocks){
                    if(!r.hit && Math.abs(s.x - r.x) < 40 && Math.abs(s.y - r.y) < 34){
                        s.y = -99; r.hit = true;
                        if(r.v === q.ans){ solved++; addScore(100 + Math.max(0, Math.floor((h - r.y) / 5))); sfx.good(); fx.push({ x: r.x, y: r.y, s: '정답! 💥', t: 45, c: '#4ade80' }); speed = Math.min(2.6, speed + .08); if(solved >= GOAL) return win(`${GOAL}문제 모두 성공! 점수 ${score}`); waitT = 30; shots = []; newQ(); return; }
                        else return lose(`땡! ${q.a}×${q.b}=${q.ans}`);

            }, () => {

        function onSwipe(el, fn){

        }

        // --- 2048: 실제 4×4 합치기 규칙, 스와이프/방향키, 승리·패배 판정 ---
        E['2048'] = { ctl: 'dpad', run(g){
            const wrap = makeWrap(); const N = 4;
            let board = Array.from({length: N}, () => Array(N).fill(0)), fresh = null, merged = [], moves = 0;
            const COL = { 0:'#1e293b', 2:'#eee4da', 4:'#ede0c8', 8:'#f2b179', 16:'#f59563', 32:'#f67c5f', 64:'#f65e3b', 128:'#edcf72', 256:'#edcc61', 512:'#edc850', 1024:'#edc53f', 2048:'#edc22e' };
            const addTile = () => { const empty = []; board.forEach((r, y) => r.forEach((v, x) => { if(!v) empty.push([x, y]); })); if(!empty.length) return; const [x, y] = pick(empty); board[y][x] = Math.random() < .9 ? 2 : 4; fresh = x + ',' + y; };
            wrap.innerHTML = statBar([['t-moves', '이동 0'], ['t-max', '최대 타일 2']]) + `<div id="b2048" class="grid grid-cols-4 gap-2 bg-slate-700 p-2 rounded-xl w-full max-w-[340px] aspect-square no-touch"></div><p class="text-xs text-slate-500 mt-3">방향키 · 화면 방향 버튼 · 스와이프로 이동</p>`;
            const el = $('b2048');
            const render = () => {
                el.innerHTML = board.map((r, y) => r.map((v, x) => {
                    const c = COL[v] || '#3c3a32', fs = v >= 1024 ? 'text-xl md:text-2xl' : v >= 128 ? 'text-2xl md:text-3xl' : 'text-3xl md:text-4xl';
                    const anim = fresh === x + ',' + y || merged.includes(x + ',' + y) ? 'pop' : '';
                    return `<div class="rounded-lg flex items-center justify-center font-black ${fs} ${anim}" style="background:${c};color:${v > 4 ? '#fff' : '#776e65'}">${v || ''}</div>`;
                }).join('')).join('');
                setTxt('t-moves', '이동 ' + moves); setTxt('t-max', '최대 타일 ' + Math.max(...board.flat()));
            };
            const slide = row => { const a = row.filter(v => v), out = [], m = []; for(let i = 0; i < a.length; i++){ if(a[i] === a[i + 1]){ out.push(a[i] * 2); addScore(a[i] * 2); m.push(out.length - 1); i++; } else out.push(a[i]); } while(out.length < N) out.push(0); return { out, m }; };
            const canMove = () => { for(let y = 0; y < N; y++) for(let x = 0; x < N; x++){ const v = board[y][x]; if(!v || (x < N - 1 && board[y][x + 1] === v) || (y < N - 1 && board[y + 1][x] === v)) return true; } return false; };
            let won = false;
            const move = dir => {
                if(G.over) return;
                const before = JSON.stringify(board); merged = [];
                for(let i = 0; i < N; i++){
                    let line = [];
                    for(let j = 0; j < N; j++){ const [x, y] = dir === 'left' ? [j, i] : dir === 'right' ? [N - 1 - j, i] : dir === 'up' ? [i, j] : [i, N - 1 - j]; line.push(board[y][x]); }
                    const { out, m } = slide(line);
                    for(let j = 0; j < N; j++){ const [x, y] = dir === 'left' ? [j, i] : dir === 'right' ? [N - 1 - j, i] : dir === 'up' ? [i, j] : [i, N - 1 - j]; board[y][x] = out[j]; if(m.includes(j)) merged.push(x + ',' + y); }
                }
                if(JSON.stringify(board) === before){ shakeEl(el); return; }
                moves++; addTile(); render(); merged.length ? sfx.pop() : sfx.tick();
                if(!won && board.flat().includes(2048)){ won = true; return win(`2048 달성! ${moves}번 이동 · 점수 ${score}`); }
                if(!canMove()) after(() => gameOver(`최대 타일 ${Math.max(...board.flat())} · 점수 ${score}`), 400);
            };
            G.onPress = k => { if(k !== 'action') move(k); };
            onSwipe(el, move);
            addTile(); addTile(); render();
        }};

        // --- 지뢰찾기: 첫 클릭 안전, 숫자 힌트, 자동 열기, 깃발(우클릭/길게 누르기/깃발 모드), 타이머 ---
        E.mine = { ctl: 'none', run(g){
